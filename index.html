<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصة الاحترافية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .cyber-card { border-radius: 2rem; border: 1px solid rgba(6, 182, 212, 0.1); transition: 0.3s; }
        .btn-cyan { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; }
        input, textarea { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; width: 100%; padding: 1rem; border-radius: 1rem; outline: none; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950 p-4">
        <div class="glass p-8 w-full max-w-md rounded-[2.5rem] text-center border border-cyan-500/20 shadow-2xl">
            <h1 class="text-3xl font-black mb-6 text-white">Z AHMED <span class="text-cyan-400">TECH</span></h1>
            
            <div class="space-y-3 mb-6">
                <input id="email" type="email" placeholder="البريد الإلكتروني">
                <input id="pass" type="password" placeholder="كلمة المرور">
                <button onclick="login()" class="w-full btn-cyan py-4 rounded-xl font-bold shadow-lg">دخول</button>
            </div>

            <div class="flex items-center gap-2 mb-6"><hr class="flex-grow border-slate-800 text-slate-800"> <span class="text-[10px] text-slate-500 font-bold">أو عبر</span> <hr class="flex-grow border-slate-800"></div>

            <div class="grid grid-cols-1 gap-3">
                <button onclick="googleSignIn()" class="w-full py-3 bg-white text-black rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-200 transition">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="18"> Google
                </button>
                <button onclick="phoneSignIn()" class="w-full py-3 bg-emerald-600 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90 transition">
                    <i class="fas fa-phone-alt"></i> رقم الهاتف
                </button>
            </div>
            <div id="recaptcha-container" class="mt-4"></div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="text-xl font-black text-white">Z AHMED <span class="text-cyan-400">TECH</span></div>
            <div class="flex items-center gap-4">
                <span id="navRole" class="text-[10px] bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full font-black uppercase"></span>
                <button onclick="logout()" class="text-red-500"><i class="fas fa-power-off text-lg"></i></button>
            </div>
        </nav>

        <div class="container mx-auto p-4 lg:p-10 grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="space-y-4">
                <div id="staffPanel" class="hidden glass p-6 rounded-[2.5rem] border-r-4 border-cyan-500 space-y-2">
                    <p class="text-[10px] text-slate-500 font-black mb-4">أدوات الإدارة</p>
                    <button onclick="openTab('addPost')" class="w-full text-right p-3 hover:bg-slate-800 rounded-xl flex items-center gap-3 transition"><i class="fas fa-plus text-cyan-400"></i> نشر جديد</button>
                    <button id="adminOnlyBtn" onclick="openTab('manageUsers')" class="hidden w-full text-right p-3 hover:bg-slate-800 rounded-xl flex items-center gap-3 transition"><i class="fas fa-users-cog text-cyan-400"></i> إدارة الحسابات</button>
                    <button onclick="openTab('supportMsgs')" class="w-full text-right p-3 hover:bg-slate-800 rounded-xl flex items-center gap-3 transition"><i class="fas fa-envelope text-cyan-400"></i> الرسائل</button>
                </div>
                <div class="glass p-6 rounded-[2.5rem] border-r-4 border-emerald-500">
                    <button onclick="openTab('contactSupport')" class="w-full text-right p-3 bg-emerald-500/10 text-emerald-400 rounded-xl font-bold">تواصل مع الدعم</button>
                </div>
            </div>

            <div class="lg:col-span-3">
                <div id="postsFeed" class="grid grid-cols-1 gap-8"></div>
            </div>
        </div>
    </div>

    <div id="mainModal" class="hidden fixed inset-0 z-[2000] bg-black/95 flex items-center justify-center p-4">
        <div class="glass w-full max-w-3xl p-8 rounded-[3rem] relative max-h-[90vh] overflow-y-auto border border-white/10">
            <button onclick="closeModal()" class="absolute top-6 left-6 text-2xl hover:text-red-500 transition"><i class="fas fa-times-circle"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com";
        let me = null;

        // الدخول بالإيميل
        async function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } catch(err) { Swal.fire('خطأ', 'تأكد من تفعيل Email/Password في Firebase', 'error'); }
        }

        // جوجل
        async function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try { const res = await auth.signInWithPopup(provider); handleUser(res.user); } catch(e) { console.error(e); }
        }

        // الهاتف
        async function phoneSignIn() {
            const { value: phone } = await Swal.fire({ title: 'ادخل رقم هاتفك', input: 'tel', inputPlaceholder: '+2010...', showCancelButton: true });
            if (!phone) return;
            const verifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' });
            try {
                const confirmation = await auth.signInWithPhoneNumber(phone, verifier);
                const { value: code } = await Swal.fire({ title: 'ادخل كود التحقق المرسل', input: 'text', confirmButtonText: 'تأكيد' });
                const res = await confirmation.confirm(code);
                handleUser(res.user);
            } catch(e) { Swal.fire('خطأ', 'ربما تجاوزت عدد الرسائل اليومي أو الرقم غير صحيح', 'error'); }
        }

        async function handleUser(user) {
            const snap = await db.ref('users/' + user.uid).once('value');
            if(!snap.exists()) {
                await db.ref('users/' + user.uid).set({
                    uid: user.uid, email: user.email || user.phoneNumber, 
                    name: user.displayName || "مستخدم جديد", 
                    role: (user.email === MASTER_ADMIN) ? 'admin' : 'visitor', 
                    pass: 'Social/Phone Login'
                });
            }
            location.reload();
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('authScreen').classList.add('hidden');
                        document.getElementById('mainApp').classList.remove('hidden');
                        document.getElementById('navRole').innerText = me.role;
                        const isAdmin = me.role === 'admin' || me.email === MASTER_ADMIN;
                        document.getElementById('staffPanel').classList.toggle('hidden', !isAdmin && me.role !== 'worker');
                        document.getElementById('adminOnlyBtn').classList.toggle('hidden', !isAdmin);
                        loadPosts();
                    }
                });
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        function openTab(type) {
            const modal = document.getElementById('mainModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            content.innerHTML = '';

            if(type === 'addPost') {
                content.innerHTML = `
                    <h2 class="text-2xl font-black mb-6 text-cyan-400">📝 منشور جديد</h2>
                    <div class="space-y-4 text-right">
                        <input id="pTitle" type="text" placeholder="العنوان">
                        <input id="pImg" type="url" placeholder="رابط الصورة">
                        <textarea id="pDesc" rows="5" placeholder="المحتوى..."></textarea>
                        <button onclick="submitPost()" class="w-full btn-cyan py-4 rounded-xl font-bold">نشر</button>
                    </div>`;
            }
            else if(type === 'manageUsers') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6">👥 الحسابات</h2><div id="uList" class="space-y-3"></div>`;
                db.ref('users').on('value', snap => {
                    const list = document.getElementById('uList'); list.innerHTML = '';
                    snap.forEach(u => {
                        const user = u.val();
                        list.innerHTML += `<div class="p-4 bg-slate-900 rounded-2xl flex justify-between items-center text-right border border-slate-800">
                            <div><p class="font-bold">${user.name}</p><p class="text-[10px] text-slate-500">${user.email}</p></div>
                            <button onclick="deleteUser('${u.key}')" class="text-red-500"><i class="fas fa-trash"></i></button>
                        </div>`;
                    });
                });
            }
        }

        async function submitPost() {
            const title = document.getElementById('pTitle').value;
            const img = document.getElementById('pImg').value;
            const desc = document.getElementById('pDesc').value;
            if(!title || !img || !desc) return;
            await db.ref('posts').push({ title, img, desc, author: me.name, time: Date.now() });
            Swal.fire('تم', 'نُشر بنجاح', 'success'); closeModal();
        }

        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const feed = document.getElementById('postsFeed'); feed.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    feed.insertAdjacentHTML('afterbegin', `
                        <div class="glass cyber-card p-6 text-right animate__animated animate__fadeIn">
                            <img src="${post.img}" class="w-full h-64 object-cover rounded-xl mb-4">
                            <h3 class="text-2xl font-black text-white mb-2">${post.title}</h3>
                            <p class="text-slate-400 text-sm mb-4">${post.desc}</p>
                            <div class="text-[10px] text-slate-600 border-t border-white/5 pt-4">الناشر: ${post.author}</div>
                        </div>`);
                });
            });
        }

        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }
        function logout() { auth.signOut().then(() => location.reload()); }
        async function deleteUser(id) { db.ref('users/'+id).remove(); }
    </script>
</body>
</html>
