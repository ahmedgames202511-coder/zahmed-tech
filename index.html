<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصة الاحترافية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        
        :root { --primary: #06b6d4; --dark: #020617; }
        body { font-family: 'Cairo', sans-serif; background: var(--dark); color: #e2e8f0; overflow-x: hidden; }
        
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .cyber-card { border-radius: 2rem; box-shadow: 0 0 20px rgba(6, 182, 212, 0.1); transition: 0.3s; }
        .cyber-card:hover { border-color: var(--primary); box-shadow: 0 0 30px rgba(6, 182, 212, 0.3); }
        
        input, select, textarea { 
            background: #0f172a !important; 
            border: 1px solid #1e293b !important; 
            color: white !important;
            transition: 0.3s !important;
        }
        input:focus { border-color: var(--primary) !important; box-shadow: 0 0 10px rgba(6, 182, 212, 0.2); }
        
        .btn-grad { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; transition: 0.4s; }
        .btn-grad:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(6, 182, 212, 0.4); }

        /* شاشة الدخول */
        #authScreen {
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] p-4 animate__animated">
        <div class="glass p-8 w-full max-w-md cyber-card animate__animated animate__zoomIn">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black tracking-widest">Z AHMED <span class="text-cyan-400">TECH</span></h1>
                <p class="text-slate-400 text-sm mt-2">مرحباً بك في مستقبل التكنولوجيا</p>
            </div>

            <div class="space-y-4">
                <div class="flex gap-2 p-1 bg-slate-900 rounded-xl mb-4">
                    <button id="tabLogin" onclick="switchAuth('login')" class="flex-1 py-2 rounded-lg bg-cyan-500 font-bold">دخول</button>
                    <button id="tabRegister" onclick="switchAuth('register')" class="flex-1 py-2 rounded-lg font-bold">جديد</button>
                </div>

                <input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full p-4 rounded-xl outline-none">
                <input id="pass" type="password" placeholder="كلمة المرور" class="w-full p-4 rounded-xl outline-none">
                <div id="regExtra" class="hidden animate__animated animate__fadeIn">
                    <input id="phone" type="text" placeholder="رقم الهاتف" class="w-full p-4 rounded-xl outline-none mt-4">
                </div>

                <div class="py-2">
                    <label class="text-xs text-slate-500 mr-2">سجل دخولك بصفتك:</label>
                    <select id="role" class="w-full p-4 rounded-xl outline-none mt-1">
                        <option value="visitor">زائر (Visitor)</option>
                        <option value="worker">موظف (Staff)</option>
                        <option value="admin">مدير (Admin)</option>
                    </select>
                </div>

                <button onclick="processAuth()" id="mainAuthBtn" class="w-full btn-grad py-4 rounded-xl font-black mt-4">تسجيل الدخول</button>

                <div class="relative py-4">
                    <hr class="border-slate-800">
                    <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-950 px-2 text-xs text-slate-500">أو</span>
                </div>

                <button onclick="loginGoogle()" class="w-full bg-white text-black py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-200 transition">
                    <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5"> بواسطة Google
                </button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-cyan-500/20">
            <div class="text-xl font-black">Z AHMED <span class="text-cyan-400">TECH</span></div>
            <div class="flex items-center gap-4">
                <div class="text-right hidden sm:block">
                    <p id="navName" class="text-sm font-bold leading-none"></p>
                    <span id="navRoleLabel" class="text-[10px] text-cyan-400 font-bold uppercase tracking-tighter"></span>
                </div>
                <button onclick="logout()" class="w-10 h-10 rounded-full bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition flex items-center justify-center">
                    <i class="fas fa-power-off"></i>
                </button>
            </div>
        </nav>

        <div class="container mx-auto p-4 lg:p-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="space-y-6">
                <div id="adminPanel" class="hidden glass p-6 rounded-[2rem] border-t-2 border-cyan-500">
                    <h3 class="font-black text-cyan-400 mb-4 flex items-center gap-2"><i class="fas fa-shield-halved"></i> لوحة المدير</h3>
                    <div class="grid gap-2">
                        <button onclick="openTab('addPost')" class="w-full text-right p-3 hover:bg-cyan-500/10 rounded-xl transition"><i class="fas fa-plus-circle ml-2"></i> نشر محتوى</button>
                        <button onclick="openTab('manageUsers')" class="w-full text-right p-3 hover:bg-cyan-500/10 rounded-xl transition"><i class="fas fa-users-gear ml-2"></i> رقابة الأعضاء</button>
                        <button onclick="openTab('pending')" class="w-full text-right p-3 hover:bg-cyan-500/10 rounded-xl transition flex justify-between items-center">
                            <span><i class="fas fa-clock ml-2"></i> الطلبات المعلقة</span>
                            <span id="badgePending" class="bg-red-500 text-white text-[10px] px-2 py-1 rounded-full">0</span>
                        </button>
                    </div>
                </div>

                <div id="workerPanel" class="hidden glass p-6 rounded-[2rem] border-t-2 border-amber-500">
                    <h3 class="font-black text-amber-500 mb-4 flex items-center gap-2"><i class="fas fa-pen-nib"></i> الموظفين</h3>
                    <button onclick="openTab('addPost')" class="w-full text-right p-3 hover:bg-amber-500/10 rounded-xl transition"><i class="fas fa-paper-plane ml-2"></i> اقتراح منشور</button>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6">
                <h2 class="text-2xl font-black mb-6 flex items-center gap-3">
                    <span class="w-2 h-8 bg-cyan-500 rounded-full"></span> المنشورات الأخيرة
                </h2>
                <div id="postsFeed" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    </div>
            </div>
        </div>
    </div>

    <div id="mainModal" class="hidden fixed inset-0 z-[2000] bg-black/90 flex items-center justify-center p-4">
        <div class="glass w-full max-w-4xl max-h-[90vh] overflow-y-auto p-8 rounded-[2.5rem] relative animate__animated animate__zoomInUp">
            <button onclick="closeModal()" class="absolute top-6 left-6 text-2xl text-slate-500 hover:text-white transition"><i class="fas fa-times-circle"></i></button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // --- 1. إعدادات Firebase الخاصة بك ---
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com"; // إيميلك يا أحمد
        let userData = null;
        let currentAuthMode = 'login';

        // --- 2. نظام الدخول (Logic) ---
        function switchAuth(mode) {
            currentAuthMode = mode;
            document.getElementById('tabLogin').className = mode === 'login' ? 'flex-1 py-2 rounded-lg bg-cyan-500 font-bold' : 'flex-1 py-2 rounded-lg font-bold';
            document.getElementById('tabRegister').className = mode === 'register' ? 'flex-1 py-2 rounded-lg bg-cyan-500 font-bold' : 'flex-1 py-2 rounded-lg font-bold';
            document.getElementById('regExtra').classList.toggle('hidden', mode === 'login');
            document.getElementById('mainAuthBtn').innerText = mode === 'login' ? 'تسجيل الدخول' : 'إنشاء حساب جديد';
        }

        async function processAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('pass').value;
            const phone = document.getElementById('phone').value.trim();
            const role = document.getElementById('role').value;

            if(!email || !password) return Swal.fire('تنبيه', 'املأ البيانات الأساسية أولاً', 'warning');

            try {
                if(currentAuthMode === 'register') {
                    const res = await auth.createUserWithEmailAndPassword(email, password);
                    await db.ref('users/' + res.user.uid).set({
                        uid: res.user.uid, name: email.split('@')[0], email, pass: password, phone, role, status: 'active'
                    });
                    Swal.fire('مبروك', 'تم إنشاء الحساب بنجاح', 'success');
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                }
            } catch(e) { Swal.fire('خطأ', e.message, 'error'); }
        }

        async function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            const selectedRole = document.getElementById('role').value;
            try {
                const res = await auth.signInWithPopup(provider);
                const user = res.user;
                // فحص إذا كان المستخدم مسجلاً مسبقاً
                const snap = await db.ref('users/' + user.uid).once('value');
                if(!snap.exists()) {
                    await db.ref('users/' + user.uid).set({
                        uid: user.uid, name: user.displayName, email: user.email, 
                        pass: 'دخول جوجل', phone: 'غير متاح', 
                        role: user.email === MASTER_ADMIN ? 'admin' : selectedRole, 
                        status: 'active'
                    });
                }
            } catch(e) { Swal.fire('خطأ', 'فشل الدخول بجوجل', 'error'); }
        }

        // مراقبة حالة المستخدم
        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    userData = snap.val();
                    if(userData && userData.status === 'banned') {
                        Swal.fire('محظور', 'لقد تم طردك من المنصة', 'error');
                        auth.signOut();
                        return;
                    }
                    if(userData) startApp();
                });
            } else { showAuth(); }
        });

        function showAuth() {
            document.getElementById('authScreen').classList.remove('animate__fadeOutUp');
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('mainApp').classList.add('hidden');
        }

        function startApp() {
            document.getElementById('authScreen').classList.add('animate__fadeOutUp');
            setTimeout(() => {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('animate__animated', 'animate__fadeIn');
                renderUI();
            }, 600);
        }

        function renderUI() {
            document.getElementById('navName').innerText = userData.name;
            document.getElementById('navRoleLabel').innerText = userData.role;
            
            // إظهار اللوحات حسب الصلاحية
            const isAdmin = userData.role === 'admin' || userData.email === MASTER_ADMIN;
            document.getElementById('adminPanel').classList.toggle('hidden', !isAdmin);
            document.getElementById('workerPanel').classList.toggle('hidden', userData.role !== 'worker');

            if(isAdmin) {
                db.ref('posts').orderByChild('status').equalTo('pending').on('value', s => {
                    document.getElementById('badgePending').innerText = s.numChildren() || 0;
                });
            }
            loadPosts();
        }

        // --- 3. نظام المنشورات ---
        function loadPosts() {
            db.ref('posts').orderByChild('status').equalTo('active').on('value', snap => {
                const feed = document.getElementById('postsFeed');
                feed.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    const id = p.key;
                    feed.innerHTML += `
                        <div class="glass rounded-[2rem] overflow-hidden cyber-card animate__animated animate__fadeInUp">
                            <img src="${post.img}" class="w-full h-48 object-cover">
                            <div class="p-6">
                                <h3 class="text-xl font-bold text-cyan-400 mb-2">${post.title}</h3>
                                <p class="text-slate-400 text-sm line-clamp-3 mb-4">${post.desc}</p>
                                <div class="flex justify-between items-center">
                                    <a href="${post.link || '#'}" target="_blank" class="text-xs bg-slate-800 px-4 py-2 rounded-full hover:bg-cyan-500 transition">عرض التفاصيل</a>
                                    ${userData.role === 'admin' ? `<button onclick="deletePost('${id}')" class="text-red-500"><i class="fas fa-trash"></i></button>` : ''}
                                </div>
                            </div>
                        </div>`;
                });
            });
        }

        function openTab(type) {
            const modal = document.getElementById('mainModal');
            const body = document.getElementById('modalBody');
            modal.classList.remove('hidden');
            body.innerHTML = '';

            if(type === 'addPost') {
                body.innerHTML = `
                    <h2 class="text-2xl font-black mb-6">✨ نشر خبر تقني جديد</h2>
                    <div class="space-y-4">
                        <input id="pTitle" type="text" placeholder="عنوان الخبر" class="w-full p-4 rounded-xl">
                        <input id="pImg" type="text" placeholder="رابط الصورة (URL)" class="w-full p-4 rounded-xl">
                        <input id="pLink" type="text" placeholder="رابط المصدر (اختياري)" class="w-full p-4 rounded-xl">
                        <textarea id="pDesc" rows="4" placeholder="اكتب تفاصيل الخبر هنا..." class="w-full p-4 rounded-xl"></textarea>
                        <button onclick="submitPost()" class="w-full btn-grad py-4 rounded-xl font-black">نشر الآن</button>
                    </div>`;
            } 
            else if(type === 'manageUsers') {
                body.innerHTML = `
                    <h2 class="text-2xl font-black mb-6 text-cyan-400">🚨 رقابة حسابات المنصة</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-right border-collapse">
                            <thead>
                                <tr class="text-slate-500 text-sm border-b border-slate-800">
                                    <th class="p-4">العضو</th>
                                    <th class="p-4">الباسورد</th>
                                    <th class="p-4">الموبايل</th>
                                    <th class="p-4">الدور</th>
                                    <th class="p-4">إجراء</th>
                                </tr>
                            </thead>
                            <tbody id="usersList"></tbody>
                        </table>
                    </div>`;
                db.ref('users').on('value', snap => {
                    const list = document.getElementById('usersList');
                    list.innerHTML = '';
                    snap.forEach(u => {
                        const user = u.val();
                        if(user.email === MASTER_ADMIN) return;
                        list.innerHTML += `
                            <tr class="border-b border-slate-800/50 hover:bg-slate-800/30 transition">
                                <td class="p-4">
                                    <div class="font-bold">${user.name}</div>
                                    <div class="text-[10px] text-slate-500">${user.email}</div>
                                </td>
                                <td class="p-4 text-red-400 font-mono text-xs">${user.pass}</td>
                                <td class="p-4 text-xs">${user.phone}</td>
                                <td class="p-4"><span class="bg-slate-800 px-2 py-1 rounded text-[10px]">${user.role}</span></td>
                                <td class="p-4">
                                    <button onclick="deleteUser('${u.key}')" class="text-red-500 hover:scale-125 transition"><i class="fas fa-user-xmark"></i></button>
                                </td>
                            </tr>`;
                    });
                });
            }
            else if(type === 'pending') {
                body.innerHTML = `<h2 class="text-2xl font-black mb-6">⏳ طلبات بانتظار الموافقة</h2><div id="pendingList" class="grid gap-4"></div>`;
                db.ref('posts').orderByChild('status').equalTo('pending').on('value', snap => {
                    const list = document.getElementById('pendingList');
                    list.innerHTML = '';
                    snap.forEach(p => {
                        const post = p.val();
                        list.innerHTML += `
                            <div class="glass p-4 rounded-2xl flex justify-between items-center border-r-4 border-amber-500">
                                <div>
                                    <h4 class="font-bold text-amber-500">${post.title}</h4>
                                    <p class="text-[10px] text-slate-500">بواسطة: ${post.authorName}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="approvePost('${p.key}')" class="bg-green-500 text-white px-4 py-1 rounded-lg text-xs">قبول</button>
                                    <button onclick="deletePost('${p.key}')" class="bg-red-500 text-white px-4 py-1 rounded-lg text-xs">رفض</button>
                                </div>
                            </div>`;
                    });
                });
            }
        }

        // --- 4. وظائف الأوامر (Actions) ---
        async function submitPost() {
            const title = document.getElementById('pTitle').value;
            const img = document.getElementById('pImg').value;
            const desc = document.getElementById('pDesc').value;
            const link = document.getElementById('pLink').value;
            
            if(!title || !img) return Swal.fire('تنبيه', 'أضف العنوان والصورة على الأقل', 'info');

            const status = (userData.role === 'admin' || userData.email === MASTER_ADMIN) ? 'active' : 'pending';
            
            await db.ref('posts').push({
                title, img, desc, link, status,
                authorName: userData.name,
                time: Date.now()
            });
            
            Swal.fire('نجاح', status === 'active' ? 'تم النشر بنجاح' : 'تم إرسال المنشور للمراجعة', 'success');
            closeModal();
        }

        function approvePost(id) { db.ref('posts/' + id).update({ status: 'active' }); }
        function deletePost(id) { if(confirm('حذف هذا المنشور؟')) db.ref('posts/' + id).remove(); }
        
        async function deleteUser(uid) {
            if(confirm('هل أنت متأكد من طرد هذا العضو نهائياً؟')) {
                await db.ref('users/' + uid).update({ status: 'banned' });
                // أو يمكنك استخدام .remove() للمسح الكلي
                // await db.ref('users/' + uid).remove();
                Swal.fire('تم', 'تم حظر العضو بنجاح', 'success');
            }
        }

        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }
        function logout() { auth.signOut().then(() => location.reload()); }
    </script>
</body>
</html>
