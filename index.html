<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصة الرسمية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; scroll-behavior: smooth; overflow-x: hidden; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .cyber-card { border-radius: 2rem; border: 1px solid rgba(6, 182, 212, 0.15); transition: 0.3s; }
        .cyber-card:hover { border-color: #06b6d4; box-shadow: 0 10px 30px rgba(6, 182, 212, 0.1); }
        .btn-cyan { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; transition: 0.3s; }
        .btn-cyan:hover { box-shadow: 0 0 20px rgba(6, 182, 212, 0.4); transform: scale(1.02); }
        input, textarea { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; }
        .chat-box { height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }
        .star-rating { color: #475569; cursor: pointer; font-size: 2rem; transition: 0.2s; }
        .star-rating.active { color: #fbbf24; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950 p-4">
        <div class="glass p-8 w-full max-w-md rounded-[2.5rem] text-center cyber-card animate__animated animate__zoomIn">
            <h1 class="text-4xl font-black mb-2 tracking-tighter uppercase">Z Ahmed <span class="text-cyan-400">Tech</span></h1>
            <p class="text-slate-500 text-xs mb-8">لوحة التحكم المركزية للمنصة</p>
            
            <div class="space-y-4">
                <button onclick="googleSignIn()" class="w-full bg-white text-black py-4 rounded-xl font-bold flex items-center justify-center gap-3">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20"> الدخول عبر جوجل
                </button>
                <div class="flex items-center gap-2 py-2">
                    <hr class="flex-grow border-slate-800"> <span class="text-xs text-slate-500">للمدير فقط</span> <hr class="flex-grow border-slate-800">
                </div>
                <input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full p-4 rounded-xl outline-none">
                <input id="pass" type="password" placeholder="كلمة المرور" class="w-full p-4 rounded-xl outline-none">
                <button onclick="login()" class="w-full btn-cyan py-4 rounded-xl font-bold text-lg">دخول</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="text-2xl font-black uppercase">Z Ahmed <span class="text-cyan-400">Tech</span></div>
            <div class="flex items-center gap-4">
                <span id="navRole" class="text-[10px] font-bold bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full uppercase tracking-widest text-center min-w-[60px]">USER</span>
                <button onclick="logout()" class="text-red-500 hover:text-red-400 transition"><i class="fas fa-power-off text-xl"></i></button>
            </div>
        </nav>

        <div class="container mx-auto p-4 lg:p-10 grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="space-y-6">
                <div id="adminMenu" class="hidden glass p-6 rounded-[2rem] border-r-4 border-cyan-500">
                    <h3 class="font-black text-xs text-slate-500 mb-6 uppercase tracking-widest text-right">أدوات الإدارة</h3>
                    <div class="space-y-2 text-right">
                        <button onclick="openTab('addPost')" class="w-full p-3 hover:bg-cyan-500/10 rounded-xl transition flex items-center gap-3"><i class="fas fa-plus-circle text-cyan-400"></i> نشر محتوى</button>
                        <button onclick="openTab('manageWorkers')" class="w-full p-3 hover:bg-cyan-500/10 rounded-xl transition flex items-center gap-3"><i class="fas fa-user-shield text-cyan-400"></i> تعيين موظف</button>
                        <button onclick="openTab('assignChats')" class="w-full p-3 hover:bg-cyan-500/10 rounded-xl transition flex items-center gap-3"><i class="fas fa-headset text-cyan-400"></i> توزيع الطلبات</button>
                        <button onclick="openTab('viewRatings')" class="w-full p-3 hover:bg-cyan-500/10 rounded-xl transition flex items-center gap-3"><i class="fas fa-star text-yellow-400"></i> التقييمات</button>
                        <button onclick="openTab('manageUsers')" class="w-full p-3 hover:bg-cyan-500/10 rounded-xl transition flex items-center gap-3"><i class="fas fa-users-cog text-cyan-400"></i> الحسابات</button>
                    </div>
                </div>

                <button id="supportBtn" onclick="startSupportRequest()" class="w-full btn-cyan p-5 rounded-3xl font-black flex items-center justify-center gap-4 shadow-xl shadow-cyan-500/20">
                    <i class="fas fa-headset text-2xl"></i> التواصل مع الدعم
                </button>
            </div>

            <div class="lg:col-span-3 space-y-8">
                <div class="flex items-center justify-between">
                    <h2 class="text-3xl font-black">آخر <span class="text-cyan-400">الأخبار</span></h2>
                </div>
                <div id="postsFeed" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
            </div>
        </div>
    </div>

    <div id="mainModal" class="hidden fixed inset-0 z-[2000] bg-black/95 flex items-center justify-center p-4">
        <div class="glass w-full max-w-3xl p-8 rounded-[3rem] relative animate__animated animate__zoomIn">
            <button onclick="closeModal()" class="absolute top-6 left-6 text-2xl hover:text-cyan-400 transition"><i class="fas fa-times-circle"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();
        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com";
        let me = null;
        let currentStars = 0;

        // --- AUTH ---
        async function login() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } catch { Swal.fire('خطأ', 'بيانات المدير غير صحيحة', 'error'); }
        }

        async function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const res = await auth.signInWithPopup(provider);
                const user = res.user;
                
                // التأكد إذا كان الموظف معتمد من قبل المدير
                const approvedSnap = await db.ref('approved_workers').orderByValue().equalTo(user.email).once('value');
                const role = user.email === MASTER_ADMIN ? 'admin' : (approvedSnap.exists() ? 'worker' : 'visitor');
                
                await db.ref('users/' + user.uid).update({
                    uid: user.uid, email: user.email, name: user.displayName, role: role, pass: 'Google Auth'
                });
            } catch (err) { Swal.fire('خطأ', 'فشل جوجل: ' + err.message, 'error'); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('authScreen').classList.add('hidden');
                        document.getElementById('mainApp').classList.remove('hidden');
                        document.getElementById('navRole').innerText = me.role;
                        document.getElementById('adminMenu').classList.toggle('hidden', me.role !== 'admin');
                        document.getElementById('supportBtn').classList.toggle('hidden', me.role === 'admin' || me.role === 'worker');
                        loadPosts();
                        if(me.role === 'worker') listenForAssignedChats();
                    }
                });
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        // --- TABS ---
        function openTab(type) {
            const content = document.getElementById('modalContent');
            document.getElementById('mainModal').classList.remove('hidden');
            content.innerHTML = '';

            if(type === 'manageWorkers') {
                content.innerHTML = `
                    <h2 class="text-2xl font-black mb-6 text-cyan-400">👔 اعتماد موظف (Gmail)</h2>
                    <p class="text-xs text-slate-400 mb-4">أدخل إيميل الموظف ليتمكن من الدخول بجوجل كعامل</p>
                    <input id="workerEmail" placeholder="example@gmail.com" class="w-full p-4 rounded-xl outline-none mb-4 border border-white/10">
                    <button onclick="approveWorker()" class="w-full btn-cyan py-4 rounded-xl font-bold">تفعيل الحساب</button>`;
            }
            else if(type === 'assignChats') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6 text-cyan-400">🎧 طلبات الدعم النشطة</h2><div id="waitingList" class="space-y-3"></div>`;
                renderWaitingList();
            }
            else if(type === 'viewRatings') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6 text-yellow-400">⭐ سجل التقييمات</h2><div id="ratingsList" class="space-y-2"></div>`;
                db.ref('ratings').on('value', snap => {
                    const list = document.getElementById('ratingsList'); list.innerHTML = '';
                    snap.forEach(r => {
                        const d = r.val();
                        list.innerHTML += `<div class="p-4 bg-white/5 rounded-2xl border border-white/5 flex justify-between items-center text-xs">
                            <div><p class="text-white font-bold">الموظف: ${d.workerName}</p><p class="text-slate-500">الزائر: ${d.visitorName}</p></div>
                            <div class="text-yellow-400 font-bold">${'★'.repeat(d.stars)}</div>
                        </div>`;
                    });
                });
            }
            else if(type === 'addPost') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6 text-cyan-400 text-right">📝 نشر خبر جديد</h2><div class="space-y-4 text-right"><input id="pT" placeholder="العنوان" class="w-full p-4 rounded-xl outline-none"><input id="pI" placeholder="رابط الصورة" class="w-full p-4 rounded-xl outline-none"><textarea id="pD" placeholder="الوصف" class="w-full p-4 rounded-xl outline-none" rows="3"></textarea><button onclick="savePost()" class="w-full btn-cyan py-4 rounded-xl font-bold">نشر</button></div>`;
            }
        }

        // --- SUPPORT SYSTEM ---
        function startSupportRequest() {
            const chatId = me.uid;
            db.ref('chats/' + chatId).update({
                visitorName: me.name,
                visitorId: me.uid,
                status: 'waiting',
                assignedTo: null
            });
            openChatUI(chatId);
        }

        function renderWaitingList() {
            db.ref('chats').on('value', snap => {
                const list = document.getElementById('waitingList'); if(!list) return;
                list.innerHTML = '';
                snap.forEach(chat => {
                    const data = chat.val();
                    if(!data.assignedTo) {
                        list.innerHTML += `<div class="flex justify-between items-center p-4 bg-slate-900 rounded-2xl border border-white/5">
                            <span class="text-sm">طلب من: ${data.visitorName}</span>
                            <button onclick="assignToWorker('${chat.key}')" class="bg-cyan-500 text-black px-4 py-1 rounded-lg text-[10px] font-bold">تعيين موظف</button>
                        </div>`;
                    }
                });
            });
        }

        async function assignToWorker(chatId) {
            const workers = await db.ref('users').orderByChild('role').equalTo('worker').once('value');
            let opts = {};
            workers.forEach(w => { opts[w.key] = w.val().name; });
            
            const { value: workerId } = await Swal.fire({
                title: 'اختر الموظف',
                input: 'select',
                inputOptions: opts,
                showCancelButton: true
            });

            if(workerId) {
                await db.ref('chats/' + chatId).update({ assignedTo: workerId, status: 'open' });
                Swal.fire('تم التعيين', 'الموظف سيتلقى المحادثة الآن', 'success');
            }
        }

        function listenForAssignedChats() {
            db.ref('chats').orderByChild('assignedTo').equalTo(auth.currentUser.uid).on('value', snap => {
                if(snap.exists()) {
                    snap.forEach(chat => {
                        Swal.fire({ title: 'مكالمة دعم!', text: `لديك محادثة مع ${chat.val().visitorName}`, icon: 'info', confirmButtonText: 'فتح المحادثة' }).then(() => openChatUI(chat.key));
                    });
                }
            });
        }

        function openChatUI(chatId) {
            const content = document.getElementById('modalContent');
            document.getElementById('mainModal').classList.remove('hidden');
            content.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold">محادثة مباشرة</h2>
                    <button onclick="closeAndRate('${chatId}')" class="bg-red-500/20 text-red-500 px-4 py-1 rounded-full text-[10px] font-bold">إنهاء المحادثة</button>
                </div>
                <div id="chatBox" class="chat-box glass rounded-3xl mb-4 border border-white/10"></div>
                <div class="flex gap-2">
                    <input id="chatMsg" placeholder="اكتب رسالتك..." class="flex-grow p-4 rounded-2xl outline-none">
                    <button onclick="sendMsg('${chatId}')" class="btn-cyan px-8 rounded-2xl"><i class="fas fa-paper-plane"></i></button>
                </div>`;
            
            db.ref('messages/' + chatId).on('value', snap => {
                const box = document.getElementById('chatBox'); if(!box) return;
                box.innerHTML = '';
                snap.forEach(m => {
                    const msg = m.val();
                    const isMe = msg.sender === auth.currentUser.uid;
                    box.innerHTML += `<div class="${isMe ? 'mr-auto bg-cyan-600' : 'ml-auto bg-slate-800'} max-w-[85%] p-3 rounded-2xl text-[11px] shadow-sm">
                        <p class="text-[8px] opacity-40 mb-1">${msg.name}</p>${msg.text}
                    </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendMsg(chatId) {
            const txt = document.getElementById('chatMsg').value;
            if(!txt) return;
            db.ref('messages/' + chatId).push({ sender: auth.currentUser.uid, name: me.name, text: txt });
            document.getElementById('chatMsg').value = '';
        }

        async function closeAndRate(chatId) {
            const snap = await db.ref('chats/' + chatId).once('value');
            const data = snap.val();

            if(me.role === 'visitor' && data && data.assignedTo) {
                const { value: stars } = await Swal.fire({
                    title: 'تقييم الموظف',
                    html: `
                        <div class="flex justify-center gap-3 py-4">
                            ${[1,2,3,4,5].map(n => `<i class="fas fa-star star-rating" data-n="${n}" onclick="updateStars(${n})"></i>`).join('')}
                        </div>`,
                    confirmButtonText: 'إرسال التقييم',
                    preConfirm: () => currentStars || 5
                });

                if(stars) {
                    const worker = await db.ref('users/' + data.assignedTo).once('value');
                    await db.ref('ratings').push({
                        stars: stars,
                        workerName: worker.val().name,
                        visitorName: me.name,
                        time: Date.now()
                    });
                }
            }
            await db.ref('chats/' + chatId).remove();
            await db.ref('messages/' + chatId).remove();
            closeModal();
            Swal.fire('تم الإغلاق', 'شكراً لاستخدامك خدماتنا', 'success');
        }

        window.updateStars = (n) => {
            currentStars = n;
            document.querySelectorAll('.star-rating').forEach((s, i) => {
                s.classList.toggle('active', i < n);
            });
        };

        // --- OPERATIONS ---
        async function approveWorker() {
            const email = document.getElementById('workerEmail').value;
            if(email) {
                await db.ref('approved_workers').push(email);
                Swal.fire('تم', 'تم اعتماد الموظف بنجاح', 'success');
                closeModal();
            }
        }

        async function savePost() {
            const t = document.getElementById('pT').value, i = document.getElementById('pI').value, d = document.getElementById('pD').value;
            if(t && i && d) {
                await db.ref('posts').push({ title: t, img: i, desc: d, author: me.name, status: 'active' });
                closeModal();
            }
        }

        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const feed = document.getElementById('postsFeed'); if(!feed) return;
                feed.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    feed.innerHTML += `<div class="glass rounded-[2rem] overflow-hidden cyber-card"><img src="${post.img}" class="w-full h-40 object-cover"><div class="p-6 text-right"><h3 class="font-black text-white mb-2">${post.title}</h3><p class="text-slate-400 text-[10px] mb-4">${post.desc}</p><div class="text-[8px] text-cyan-400 italic">BY: ${post.author}</div></div></div>`;
                });
            });
        }

        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }
        function logout() { auth.signOut().then(() => location.reload()); }
    </script>
</body>
</html>
