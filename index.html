<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Z Ahmed Tech | المنصة التقنية المتكاملة</title>
    <meta name="description" content="منصة Z Ahmed Tech للأخبار والبرومبتات الحصرية لعام 2026.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; scroll-behavior: smooth; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-cyan { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; transition: 0.3s; }
        .cyber-card { border-radius: 1.5rem; border: 1px solid rgba(6, 182, 212, 0.1); transition: 0.3s; cursor: pointer; }
        .cyber-card:hover { border-color: #06b6d4; transform: scale(1.02); }
        input, textarea, select { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; border-radius: 12px; }
        #waitCircle { transition: stroke-dashoffset 1s linear; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950 p-4">
        <div class="glass p-8 w-full max-w-md rounded-[2.5rem] text-center shadow-2xl">
            <h1 class="text-4xl font-black mb-8 text-white italic">Z Ahmed <span class="text-cyan-400">Tech</span></h1>
            <div class="space-y-4">
                <input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full p-4 outline-none">
                <input id="pass" type="password" placeholder="كلمة المرور" class="w-full p-4 outline-none">
                <button id="loginBtn" onclick="login()" class="w-full btn-cyan py-4 rounded-xl font-bold">دخول للمنصة</button>
                <button onclick="googleSignIn()" class="w-full bg-white text-black py-4 rounded-xl font-bold flex items-center justify-center gap-2">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="18"> دخول بجوجل
                </button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="text-2xl font-black italic cursor-pointer" onclick="goHome()">Z Ahmed <span class="text-cyan-400">Tech</span></div>
            <div class="flex items-center gap-4">
                <span id="navRole" class="text-[10px] font-bold bg-cyan-500/10 text-cyan-400 px-3 py-1 rounded-full uppercase">USER</span>
                <button onclick="logout()" class="text-red-500 hover:scale-110"><i class="fas fa-power-off text-xl"></i></button>
            </div>
        </nav>

        <div class="container mx-auto p-4 lg:p-10">
            <div id="homeView" class="grid grid-cols-1 lg:grid-cols-4 gap-8">
                <div class="space-y-4">
                    <div id="sideMenu" class="hidden glass p-6 rounded-3xl">
                        <p class="text-[10px] font-bold text-slate-500 mb-4 text-right">لوحة التحكم</p>
                        <div class="space-y-2">
                            <button onclick="openAdminModal('addPost')" class="w-full text-right p-3 hover:bg-white/5 rounded-xl text-sm flex justify-between items-center">
                                <span>نشر خبر جديد</span><i class="fas fa-plus-circle text-cyan-400"></i>
                            </button>
                            <button onclick="openAdminModal('manageUsers')" class="w-full text-right p-3 hover:bg-white/5 rounded-xl text-sm flex justify-between items-center">
                                <span>إدارة الحسابات</span><i class="fas fa-users-cog text-cyan-400"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-3">
                    <h2 class="text-3xl font-black mb-8 text-right italic">آخر <span class="text-cyan-400">الإبداعات</span></h2>
                    <div id="postsFeed" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
                </div>
            </div>

            <div id="postDetailView" class="hidden max-w-4xl mx-auto animate__animated animate__fadeIn">
                <div id="waitScreen" class="text-center py-20 space-y-6">
                    <div class="relative inline-block">
                        <svg class="w-24 h-24 transform -rotate-90"><circle cx="48" cy="48" r="40" stroke="currentColor" stroke-width="8" fill="transparent" class="text-slate-800" /><circle cx="48" cy="48" r="40" stroke="currentColor" stroke-width="8" fill="transparent" class="text-cyan-400" stroke-dasharray="251" id="waitCircle" /></svg>
                        <span id="countdownText" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-2xl font-bold"></span>
                    </div>
                    <p class="text-xl font-bold">جاري تجهيز المحتوى من Z Ahmed Tech...</p>
                </div>
                <div id="actualContent" class="hidden space-y-6 text-right pb-20">
                    <button onclick="goHome()" class="text-cyan-400 mb-4 font-bold flex items-center gap-2"><i class="fas fa-arrow-right"></i> رجوع</button>
                    <img id="detailImg" class="w-full h-96 object-cover rounded-[2.5rem] shadow-2xl">
                    <h1 id="detailTitle" class="text-4xl font-black"></h1>
                    <div id="detailDesc" class="text-lg text-slate-300 leading-relaxed py-6 whitespace-pre-wrap"></div>
                    <div id="actionBtnContainer" class="flex justify-center pt-4"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="adminModal" class="hidden fixed inset-0 z-[2000] bg-black/95 flex items-center justify-center p-4">
        <div class="glass w-full max-w-2xl p-8 rounded-[2rem] relative overflow-y-auto max-h-[90vh]">
            <button onclick="closeModal()" class="absolute top-6 left-6 text-xl"><i class="fas fa-times"></i></button>
            <div id="modalContent" class="text-right"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();
        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com";
        let me = null;
        let selectedImgBase64 = "";

        // دخول
        async function login() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            if(!e || !p) return Swal.fire('تنبيه', 'يرجى إدخال البيانات', 'warning');
            try { await auth.signInWithEmailAndPassword(e, p); } 
            catch (err) { Swal.fire('خطأ', 'البيانات غير صحيحة', 'error'); }
        }

        async function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try { await auth.signInWithPopup(provider); } catch (e) { }
        }

        // مراقبة المستخدم
        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', s => {
                    me = s.val();
                    if(!me) {
                        const role = (user.email === MASTER_ADMIN ? 'admin' : 'visitor');
                        db.ref('users/' + user.uid).set({ uid: user.uid, email: user.email, name: user.displayName || "User", role: role });
                        return;
                    }
                    document.getElementById('authScreen').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    document.getElementById('navRole').innerText = me.role;
                    document.getElementById('sideMenu').classList.toggle('hidden', me.role !== 'admin');
                    loadPosts();
                });
            } else { document.getElementById('authScreen').classList.remove('hidden'); }
        });

        // رفع الصورة وتحويلها لـ Base64
        function handleFile(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                selectedImgBase64 = event.target.result;
                document.getElementById('preview').src = selectedImgBase64;
                document.getElementById('preview').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function openAdminModal(type) {
            const content = document.getElementById('modalContent');
            document.getElementById('adminModal').classList.remove('hidden');
            if(type === 'addPost') {
                content.innerHTML = `
                    <h2 class="text-2xl font-bold mb-6 text-cyan-400">نشر محتوى جديد</h2>
                    <input id="pT" placeholder="عنوان الخبر" class="w-full p-4 mb-4">
                    <div class="mb-4 p-6 border-2 border-dashed border-slate-700 rounded-2xl text-center">
                        <input type="file" accept="image/*" onchange="handleFile(event)" class="text-xs mb-2">
                        <img id="preview" class="hidden w-full h-40 object-cover rounded-xl mt-2">
                        <p class="text-[10px] mt-2 text-slate-500">أو ضع رابط خارجي بالأسفل</p>
                    </div>
                    <input id="pI" placeholder="رابط صورة خارجي (اختياري)" class="w-full p-4 mb-4">
                    <textarea id="pD" placeholder="وصف الخبر بالتفصيل" class="w-full p-4 mb-4" rows="4"></textarea>
                    <div class="flex gap-2 mb-6"><input id="pBtnT" placeholder="نص الزر" class="w-1/2 p-4"><input id="pBtnL" placeholder="رابط التحميل" class="w-1/2 p-4"></div>
                    <button onclick="savePost()" class="w-full btn-cyan p-4 rounded-xl font-bold">تأكيد النشر</button>`;
            } else if(type === 'manageUsers') {
                content.innerHTML = `<h2 class="text-2xl font-bold mb-6 text-cyan-400">إدارة المستخدمين</h2><div id="uList" class="space-y-4"></div>`;
                db.ref('users').once('value', snap => {
                    const list = document.getElementById('uList');
                    snap.forEach(u => {
                        list.innerHTML += `<div class="p-4 bg-slate-900 rounded-2xl flex justify-between items-center border border-white/5">
                            <select onchange="updateUserRole('${u.key}', this.value)" class="p-2 text-xs">
                                <option value="visitor" ${u.val().role==='visitor'?'selected':''}>Visitor</option>
                                <option value="worker" ${u.val().role==='worker'?'selected':''}>Worker</option>
                                <option value="admin" ${u.val().role==='admin'?'selected':''}>Admin</option>
                            </select>
                            <div class="text-right">
                                <p class="font-bold text-sm">${u.val().name || u.val().email}</p>
                                <p class="text-[10px] text-slate-500">${u.val().email}</p>
                            </div>
                        </div>`;
                    });
                });
            }
        }

        async function savePost() {
            const finalImg = selectedImgBase64 || document.getElementById('pI').value;
            if(!finalImg || !document.getElementById('pT').value) return Swal.fire('تنبيه', 'أكمل بيانات الخبر', 'warning');
            await db.ref('posts').push({
                title: document.getElementById('pT').value,
                img: finalImg,
                desc: document.getElementById('pD').value,
                btnText: document.getElementById('pBtnT').value,
                btnLink: document.getElementById('pBtnL').value,
                time: Date.now()
            });
            selectedImgBase64 = ""; closeModal(); Swal.fire('تم', 'نشر الخبر في Z Ahmed Tech', 'success');
        }

        function updateUserRole(uid, role) { db.ref('users/' + uid).update({ role }); Swal.fire('تم', 'تحديث الرتبة', 'success'); }

        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const feed = document.getElementById('postsFeed'); feed.innerHTML = '';
                snap.forEach(p => {
                    feed.innerHTML += `
                        <div class="cyber-card glass overflow-hidden" onclick="viewPost('${p.key}')">
                            <img src="${p.val().img}" class="w-full h-48 object-cover">
                            <div class="p-5 text-right">
                                <h3 class="font-bold text-xl">${p.val().title}</h3>
                                <p class="text-cyan-400 text-xs mt-4">إقرأ المزيد <i class="fas fa-chevron-left mr-1"></i></p>
                                ${me.role === 'admin' ? `<button onclick="event.stopPropagation(); deletePost('${p.key}')" class="text-red-500 text-[10px] mt-4">حذف الخبر</button>` : ''}
                            </div>
                        </div>`;
                });
            });
        }

        async function viewPost(id) {
            const snap = await db.ref('posts/'+id).once('value');
            const post = snap.val();
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('postDetailView').classList.remove('hidden');
            if(me.role === 'admin' || me.role === 'worker') { showPost(post); return; }
            document.getElementById('waitScreen').classList.remove('hidden');
            document.getElementById('actualContent').classList.add('hidden');
            let timeLeft = 5;
            const timer = setInterval(() => {
                timeLeft--;
                document.getElementById('countdownText').innerText = timeLeft;
                if(timeLeft <= 0) { clearInterval(timer); showPost(post); }
            }, 1000);
        }

        function showPost(post) {
            document.getElementById('waitScreen').classList.add('hidden');
            document.getElementById('actualContent').classList.remove('hidden');
            document.getElementById('detailImg').src = post.img;
            document.getElementById('detailTitle').innerText = post.title;
            document.getElementById('detailDesc').innerText = post.desc;
            document.getElementById('actionBtnContainer').innerHTML = post.btnLink ? `<a href="${post.btnLink}" target="_blank" class="btn-cyan px-12 py-4 rounded-2xl font-black">تحميل / انتقاد</a>` : '';
        }

        function logout() { auth.signOut().then(() => location.reload()); }
        function closeModal() { document.getElementById('adminModal').classList.add('hidden'); }
        function goHome() { document.getElementById('homeView').classList.remove('hidden'); document.getElementById('postDetailView').classList.add('hidden'); }
        function deletePost(id) { db.ref('posts/'+id).remove(); }
    </script>
</body>
</html>
