<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصة الرسمية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; scroll-behavior: smooth; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .cyber-card { border-radius: 2rem; border: 1px solid rgba(6, 182, 212, 0.2); transition: 0.3s; }
        .cyber-card:hover { transform: translateY(-5px); border-color: #06b6d4; box-shadow: 0 10px 30px rgba(6, 182, 212, 0.2); }
        .btn-cyan { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; transition: 0.3s; }
        .btn-cyan:hover { box-shadow: 0 0 20px rgba(6, 182, 212, 0.5); }
        input, textarea, select { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; }
        .btn-phone { background: #10b981; color: white; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950 p-4 animate__animated">
        <div class="glass p-8 w-full max-w-md rounded-[2.5rem] text-center cyber-card">
            <h1 class="text-4xl font-black mb-2 tracking-tighter">Z AHMED <span class="text-cyan-400">TECH</span></h1>
            <p class="text-slate-400 text-sm mb-8">لوحة التحكم والمراقبة المركزية</p>
            
            <div class="space-y-4">
                <input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full p-4 rounded-xl outline-none">
                <input id="pass" type="password" placeholder="كلمة المرور" class="w-full p-4 rounded-xl outline-none">
                <button onclick="login()" class="w-full btn-cyan py-4 rounded-xl font-bold text-lg shadow-xl shadow-cyan-500/20">دخول للمنصة</button>
                
                <div class="flex items-center gap-2 py-2">
                    <hr class="flex-grow border-slate-800"> <span class="text-xs text-slate-500 uppercase">أو عبر</span> <hr class="flex-grow border-slate-800">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="googleSignIn()" class="bg-white text-black py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-200 transition text-xs">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="16"> Google
                    </button>
                    <button onclick="phoneSignIn()" class="btn-phone py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90 transition text-xs">
                        <i class="fas fa-phone-alt"></i> Phone
                    </button>
                </div>
                
                <button onclick="registerVisitor()" class="text-slate-500 text-xs hover:text-cyan-400 transition mt-4">إنشاء حساب زائر جديد (إيميل)</button>
            </div>
            <div id="recaptcha-container"></div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="text-2xl font-black">Z AHMED <span class="text-cyan-400">TECH</span></div>
            <div class="flex items-center gap-4">
                <span id="navRole" class="text-[10px] font-bold bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full uppercase tracking-widest">USER</span>
                <button onclick="logout()" class="text-red-500 hover:text-red-400"><i class="fas fa-power-off text-xl"></i></button>
            </div>
        </nav>

        <div class="container mx-auto p-4 lg:p-10 grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="space-y-6">
                <div id="adminMenu" class="hidden glass p-6 rounded-[2rem] border-r-4 border-cyan-500">
                    <h3 class="font-black text-xs text-slate-500 mb-6 uppercase tracking-widest text-right">أدوات المدير</h3>
                    <div class="space-y-2 text-right">
                        <button onclick="openTab('addPost')" class="w-full p-3 hover:bg-cyan-500/10 rounded-xl transition flex items-center gap-3">
                            <i class="fas fa-plus-circle text-cyan-400"></i> نشر منشور جديد
                        </button>
                        <button onclick="openTab('manageWorkers')" class="w-full p-3 hover:bg-cyan-500/10 rounded-xl transition flex items-center gap-3">
                            <i class="fas fa-user-shield text-cyan-400"></i> إنشاء حساب موظف
                        </button>
                        <button onclick="openTab('manageUsers')" class="w-full p-3 hover:bg-cyan-500/10 rounded-xl transition flex items-center gap-3">
                            <i class="fas fa-users-cog text-cyan-400"></i> مراقبة الأعضاء
                        </button>
                    </div>
                </div>

                <div id="workerMenu" class="hidden glass p-6 rounded-[2rem] border-r-4 border-amber-500">
                    <h3 class="font-black text-xs text-slate-500 mb-6 uppercase tracking-widest text-right">أدوات الموظف</h3>
                    <button onclick="openTab('addPost')" class="w-full p-3 hover:bg-amber-500/10 rounded-xl transition flex items-center gap-3">
                        <i class="fas fa-file-signature text-amber-500"></i> اقتراح منشور جديد
                    </button>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-8">
                <div class="flex items-center justify-between">
                    <h2 class="text-3xl font-black">آخر <span class="text-cyan-400">الأخبار</span></h2>
                    <div class="h-1 flex-grow mx-6 bg-slate-800 rounded-full"></div>
                </div>
                <div id="postsFeed" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
            </div>
        </div>
    </div>

    <div id="mainModal" class="hidden fixed inset-0 z-[2000] bg-black/90 flex items-center justify-center p-4">
        <div class="glass w-full max-w-4xl p-8 rounded-[3rem] relative animate__animated animate__zoomIn">
            <button onclick="closeModal()" class="absolute top-6 left-6 text-2xl hover:text-cyan-400"><i class="fas fa-times-circle"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // --- 1. Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com";
        let me = null;

        // --- 2. Auth Logic ---
        async function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } catch(err) { Swal.fire('خطأ', 'البيانات غير صحيحة', 'error'); }
        }

        async function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const res = await auth.signInWithPopup(provider);
                handleUserRecord(res.user, 'Google Login');
            } catch(e) { Swal.fire('خطأ', 'فشل دخول جوجل', 'error'); }
        }

        async function phoneSignIn() {
            const { value: phone } = await Swal.fire({
                title: 'تسجيل برقم الهاتف',
                input: 'tel',
                inputPlaceholder: '+2010XXXXXXXX',
                showCancelButton: true,
                confirmButtonText: 'إرسال كود التحقق'
            });

            if (phone) {
                const appVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' });
                try {
                    const confirmationResult = await auth.signInWithPhoneNumber(phone, appVerifier);
                    const { value: code } = await Swal.fire({
                        title: 'ادخل الكود (6 أرقام)',
                        input: 'text',
                        confirmButtonText: 'تأكيد'
                    });
                    const res = await confirmationResult.confirm(code);
                    handleUserRecord(res.user, 'Phone Login');
                } catch (err) { Swal.fire('خطأ', 'الرقم غير صحيح أو انتهت المحاولات', 'error'); }
            }
        }

        async function handleUserRecord(user, method) {
            const snap = await db.ref('users/' + user.uid).once('value');
            if(!snap.exists()) {
                await db.ref('users/' + user.uid).set({
                    uid: user.uid,
                    email: user.email || user.phoneNumber,
                    name: user.displayName || "مستخدم_" + user.uid.slice(0,4),
                    role: user.email === MASTER_ADMIN ? 'admin' : 'visitor',
                    pass: method
                });
            }
        }

        async function registerVisitor() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            if(!e || !p) return Swal.fire('تنبيه', 'املأ الحقول أولاً', 'info');
            try {
                const res = await auth.createUserWithEmailAndPassword(e, p);
                await db.ref('users/' + res.user.uid).set({ uid: res.user.uid, email: e, name: e.split('@')[0], role: 'visitor', pass: p });
                Swal.fire('نجاح', 'تم تسجيلك كزائر', 'success');
            } catch(err) { Swal.fire('خطأ', err.message, 'error'); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('authScreen').classList.add('animate__fadeOutUp');
                        setTimeout(() => {
                            document.getElementById('authScreen').classList.add('hidden');
                            document.getElementById('mainApp').classList.remove('hidden');
                            document.getElementById('navRole').innerText = me.role;
                            document.getElementById('adminMenu').style.display = (me.role === 'admin' || me.email === MASTER_ADMIN) ? 'block' : 'none';
                            document.getElementById('workerMenu').style.display = (me.role === 'worker') ? 'block' : 'none';
                            loadPosts();
                        }, 500);
                    }
                });
            } else {
                document.getElementById('authScreen').classList.remove('hidden', 'animate__fadeOutUp');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        // --- 3. Tabs & Content ---
        function openTab(type) {
            const modal = document.getElementById('mainModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            content.innerHTML = '';

            if(type === 'addPost') {
                content.innerHTML = `
                    <h2 class="text-2xl font-black mb-6 text-cyan-400">✨ نشر محتوى جديد</h2>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="space-y-4 text-right">
                            <input id="postTitle" type="text" placeholder="عنوان المنشور" class="w-full p-4 rounded-xl outline-none border border-slate-800">
                            <input id="postImg" type="text" placeholder="رابط الصورة (URL)" class="w-full p-4 rounded-xl outline-none border border-slate-800">
                            <input id="postLink" type="text" placeholder="رابط خارجي (اختياري)" class="w-full p-4 rounded-xl outline-none border border-slate-800">
                            <textarea id="postDesc" rows="4" placeholder="اكتب وصف الخبر..." class="w-full p-4 rounded-xl outline-none border border-slate-800"></textarea>
                            <button onclick="submitNewPost()" class="w-full btn-cyan py-4 rounded-xl font-bold">تأكيد النشر</button>
                        </div>
                        <div class="hidden lg:block bg-slate-900 rounded-3xl p-6 border border-slate-800 text-center">
                            <p class="text-xs text-slate-500 mb-4 uppercase tracking-widest">Post Preview</p>
                            <div class="bg-slate-800 rounded-2xl h-48 flex items-center justify-center text-slate-700 italic">Image Preview</div>
                        </div>
                    </div>`;
            }
            else if(type === 'manageUsers') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6 text-cyan-400">👥 مراقبة الأعضاء</h2><div id="uList" class="space-y-3 max-h-96 overflow-y-auto"></div>`;
                db.ref('users').on('value', snap => {
                    const list = document.getElementById('uList'); list.innerHTML = '';
                    snap.forEach(u => {
                        const user = u.val();
                        if(user.email === MASTER_ADMIN) return;
                        list.innerHTML += `
                            <div class="flex justify-between items-center p-4 bg-slate-900 rounded-2xl border border-slate-800">
                                <div class="text-right">
                                    <p class="font-bold text-white">${user.name} <span class="text-[8px] bg-cyan-500/20 text-cyan-400 px-2 rounded-full">${user.role}</span></p>
                                    <p class="text-[10px] text-slate-500">${user.email} | ${user.pass}</p>
                                </div>
                                <button onclick="deleteUser('${u.key}')" class="text-red-500 hover:scale-110 transition"><i class="fas fa-trash-alt"></i></button>
                            </div>`;
                    });
                });
            }
        }

        async function submitNewPost() {
            const title = document.getElementById('postTitle').value;
            const img = document.getElementById('postImg').value;
            const desc = document.getElementById('postDesc').value;
            const link = document.getElementById('postLink').value;
            if(!title || !img || !desc) return Swal.fire('تنبيه', 'املأ البيانات الأساسية', 'info');
            const status = (me.role === 'admin' || me.email === MASTER_ADMIN) ? 'active' : 'pending';
            await db.ref('posts').push({ title, img, desc, link, status, author: me.name, time: Date.now() });
            Swal.fire('تم', 'نُشر الخبر بنجاح', 'success'); closeModal();
        }

        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const feed = document.getElementById('postsFeed');
                feed.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    if(post.status === 'active' || me.role === 'admin' || me.email === MASTER_ADMIN) {
                        feed.innerHTML += `
                            <div class="glass rounded-[2.5rem] overflow-hidden cyber-card animate__animated animate__fadeInUp">
                                <img src="${post.img}" class="w-full h-52 object-cover">
                                <div class="p-6 text-right">
                                    <div class="flex justify-between items-center mb-3">
                                        <span class="text-[10px] bg-cyan-500 text-black px-2 py-1 rounded font-black">NEWS</span>
                                        ${(me.role === 'admin' || me.email === MASTER_ADMIN) ? `<button onclick="deletePost('${p.key}')" class="text-red-500"><i class="fas fa-trash"></i></button>` : ''}
                                    </div>
                                    <h3 class="text-xl font-black text-white mb-3">${post.title}</h3>
                                    <p class="text-slate-400 text-xs leading-relaxed mb-4">${post.desc.substring(0, 100)}...</p>
                                    <div class="flex justify-between items-center border-t border-slate-800 pt-4">
                                        <a href="${post.link || '#'}" target="_blank" class="text-cyan-400 text-xs font-bold">قراءة المزيد</a>
                                        <span class="text-[9px] text-slate-600 italic">BY: ${post.author}</span>
                                    </div>
                                </div>
                            </div>`;
                    }
                });
            });
        }

        async function deleteUser(uid) {
            const res = await Swal.fire({ title: 'طرد المستخدم؟', icon: 'warning', showCancelButton: true });
            if(res.isConfirmed) db.ref('users/'+uid).remove();
        }

        async function deletePost(id) {
            const res = await Swal.fire({ title: 'حذف المنشور؟', icon: 'warning', showCancelButton: true });
            if(res.isConfirmed) db.ref('posts/'+id).remove();
        }

        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }
        function logout() { auth.signOut().then(() => location.reload()); }
    </script>
</body>
</html>
