<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصه الرسمية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .cyber-card { border-radius: 2rem; border: 1px solid rgba(6, 182, 212, 0.15); transition: 0.3s; }
        .btn-cyan { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; transition: 0.3s; }
        .chat-box { height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950 p-4">
        <div class="glass p-8 w-full max-w-md rounded-[2.5rem] text-center cyber-card">
            <h1 class="text-4xl font-black mb-8">Z AHMED <span class="text-cyan-400">TECH</span></h1>
            <button onclick="googleSignIn()" class="w-full bg-white text-black py-4 rounded-xl font-bold flex items-center justify-center gap-3">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20"> دخول عبر جوجل
            </button>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-black uppercase">Z Ahmed <span class="text-cyan-400">Tech</span></div>
            <button onclick="logout()" class="text-red-500"><i class="fas fa-power-off text-xl"></i></button>
        </nav>

        <div class="container mx-auto p-4 lg:p-10 grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="space-y-6">
                <div id="adminMenu" class="hidden glass p-6 rounded-[2rem] border-r-4 border-cyan-500">
                    <h3 class="font-black text-xs text-slate-500 mb-6 uppercase text-right">أدوات الرقابة</h3>
                    <div class="space-y-2 text-right">
                        <button onclick="openTab('addPost')" class="w-full p-3 hover:bg-white/5 rounded-xl transition flex gap-3"><i class="fas fa-plus text-cyan-400"></i> منشور جديد</button>
                        <button onclick="openTab('viewRatings')" class="w-full p-3 hover:bg-white/5 rounded-xl transition flex gap-3"><i class="fas fa-star text-yellow-400"></i> سجل التقييمات</button>
                        <button onclick="openTab('monitorChats')" class="w-full p-3 hover:bg-white/5 rounded-xl transition flex gap-3"><i class="fas fa-eye text-emerald-400"></i> مراقبة المحادثات</button>
                        <button onclick="openTab('manageWorkers')" class="w-full p-3 hover:bg-white/5 rounded-xl transition flex gap-3"><i class="fas fa-user-shield text-cyan-400"></i> إضافة موظف</button>
                    </div>
                </div>
                <button id="supportBtn" onclick="startSupport()" class="w-full btn-cyan p-5 rounded-3xl font-black flex gap-4 justify-center shadow-xl"><i class="fas fa-headset"></i> دعم مباشر</button>
            </div>

            <div class="lg:col-span-3">
                <div id="postsFeed" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
            </div>
        </div>
    </div>

    <div id="mainModal" class="hidden fixed inset-0 z-[2000] bg-black/95 flex items-center justify-center p-4">
        <div class="glass w-full max-w-3xl p-8 rounded-[3rem] relative animate__animated animate__zoomIn max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-6 left-6 text-2xl hover:text-cyan-400"><i class="fas fa-times-circle"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();
        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com";
        let me = null;

        // --- AUTH ---
        async function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const res = await auth.signInWithPopup(provider);
                const user = res.user;
                const workerSnap = await db.ref('approved_workers').orderByValue().equalTo(user.email).once('value');
                const role = user.email === MASTER_ADMIN ? 'admin' : (workerSnap.exists() ? 'worker' : 'visitor');
                await db.ref('users/' + user.uid).update({ uid: user.uid, email: user.email, name: user.displayName, role: role });
            } catch (e) { Swal.fire('Error', e.message, 'error'); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('authScreen').classList.add('hidden');
                        document.getElementById('mainApp').classList.remove('hidden');
                        document.getElementById('adminMenu').classList.toggle('hidden', me.role !== 'admin');
                        document.getElementById('supportBtn').classList.toggle('hidden', me.role !== 'visitor');
                        loadPosts();
                    }
                });
            } else { document.getElementById('authScreen').classList.remove('hidden'); }
        });

        // --- TABS (Admin View) ---
        function openTab(type) {
            const content = document.getElementById('modalContent');
            document.getElementById('mainModal').classList.remove('hidden');
            content.innerHTML = '';

            if(type === 'viewRatings') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6 text-yellow-400 text-right">⭐ سجل تقييمات الموظفين</h2><div id="ratingsList" class="space-y-4"></div>`;
                db.ref('ratings').on('value', snap => {
                    const list = document.getElementById('ratingsList'); list.innerHTML = '';
                    snap.forEach(r => {
                        const d = r.val();
                        list.innerHTML += `
                            <div class="p-4 bg-white/5 rounded-2xl border border-white/5 flex justify-between items-center">
                                <div class="text-right">
                                    <p class="font-bold text-white">الزائر: ${d.visitorName}</p>
                                    <p class="text-[10px] text-slate-500">${new Date(d.time).toLocaleString('ar-EG')}</p>
                                </div>
                                <div class="text-yellow-400 text-xl font-bold">${'★'.repeat(d.stars)}</div>
                            </div>`;
                    });
                });
            }
            else if(type === 'monitorChats') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6 text-emerald-400 text-right">👁️ مراقبة المحادثات الحالية</h2><div id="chatsMonitorList" class="space-y-3"></div>`;
                db.ref('chats').on('value', snap => {
                    const list = document.getElementById('chatsMonitorList'); if(!list) return;
                    list.innerHTML = '';
                    snap.forEach(chat => {
                        list.innerHTML += `
                            <div onclick="viewChatStream('${chat.key}')" class="p-4 bg-white/5 rounded-2xl flex justify-between items-center cursor-pointer hover:bg-emerald-500/10 transition border border-transparent hover:border-emerald-500/30">
                                <span>محادثة: ${chat.val().visitorName}</span>
                                <i class="fas fa-external-link-alt text-emerald-400"></i>
                            </div>`;
                    });
                });
            }
            // ... (باقي التبويبات مثل addPost و manageWorkers)
        }

        // --- CHAT STREAMING (For Admin Eye) ---
        function viewChatStream(chatId) {
            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <h2 class="text-xl font-bold mb-4 text-emerald-400">بث مباشر للمحادثة: ${chatId}</h2>
                <div id="chatBoxMonitor" class="chat-box glass rounded-2xl mb-4"></div>
                <p class="text-[10px] text-center text-slate-500 italic">أنت الآن تشاهد المحادثة كأدمن (وضع الرقابة)</p>`;
            
            db.ref('messages/' + chatId).on('value', snap => {
                const box = document.getElementById('chatBoxMonitor'); if(!box) return;
                box.innerHTML = '';
                snap.forEach(m => {
                    const msg = m.val();
                    box.innerHTML += `<div class="p-3 bg-white/5 rounded-xl border border-white/5 text-xs">
                        <b class="text-cyan-400">${msg.name}:</b> ${msg.text}
                    </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // --- SUPPORT SYSTEM ---
        function startSupport() {
            const chatId = me.uid;
            db.ref('chats/' + chatId).set({ visitorName: me.name, status: 'open' });
            openChatUI(chatId);
        }

        function openChatUI(chatId) {
            const content = document.getElementById('modalContent');
            document.getElementById('mainModal').classList.remove('hidden');
            content.innerHTML = `
                <div class="flex justify-between items-center mb-4"><h2 class="font-bold">الدعم الفني</h2><button onclick="endChat('${chatId}')" class="bg-red-500/20 text-red-500 px-4 py-1 rounded-full text-[10px] font-bold italic">إغلاق المحادثة</button></div>
                <div id="chatBox" class="chat-box glass rounded-3xl mb-4 border border-white/10"></div>
                <div class="flex gap-2">
                    <input id="chatMsg" placeholder="اكتب رسالتك..." class="flex-grow p-4 rounded-xl outline-none">
                    <button onclick="sendMsg('${chatId}')" class="btn-cyan px-6 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                </div>`;
            
            db.ref('messages/' + chatId).on('value', snap => {
                const box = document.getElementById('chatBox'); if(!box) return;
                box.innerHTML = '';
                snap.forEach(m => {
                    const msg = m.val();
                    const isMe = msg.sender === auth.currentUser.uid;
                    box.innerHTML += `<div class="${isMe ? 'mr-auto bg-cyan-600' : 'ml-auto bg-slate-800'} max-w-[80%] p-3 rounded-2xl text-[11px]">${msg.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendMsg(chatId) {
            const txt = document.getElementById('chatMsg').value;
            if(!txt) return;
            db.ref('messages/' + chatId).push({ sender: auth.currentUser.uid, name: me.name, text: txt });
            document.getElementById('chatMsg').value = '';
        }

        async function endChat(chatId) {
            if(me.role === 'visitor') {
                const { value: stars } = await Swal.fire({
                    title: 'كيف كانت خدمتنا؟',
                    html: `<div class="flex justify-center gap-2 py-4">${[1,2,3,4,5].map(n => `<i class="fas fa-star text-2xl cursor-pointer text-slate-600" id="star${n}" onclick="setRating(${n})"></i>`).join('')}</div>`,
                    confirmButtonText: 'إرسال التقييم',
                    preConfirm: () => window.userStars || 5
                });
                if(stars) db.ref('ratings').push({ stars, visitorName: me.name, time: Date.now() });
            }
            db.ref('chats/' + chatId).remove();
            db.ref('messages/' + chatId).remove();
            closeModal();
        }

        window.setRating = (n) => {
            window.userStars = n;
            for(let i=1; i<=5; i++) document.getElementById('star'+i).style.color = i<=n ? '#fbbf24' : '#475569';
        };

        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const feed = document.getElementById('postsFeed'); feed.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    feed.innerHTML += `
                        <div class="glass rounded-[2rem] overflow-hidden cyber-card animate__animated animate__fadeIn">
                            <img src="${post.img}" class="w-full h-40 object-cover">
                            <div class="p-6 text-right">
                                <h3 class="text-xl font-black text-white mb-2">${post.title}</h3>
                                <p class="text-slate-400 text-xs mb-4">${post.desc}</p>
                                ${me.role === 'admin' ? `<button onclick="deletePost('${p.key}')" class="text-red-500 text-xs"><i class="fas fa-trash"></i> حذف</button>` : ''}
                            </div>
                        </div>`;
                });
            });
        }

        function deletePost(id) { db.ref('posts/'+id).remove(); }
        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }
        function logout() { auth.signOut().then(() => location.reload()); }
    </script>
</body>
</html>
