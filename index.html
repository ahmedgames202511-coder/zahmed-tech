<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصة الرسمية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; scroll-behavior: smooth; overflow-x: hidden; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .cyber-card { border-radius: 2rem; border: 1px solid rgba(6, 182, 212, 0.15); transition: 0.3s; }
        .cyber-card:hover { border-color: #06b6d4; box-shadow: 0 10px 30px rgba(6, 182, 212, 0.1); }
        .btn-cyan { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; transition: 0.3s; }
        .btn-cyan:hover { box-shadow: 0 0 20px rgba(6, 182, 212, 0.4); transform: scale(1.02); }
        input, textarea { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; }
        .chat-box { height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950 p-4">
        <div class="glass p-8 w-full max-w-md rounded-[2.5rem] text-center cyber-card animate__animated animate__zoomIn">
            <h1 class="text-4xl font-black mb-2 tracking-tighter uppercase">Z Ahmed <span class="text-cyan-400">Tech</span></h1>
            <p class="text-slate-500 text-xs mb-8">لوحة التحكم المركزية للمنصة</p>
            
            <div class="space-y-4">
                <input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full p-4 rounded-xl outline-none">
                <input id="pass" type="password" placeholder="كلمة المرور" class="w-full p-4 rounded-xl outline-none">
                <button onclick="login()" class="w-full btn-cyan py-4 rounded-xl font-bold text-lg">دخول للمنصة</button>
                
                <div class="flex items-center gap-2 py-2">
                    <hr class="flex-grow border-slate-800"> <span class="text-xs text-slate-500">أو عبر</span> <hr class="flex-grow border-slate-800">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="googleSignIn()" class="bg-white text-black py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-2">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="16"> Google
                    </button>
                    <button onclick="phoneSignIn()" class="bg-emerald-600 text-white py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-2">
                        <i class="fas fa-phone-alt"></i> رقم الهاتف
                    </button>
                </div>
            </div>
            <div id="recaptcha-container" class="mt-4"></div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="text-2xl font-black uppercase">Z Ahmed <span class="text-cyan-400">Tech</span></div>
            <div class="flex items-center gap-4">
                <span id="navRole" class="text-[10px] font-bold bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full uppercase tracking-widest">USER</span>
                <button onclick="logout()" class="text-red-500 hover:text-red-400 transition"><i class="fas fa-power-off text-xl"></i></button>
            </div>
        </nav>

        <div class="container mx-auto p-4 lg:p-10 grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <div class="space-y-6">
                <div id="adminMenu" class="hidden glass p-6 rounded-[2rem] border-r-4 border-cyan-500">
                    <h3 class="font-black text-xs text-slate-500 mb-6 uppercase tracking-widest text-right">أدوات الإدارة</h3>
                    <div class="space-y-2 text-right">
                        <button onclick="openTab('addPost')" class="w-full p-3 hover:bg-cyan-500/10 rounded-xl transition flex items-center gap-3">
                            <i class="fas fa-plus-circle text-cyan-400"></i> نشر محتوى جديد
                        </button>
                        <button onclick="openTab('manageWorkers')" class="w-full p-3 hover:bg-cyan-500/10 rounded-xl transition flex items-center gap-3">
                            <i class="fas fa-user-shield text-cyan-400"></i> إضافة موظف (عامل)
                        </button>
                        <button onclick="openTab('manageUsers')" class="w-full p-3 hover:bg-cyan-500/10 rounded-xl transition flex items-center gap-3">
                            <i class="fas fa-users-cog text-cyan-400"></i> التحكم بالحسابات
                        </button>
                        <button onclick="openTab('monitorChats')" class="w-full p-3 hover:bg-cyan-500/10 rounded-xl transition flex items-center gap-3">
                            <i class="fas fa-comments text-cyan-400"></i> مراقبة الدردشات
                        </button>
                    </div>
                </div>

                <button id="supportBtn" onclick="openChat()" class="w-full btn-cyan p-5 rounded-3xl font-black flex items-center justify-center gap-4 shadow-xl shadow-cyan-500/20">
                    <i class="fas fa-headset text-2xl"></i> التواصل مع الدعم
                </button>
            </div>

            <div class="lg:col-span-3 space-y-8">
                <div class="flex items-center justify-between">
                    <h2 class="text-3xl font-black">آخر <span class="text-cyan-400">الأخبار</span></h2>
                    <div class="h-1 flex-grow mx-6 bg-slate-800 rounded-full"></div>
                </div>
                <div id="postsFeed" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
            </div>
        </div>
    </div>

    <div id="mainModal" class="hidden fixed inset-0 z-[2000] bg-black/95 flex items-center justify-center p-4">
        <div class="glass w-full max-w-3xl p-8 rounded-[3rem] relative animate__animated animate__zoomIn">
            <button onclick="closeModal()" class="absolute top-6 left-6 text-2xl hover:text-cyan-400 transition"><i class="fas fa-times-circle"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // --- 1. التكوين (بيانات Firebase) ---
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();
        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com";
        let me = null;

        // --- 2. نظام الدخول ---
        async function login() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } catch { Swal.fire('خطأ', 'البيانات غير صحيحة', 'error'); }
        }

        async function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const res = await auth.signInWithPopup(provider);
                await handleUserRecord(res.user, 'Google Auth');
            } catch (err) { Swal.fire('خطأ', 'فشل تسجيل جوجل: ' + err.message, 'error'); }
        }

        async function phoneSignIn() {
            const { value: phone } = await Swal.fire({ title: 'رقم الهاتف', input: 'tel', inputPlaceholder: '+20...' });
            if(phone) {
                const verifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' });
                const confirm = await auth.signInWithPhoneNumber(phone, verifier);
                const { value: code } = await Swal.fire({ title: 'كود التحقق', input: 'text' });
                const res = await confirm.confirm(code);
                await handleUserRecord(res.user, 'Phone Auth');
            }
        }

        async function handleUserRecord(user, method) {
            const snap = await db.ref('users/' + user.uid).once('value');
            if(!snap.exists()) {
                await db.ref('users/' + user.uid).set({
                    uid: user.uid, email: user.email || user.phoneNumber,
                    name: user.displayName || 'مستخدم جديد',
                    role: user.email === MASTER_ADMIN ? 'admin' : 'visitor',
                    pass: method
                });
            }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('authScreen').classList.add('hidden');
                        document.getElementById('mainApp').classList.remove('hidden');
                        document.getElementById('navRole').innerText = me.role;
                        document.getElementById('adminMenu').classList.toggle('hidden', me.role !== 'admin');
                        document.getElementById('supportBtn').classList.toggle('hidden', me.role === 'admin');
                        loadPosts();
                    }
                });
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        // --- 3. إدارة التبويبات والمودال ---
        function openTab(type) {
            const modal = document.getElementById('mainModal'), content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            content.innerHTML = '';

            if(type === 'addPost') {
                content.innerHTML = `
                    <h2 class="text-2xl font-black mb-6 text-cyan-400">📝 نشر خبر جديد</h2>
                    <div class="space-y-4 text-right">
                        <input id="pT" placeholder="عنوان الخبر" class="w-full p-4 rounded-xl outline-none">
                        <input id="pI" placeholder="رابط الصورة المباشر" class="w-full p-4 rounded-xl outline-none">
                        <textarea id="pD" placeholder="تفاصيل الخبر..." class="w-full p-4 rounded-xl outline-none" rows="4"></textarea>
                        <button onclick="savePost()" class="w-full btn-cyan py-4 rounded-xl font-bold">تأكيد النشر</button>
                    </div>`;
            }
            else if(type === 'manageWorkers') {
                content.innerHTML = `
                    <h2 class="text-2xl font-black mb-6 text-cyan-400">👔 إضافة حساب موظف</h2>
                    <div class="space-y-4">
                        <input id="wE" type="email" placeholder="البريد الإلكتروني للموظف" class="w-full p-4 rounded-xl outline-none">
                        <input id="wP" type="password" placeholder="كلمة المرور" class="w-full p-4 rounded-xl outline-none">
                        <button onclick="createWorker()" class="w-full btn-cyan py-4 rounded-xl font-bold">إنشاء الحساب الآن</button>
                    </div>`;
            }
            else if(type === 'manageUsers') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6 text-cyan-400">👥 التحكم بالحسابات</h2><div id="uList" class="space-y-3 max-h-96 overflow-y-auto px-2"></div>`;
                db.ref('users').on('value', snap => {
                    const list = document.getElementById('uList'); if(!list) return;
                    list.innerHTML = '';
                    snap.forEach(u => {
                        const user = u.val();
                        if(user.email === MASTER_ADMIN) return;
                        list.innerHTML += `
                            <div class="flex justify-between items-center p-4 bg-slate-900 rounded-2xl border border-white/5">
                                <div class="text-right text-xs">
                                    <p class="font-bold text-white text-sm">${user.name} <span class="bg-cyan-500/20 text-cyan-400 px-2 rounded-full text-[8px]">${user.role}</span></p>
                                    <p class="text-slate-500 mt-1">${user.email} | PW: ${user.pass}</p>
                                </div>
                                <button onclick="deleteAccount('${u.key}')" class="text-red-500 hover:scale-125 transition"><i class="fas fa-trash-alt"></i></button>
                            </div>`;
                    });
                });
            }
            else if(type === 'monitorChats') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6 text-cyan-400">💬 مراقبة الدردشات</h2><div id="cList" class="space-y-3 max-h-96 overflow-y-auto"></div>`;
                db.ref('chats').on('value', snap => {
                    const list = document.getElementById('cList'); if(!list) return;
                    list.innerHTML = '';
                    snap.forEach(chat => {
                        list.innerHTML += `<div onclick="openChat('${chat.key}')" class="p-4 bg-white/5 rounded-2xl cursor-pointer hover:border-cyan-500 border border-transparent transition">محادثة مستخدم: ${chat.key}</div>`;
                    });
                });
            }
        }

        // --- 4. نظام الدردشة المباشرة ---
        function openChat(targetUID = null) {
            const uid = targetUID || auth.currentUser.uid;
            const modal = document.getElementById('mainModal'), content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            content.innerHTML = `
                <h2 class="text-2xl font-black mb-4 flex items-center gap-3"><i class="fas fa-comments text-cyan-400"></i> الدردشة الفورية</h2>
                <div id="chatBox" class="chat-box glass rounded-3xl mb-4 border border-white/10"></div>
                <div class="flex gap-2">
                    <input id="chatMsg" placeholder="اكتب رسالتك هنا..." class="flex-grow p-4 rounded-2xl outline-none">
                    <button onclick="sendMsg('${uid}')" class="btn-cyan px-8 rounded-2xl"><i class="fas fa-paper-plane"></i></button>
                </div>`;
            
            db.ref('chats/' + uid).on('value', snap => {
                const box = document.getElementById('chatBox'); if(!box) return;
                box.innerHTML = '';
                snap.forEach(m => {
                    const msg = m.val();
                    const isMe = msg.sender === auth.currentUser.uid;
                    box.innerHTML += `
                        <div class="${isMe ? 'mr-auto bg-cyan-600' : 'ml-auto bg-slate-800'} max-w-[80%] p-3 rounded-2xl text-sm shadow-lg">
                            <p class="font-black text-[9px] mb-1 ${isMe ? 'hidden' : 'block'} text-cyan-300 uppercase">${msg.name}</p>
                            ${msg.text}
                        </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendMsg(uid) {
            const txt = document.getElementById('chatMsg').value;
            if(!txt) return;
            db.ref('chats/' + uid).push({ sender: auth.currentUser.uid, name: me.name, text: txt, time: Date.now() });
            document.getElementById('chatMsg').value = '';
        }

        // --- 5. العمليات (الأوامر) ---
        async function createWorker() {
            const e = document.getElementById('wE').value, p = document.getElementById('wP').value;
            if(!e || !p) return;
            try {
                // سنخزن البيانات في الداتابيز فقط حالياً لمنع تسجيل خروج المدير
                const newId = db.ref('users').push().key;
                await db.ref('users/' + newId).set({ uid: newId, email: e, name: 'موظف_جديد', role: 'worker', pass: p });
                Swal.fire('تم', 'تم إنشاء بيانات الموظف بنجاح', 'success'); closeModal();
            } catch { Swal.fire('خطأ', 'فشل في إنشاء الحساب', 'error'); }
        }

        async function savePost() {
            const t = document.getElementById('pT').value, i = document.getElementById('pI').value, d = document.getElementById('pD').value;
            if(!t || !i || !d) return;
            await db.ref('posts').push({ title: t, img: i, desc: d, author: me.name, status: (me.role === 'admin' ? 'active' : 'pending'), time: Date.now() });
            Swal.fire('نجاح', 'تم النشر بنجاح', 'success'); closeModal();
        }

        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const feed = document.getElementById('postsFeed'); if(!feed) return;
                feed.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    if(post.status === 'active' || me.role === 'admin') {
                        feed.innerHTML += `
                            <div class="glass rounded-[2.5rem] overflow-hidden cyber-card animate__animated animate__fadeIn">
                                <img src="${post.img}" class="w-full h-48 object-cover">
                                <div class="p-6 text-right">
                                    <div class="flex justify-between items-center mb-3">
                                        <span class="text-[9px] bg-cyan-500 text-black px-3 py-1 rounded-full font-black uppercase">News Update</span>
                                        ${me.role === 'admin' ? `<button onclick="deletePost('${p.key}')" class="text-red-500"><i class="fas fa-trash"></i></button>` : ''}
                                    </div>
                                    <h3 class="text-xl font-black text-white mb-3">${post.title}</h3>
                                    <p class="text-slate-400 text-xs leading-relaxed mb-6 line-clamp-3">${post.desc}</p>
                                    <div class="text-[10px] text-slate-600 border-t border-white/5 pt-4 italic">نشر بواسطة: ${post.author}</div>
                                </div>
                            </div>`;
                    }
                });
            });
        }

        async function deleteAccount(id) {
            const res = await Swal.fire({ title: 'حذف نهائي؟', text: 'لن يتمكن هذا المستخدم من الدخول مرة أخرى', icon: 'warning', showCancelButton: true });
            if(res.isConfirmed) db.ref('users/'+id).remove();
        }

        function deletePost(id) { db.ref('posts/'+id).remove(); }
        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }
        function logout() { auth.signOut().then(() => location.reload()); }
    </script>
</body>
</html>
