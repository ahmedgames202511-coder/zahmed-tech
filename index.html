<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | Live Google Auth</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #00f2fe; --staff-clr: #ff9f43; --admin-clr: #ff4757; --dark: #020617; --glass: rgba(15, 23, 42, 0.98); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; }
        
        /* شاشة الدخول */
        #authOverlay { position: fixed; inset: 0; background: var(--dark); z-index: 10000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .auth-card { background: var(--glass); padding: 35px; border-radius: 25px; border: 1px solid #1e293b; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        
        .google-btn { background: white; color: #444; padding: 12px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; border: none; width: 100%; margin-bottom: 20px; transition: 0.3s; }
        .google-btn:hover { background: #eee; transform: translateY(-2px); }

        .btn-toggle-group { display: flex; gap: 5px; margin-bottom: 20px; background: #000; padding: 5px; border-radius: 10px; }
        .btn-toggle-group button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; background: transparent; color: #666; }
        .btn-toggle-group button.active { background: var(--primary); color: #000; font-weight: bold; }

        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: white; border-radius: 10px; }
        .btn-main { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* لوحة التحكم والشبكة */
        #adminDashboard { display: none; background: #0f172a; padding: 25px; margin: 20px 5%; border-radius: 20px; border: 1px solid var(--primary); }
        .tab-nav { display: flex; gap: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-link { cursor: pointer; color: #666; font-weight: bold; font-size: 0.85rem; }
        .tab-link.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .tab-pane { display: none; } .tab-pane.active { display: block; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.8rem; }
        th, td { padding: 10px; border: 1px solid #1e293b; text-align: center; }
        
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; padding: 25px 5%; }
        .card { background: var(--glass); border-radius: 20px; border: 1px solid #1e293b; overflow: hidden; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 15px; }
        .btn-link { display: block; text-align: center; background: var(--primary); color: #000; padding: 10px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 10px; }
        
        .fab { position: fixed; bottom: 20px; left: 20px; width: 60px; height: 60px; background: var(--primary); border-radius: 50%; display: none; justify-content: center; align-items: center; cursor: pointer; color: #000; font-size: 1.5rem; z-index: 5001; }
        .badge { background: var(--admin-clr); padding: 2px 8px; border-radius: 5px; font-size: 0.7rem; }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="auth-card">
        <h2>Z Ahmed Tech</h2>
        
        <button class="google-btn" onclick="loginWithGoogle()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20">
            تسجيل الدخول بواسطة Google
        </button>

        <div style="margin: 10px 0; color: #555;">أو الدخول التقليدي</div>

        <div class="btn-toggle-group">
            <button id="vBtn" class="active" onclick="switchLogin('visitor')">زائر</button>
            <button id="sBtn" onclick="switchLogin('staff')">موظف</button>
            <button id="aBtn" onclick="switchLogin('admin')">المدير</button>
        </div>
        <div id="loginFields">
            <input type="text" id="loginUser" placeholder="الاسم الكامل">
            <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
            <div id="visitorExtra"><input type="tel" id="loginPhone" placeholder="رقم الهاتف"></div>
            <input type="password" id="loginPass" placeholder="كلمة السر" style="display:none;">
            <button class="btn-main" style="background:var(--primary)" onclick="processLogin()">دخول</button>
        </div>
    </div>
</div>

<nav style="background:#000; padding:15px 5%; border-bottom:1px solid #1e293b; display:flex; justify-content:space-between; align-items:center;">
    <div style="font-size: 1.5rem; font-weight: bold;">Z AHMED <span style="color:var(--primary)">TECH</span></div>
    <div id="navUser" style="color:var(--primary); font-weight: bold;"></div>
</nav>

<div id="adminDashboard">
    <div class="tab-nav">
        <span class="tab-link active" onclick="openTab(event, 'staffTab')">إدارة الموظفين</span>
        <span class="tab-link" onclick="openTab(event, 'requestTab')">طلبات النشر <span id="reqCount" class="badge">0</span></span>
        <span class="tab-link" onclick="openTab(event, 'visitorTab')">قاعدة الزوار</span>
        <span class="tab-link" onclick="openTab(event, 'postTab')">نشر منشور</span>
    </div>

    <div id="staffTab" class="tab-pane active">
        <h4>إضافة موظف</h4>
        <div style="display:flex; gap:10px;"><input type="text" id="sName" placeholder="الاسم"> <input type="password" id="sPass" placeholder="كلمة السر"> <button onclick="addStaff()">إضافة</button></div>
        <table id="staffTable"></table>
    </div>

    <div id="requestTab" class="tab-pane">
        <div id="pendingPosts"></div>
    </div>

    <div id="visitorTab" class="tab-pane">
        <table id="visitorTable"></table>
    </div>

    <div id="postTab" class="tab-pane">
        <input type="text" id="pTitle" placeholder="العنوان">
        <textarea id="pDesc" placeholder="الوصف"></textarea>
        <input type="text" id="pMedia" placeholder="رابط الميديا">
        <select id="pType"><option value="img">صورة</option><option value="vid">فيديو</option></select>
        <input type="text" id="pLink" placeholder="رابط الزر">
        <button onclick="submitPost()" class="btn-main" style="background:var(--primary)">نشر الآن</button>
    </div>
</div>

<div class="news-grid" id="mainFeed"></div>
<div class="fab" onclick="toggleDashboard()" id="dashFab"><i class="fas fa-cog"></i></div>

<script>
    // تكوين Firebase (استخدمت بياناتك اللي بعتها)
    const firebaseConfig = {
        apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
        authDomain: "z-ahmed-tech.firebaseapp.com",
        databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
        projectId: "z-ahmed-tech",
        storageBucket: "z-ahmed-tech.firebasestorage.app",
        messagingSenderId: "422229166590",
        appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    const ADMIN_KEY = "21072014";
    const MY_ADMIN_EMAIL = "ahmedgames2025.11@gmail.com";
    let currentUser = null;

    // --- تسجيل الدخول بجوجل ---
    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then(res => {
            const user = res.user;
            if(user.email === MY_ADMIN_EMAIL) {
                currentUser = { name: "أحمد (المدير)", role: "admin", email: user.email };
            } else {
                currentUser = { name: user.displayName, role: "visitor", email: user.email };
            }
            finalizeLogin();
        }).catch(err => alert("حدث خطأ في الاتصال بجوجل"));
    }

    function switchLogin(role) {
        document.querySelectorAll('.btn-toggle-group button').forEach(b => b.classList.remove('active'));
        document.getElementById(role.charAt(0) + 'Btn').classList.add('active');
        document.getElementById('visitorExtra').style.display = role === 'visitor' ? 'block' : 'none';
        document.getElementById('loginPass').style.display = role === 'visitor' ? 'none' : 'block';
    }

    async function processLogin() {
        const name = document.getElementById('loginUser').value;
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;
        const roleBtn = document.querySelector('.btn-toggle-group .active').id;

        if(!name || !email) return alert("اكمل البيانات");

        if(roleBtn === 'aBtn') {
            if(pass === ADMIN_KEY) currentUser = { name: "أحمد (المدير)", role: "admin" };
            else return alert("كود المدير خطأ");
        } else if(roleBtn === 'sBtn') {
            const snap = await db.ref('staff').once('value');
            const staff = snap.val();
            const found = Object.values(staff || {}).find(s => s.name === name && s.pass === pass);
            if(found) currentUser = { name: found.name, role: "staff" };
            else return alert("بيانات الموظف خطأ");
        } else {
            const id = Date.now();
            const phone = document.getElementById('loginPhone').value || "بدون هاتف";
            await db.ref('visitors/' + id).set({ name, email, phone, id });
            currentUser = { name, role: "visitor" };
        }
        finalizeLogin();
    }

    function finalizeLogin() {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('navUser').innerText = currentUser.name;
        if(currentUser.role !== 'visitor') document.getElementById('dashFab').style.display = 'flex';
        render();
    }

    // --- العمليات (نفس منطقك المطور) ---
    async function addStaff() {
        const name = document.getElementById('sName').value, pass = document.getElementById('sPass').value;
        if(!name || !pass) return;
        const id = Date.now();
        await db.ref('staff/' + id).set({ name, pass, id });
        render();
    }

    async function submitPost() {
        const id = Date.now();
        const post = {
            id,
            title: document.getElementById('pTitle').value,
            desc: document.getElementById('pDesc').value,
            media: document.getElementById('pMedia').value,
            type: document.getElementById('pType').value,
            link: document.getElementById('pLink').value,
            status: currentUser.role === 'admin' ? 'approved' : 'pending',
            author: currentUser.name
        };
        await db.ref('posts/' + id).set(post);
        alert("تم الإرسال بنجاح");
        render();
    }

    function render() {
        // قراءة المنشورات
        db.ref('posts').on('value', snap => {
            const posts = snap.val();
            document.getElementById('mainFeed').innerHTML = Object.values(posts || {}).filter(p => p.status === 'approved').reverse().map(p => `
                <div class="card">
                    ${p.type === 'img' ? `<img src="${p.media}">` : `<iframe src="${p.media}"></iframe>`}
                    <div class="card-body">
                        <h3>${p.title}</h3><p>${p.desc}</p>
                        ${p.link ? `<a href="${p.link}" class="btn-link" target="_blank">فتح الرابط</a>` : ''}
                        ${currentUser?.role === 'admin' ? `<button onclick="del('posts/${p.id}')" style="color:red;margin-top:10px;cursor:pointer;background:none;border:none;">حذف المنشور</button>` : ''}
                    </div>
                </div>`).join('');
            
            if(currentUser?.role === 'admin') {
                const pending = Object.values(posts || {}).filter(p => p.status === 'pending');
                document.getElementById('reqCount').innerText = pending.length;
                document.getElementById('pendingPosts').innerHTML = pending.map(p => `<div style="padding:10px;border-bottom:1px solid #333">${p.title} <button onclick="approve(${p.id})">موافقة ونشر</button></div>`).join('');
            }
        });

        // قراءة الزوار والموظفين للإدارة
        if(currentUser?.role === 'admin') {
            db.ref('visitors').on('value', snap => {
                const vis = snap.val();
                document.getElementById('visitorTable').innerHTML = `<thead><tr><th>الاسم</th><th>البريد</th><th>الهاتف</th></tr></thead><tbody>` + 
                Object.values(vis || {}).map(v => `<tr><td>${v.name}</td><td>${v.email}</td><td>${v.phone}</td></tr>`).join('') + `</tbody>`;
            });
            db.ref('staff').on('value', snap => {
                const stf = snap.val();
                document.getElementById('staffTable').innerHTML = `<thead><tr><th>الموظف</th><th>الباسورد</th><th>حذف</th></tr></thead><tbody>` + 
                Object.values(stf || {}).map(s => `<tr><td>${s.name}</td><td>${s.pass}</td><td><button onclick="del('staff/${s.id}')">X</button></td></tr>`).join('') + `</tbody>`;
            });
        }
    }

    function del(path) { if(confirm('متأكد؟')) db.ref(path).remove(); }
    async function approve(id) { await db.ref('posts/'+id).update({status: 'approved'}); render(); }
    function toggleDashboard() { 
        const d = document.getElementById('adminDashboard'); 
        d.style.display = d.style.display === 'block' ? 'none' : 'block'; 
    }
    function openTab(evt, name) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
        document.getElementById(name).classList.add('active');
        evt.currentTarget.classList.add('active');
    }
    
    // تشغيل أولي
    render();
</script>
</body>
</html>
