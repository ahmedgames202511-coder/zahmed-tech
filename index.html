<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | Ultimate Admin Control</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #00f2fe; --admin-clr: #ff4757; --dark: #020617; --glass: rgba(15, 23, 42, 0.98); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; }
        
        /* شاشة الدخول */
        #authOverlay { position: fixed; inset: 0; background: var(--dark); z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .auth-card { background: var(--glass); padding: 35px; border-radius: 25px; border: 1px solid #1e293b; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 0 30px rgba(0, 242, 254, 0.1); }
        .google-btn { background: white; color: #444; padding: 14px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; border: none; width: 100%; margin-top: 20px; font-size: 1rem; }

        /* الهيدر */
        nav { background:#000; padding:15px 5%; border-bottom:1px solid #1e293b; display:flex; justify-content:space-between; align-items:center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: bold; } .logo span { color: var(--primary); }

        /* لوحة التحكم */
        #adminDashboard { display: none; background: #0f172a; padding: 25px; margin: 20px 5%; border-radius: 20px; border: 2px solid var(--primary); }
        .tab-nav { display: flex; gap: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; overflow-x: auto; }
        .tab-link { cursor: pointer; color: #666; font-weight: bold; padding: 5px 10px; white-space: nowrap; }
        .tab-link.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .tab-pane { display: none; } .tab-pane.active { display: block; }
        
        /* الجداول والمنشورات */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border: 1px solid #1e293b; text-align: center; font-size: 0.85rem; }
        th { background: #1e293b; }
        .del-btn { color: #ff4757; cursor: pointer; background: none; border: none; font-size: 1rem; transition: 0.3s; }
        .del-btn:hover { transform: scale(1.2); color: #ff6b81; }

        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; padding: 25px 5%; }
        .card { background: var(--glass); border-radius: 20px; border: 1px solid #1e293b; overflow: hidden; transition: 0.3s; position: relative; }
        .card:hover { border-color: var(--primary); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 15px; }
        
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: white; border-radius: 10px; box-sizing: border-box; }
        .btn-main { background: var(--primary); color: #000; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; }
        
        .fab { position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px; background: var(--primary); border-radius: 50%; display: none; justify-content: center; align-items: center; cursor: pointer; color: #000; font-size: 1.5rem; z-index: 5001; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); }
        .badge { background: var(--admin-clr); padding: 2px 7px; border-radius: 5px; font-size: 0.7rem; margin-right: 5px; }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="auth-card">
        <h2 class="logo">Z AHMED <span>TECH</span></h2>
        <p>مرحباً بك! سجل دخولك للتحكم في المنصة</p>
        <button class="google-btn" onclick="loginWithGoogle()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20">
            الدخول بواسطة Google
        </button>
    </div>
</div>

<nav>
    <div class="logo">Z AHMED <span>TECH</span></div>
    <div id="navUser" style="color:var(--primary); font-weight:bold"></div>
</nav>

<div id="adminDashboard">
    <div class="tab-nav">
        <span class="tab-link active" onclick="openTab(event, 'postTab')"><i class="fas fa-plus"></i> نشر جديد</span>
        <span class="tab-link" onclick="openTab(event, 'requestTab')"><i class="fas fa-clock"></i> طلبات الموظفين <span id="reqCount" class="badge">0</span></span>
        <span class="tab-link" onclick="openTab(event, 'visitorTab')"><i class="fas fa-users"></i> الزوار</span>
        <span class="tab-link" onclick="openTab(event, 'staffTab')"><i class="fas fa-user-shield"></i> الموظفين</span>
    </div>

    <div id="postTab" class="tab-pane active">
        <h4>إضافة محتوى جديد للموقع</h4>
        <input type="text" id="pTitle" placeholder="عنوان الخبر">
        <textarea id="pDesc" placeholder="تفاصيل الخبر..." rows="4"></textarea>
        <input type="text" id="pMedia" placeholder="رابط الصورة (URL)">
        <select id="pType"><option value="img">صورة</option><option value="vid">فيديو</option></select>
        <input type="text" id="pLink" placeholder="رابط الزر (اختياري)">
        <button onclick="submitPost()" class="btn-main">نشر الآن</button>
    </div>

    <div id="requestTab" class="tab-pane">
        <h4>منشورات تنتظر موافقتك</h4>
        <div id="pendingPosts"></div>
    </div>

    <div id="visitorTab" class="tab-pane">
        <h4>قائمة الزوار والتحكم بالحسابات</h4>
        <table id="visitorTable"></table>
    </div>

    <div id="staffTab" class="tab-pane">
        <h4>إدارة طاقم العمل</h4>
        <div style="display:flex; gap:10px; margin-bottom: 20px;">
            <input type="text" id="sName" placeholder="اسم الموظف">
            <input type="text" id="sEmail" placeholder="إيميله المعتمد">
            <button onclick="addStaff()" style="background:orange; border:none; padding:10px; border-radius:10px; cursor:pointer; font-weight:bold; min-width:100px;">إضافة</button>
        </div>
        <table id="staffTable"></table>
    </div>
</div>

<div class="news-grid" id="mainFeed"></div>

<div class="fab" onclick="toggleDashboard()" id="dashFab"><i class="fas fa-sliders-h"></i></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
        authDomain: "z-ahmed-tech.firebaseapp.com",
        databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
        projectId: "z-ahmed-tech",
        storageBucket: "z-ahmed-tech.firebasestorage.app",
        messagingSenderId: "422229166590",
        appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    const MY_ADMIN_EMAIL = "ahmedgames2025.11@gmail.com";
    let currentUser = null;

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then(async res => {
            const user = res.user;
            const staffSnap = await db.ref('staff').once('value');
            const staffList = staffSnap.val() || {};
            const isStaff = Object.values(staffList).find(s => s.email === user.email);

            if(user.email === MY_ADMIN_EMAIL) {
                currentUser = { name: "المدير أحمد", role: "admin", email: user.email };
            } else if(isStaff) {
                currentUser = { name: user.displayName, role: "staff", email: user.email };
            } else {
                currentUser = { name: user.displayName, role: "visitor", email: user.email };
                db.ref('visitors/' + user.uid).set({ id: user.uid, name: user.displayName, email: user.email, date: Date.now() });
            }

            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('navUser').innerText = currentUser.name;
            if(currentUser.role !== 'visitor') document.getElementById('dashFab').style.display = 'flex';
            render();
        }).catch(e => alert("خطأ في تسجيل الدخول"));
    }

    async function submitPost() {
        const id = Date.now();
        const post = {
            id,
            title: document.getElementById('pTitle').value,
            desc: document.getElementById('pDesc').value,
            media: document.getElementById('pMedia').value,
            type: document.getElementById('pType').value,
            link: document.getElementById('pLink').value,
            status: currentUser.role === 'admin' ? 'approved' : 'pending',
            author: currentUser.name
        };
        if(!post.title || !post.media) return alert("اكمل البيانات");
        await db.ref('posts/' + id).set(post);
        alert(currentUser.role === 'admin' ? "تم النشر بنجاح" : "تم الإرسال للمدير للمراجعة");
        clearInputs();
    }

    function render() {
        db.ref('posts').on('value', snap => {
            const posts = snap.val() || {};
            const feed = document.getElementById('mainFeed');
            feed.innerHTML = Object.values(posts).filter(p => p.status === 'approved').reverse().map(p => `
                <div class="card">
                    ${currentUser.role === 'admin' ? `<button onclick="del('posts/${p.id}')" style="position:absolute; top:10px; right:10px; z-index:10; background:rgba(0,0,0,0.6); padding:8px; border-radius:10px;" class="del-btn"><i class="fas fa-trash"></i></button>` : ''}
                    <img src="${p.media}">
                    <div class="card-body">
                        <h3>${p.title}</h3><p>${p.desc}</p>
                        ${p.link ? `<a href="${p.link}" target="_blank" style="color:var(--primary); text-decoration:none; font-size:0.9rem;">🔗 فتح الرابط</a>` : ''}
                    </div>
                </div>
            `).join('');

            if(currentUser.role === 'admin') {
                const pending = Object.values(posts).filter(p => p.status === 'pending');
                document.getElementById('reqCount').innerText = pending.length;
                document.getElementById('pendingPosts').innerHTML = pending.map(p => `
                    <div style="background:#1e293b; padding:15px; border-radius:10px; margin-bottom:10px;">
                        <strong>${p.title}</strong> <br> <small>المصدر: ${p.author}</small>
                        <div style="margin-top:10px; display:flex; gap:10px;">
                            <button onclick="approve(${p.id})" style="background:green; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer">نشر الآن</button>
                            <button onclick="del('posts/${p.id}')" style="background:red; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer">حذف الطلب</button>
                        </div>
                    </div>
                `).join('');
            }
        });

        if(currentUser.role === 'admin') {
            db.ref('visitors').on('value', snap => {
                const vis = snap.val() || {};
                document.getElementById('visitorTable').innerHTML = `<tr><th>الاسم</th><th>البريد</th><th>إجراء</th></tr>` + 
                Object.values(vis).map(v => `<tr><td>${v.name}</td><td>${v.email}</td><td><button class="del-btn" onclick="del('visitors/${v.id}')"><i class="fas fa-user-times"></i></button></td></tr>`).join('');
            });
            db.ref('staff').on('value', snap => {
                const stf = snap.val() || {};
                document.getElementById('staffTable').innerHTML = `<tr><th>الموظف</th><th>الإيميل</th><th>إجراء</th></tr>` + 
                Object.values(stf).map(s => `<tr><td>${s.name}</td><td>${s.email}</td><td><button class="del-btn" onclick="del('staff/${s.id}')"><i class="fas fa-trash-alt"></i></button></td></tr>`).join('');
            });
        }
    }

    async function addStaff() {
        const name = document.getElementById('sName').value;
        const email = document.getElementById('sEmail').value;
        if(!name || !email) return alert("امسأ البيانات أولاً");
        const id = Date.now();
        await db.ref('staff/' + id).set({ id, name, email });
        alert("تم تعيين الموظف بنجاح");
        document.getElementById('sName').value = ''; document.getElementById('sEmail').value = '';
    }

    async function approve(id) { await db.ref('posts/'+id).update({status: 'approved'}); }
    function del(path) { 
        if(confirm('🚨 تحذير: هل أنت متأكد تماماً من حذف هذا العنصر؟ لا يمكن التراجع.')) {
            db.ref(path).remove().then(() => {
                if(path.includes('visitors')) alert('تم مسح حساب الزائر بنجاح');
            });
        }
    }
    
    function toggleDashboard() { const d = document.getElementById('adminDashboard'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; }
    function openTab(evt, name) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
        document.getElementById(name).classList.add('active');
        evt.currentTarget.classList.add('active');
    }
    function clearInputs() { document.getElementById('pTitle').value = ''; document.getElementById('pDesc').value = ''; document.getElementById('pMedia').value = ''; }
    render();
</script>
</body>
</html>
