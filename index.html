<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصة المتكاملة</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; scroll-behavior: smooth; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .cyber-card { border-radius: 2rem; border: 1px solid rgba(6, 182, 212, 0.1); transition: 0.4s; overflow: hidden; }
        .cyber-card:hover { border-color: #06b6d4; box-shadow: 0 0 30px rgba(6, 182, 212, 0.15); transform: translateY(-5px); }
        .btn-cyan { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; transition: 0.3s; }
        .btn-cyan:hover { opacity: 0.9; box-shadow: 0 0 20px rgba(6, 182, 212, 0.4); }
        input, textarea { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; width: 100%; padding: 1rem; border-radius: 1rem; outline: none; transition: 0.3s; }
        input:focus { border-color: #06b6d4 !important; box-shadow: 0 0 10px rgba(6, 182, 212, 0.2); }
        .social-btn { padding: 0.6rem 1.2rem; border-radius: 0.75rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; font-weight: bold; transition: 0.3s; }
        #recaptcha-container { margin: 10px 0; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950 p-4">
        <div class="glass p-8 w-full max-w-md rounded-[2.5rem] text-center border border-cyan-500/20 shadow-2xl">
            <h1 class="text-3xl font-black mb-6 text-white tracking-tighter">Z AHMED <span class="text-cyan-400">TECH</span></h1>
            
            <div class="space-y-4 mb-6">
                <input id="email" type="email" placeholder="البريد الإلكتروني">
                <input id="pass" type="password" placeholder="كلمة المرور">
                <button onclick="login()" class="w-full btn-cyan py-4 rounded-xl font-bold">دخول للمنصة</button>
            </div>

            <div class="flex items-center gap-2 mb-6"><hr class="flex-grow border-slate-800"> <span class="text-[10px] text-slate-500 font-bold uppercase">أو عبر</span> <hr class="flex-grow border-slate-800"></div>

            <div class="grid grid-cols-1 gap-3">
                <button onclick="googleSignIn()" class="w-full py-3 bg-white text-black rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-200 transition">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="18"> Google
                </button>
                <button onclick="facebookSignIn()" class="w-full py-3 bg-[#1877F2] text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90 transition">
                    <i class="fab fa-facebook-f"></i> Facebook
                </button>
                <button onclick="phoneSignIn()" class="w-full py-3 bg-emerald-600 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:opacity-90 transition">
                    <i class="fas fa-phone-alt"></i> Phone Number
                </button>
            </div>
            <div id="recaptcha-container"></div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="text-xl font-black text-white">Z AHMED <span class="text-cyan-400">TECH</span></div>
            <div class="flex items-center gap-4">
                <span id="navRole" class="text-[9px] bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full font-black uppercase border border-cyan-500/30"></span>
                <button onclick="logout()" class="text-red-500 hover:scale-110 transition"><i class="fas fa-power-off text-lg"></i></button>
            </div>
        </nav>

        <div class="container mx-auto p-4 lg:p-10 grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="space-y-4">
                <div id="staffPanel" class="hidden glass p-6 rounded-[2.5rem] border-r-4 border-cyan-500 space-y-2">
                    <p class="text-[10px] text-slate-500 font-black uppercase mb-4">لوحة الإدارة</p>
                    <button onclick="openTab('addPost')" class="w-full text-right p-3 hover:bg-slate-800 rounded-xl flex items-center gap-3 transition"><i class="fas fa-plus-circle text-cyan-400"></i> نشر جديد</button>
                    <button id="adminOnlyBtn" onclick="openTab('manageUsers')" class="hidden w-full text-right p-3 hover:bg-slate-800 rounded-xl flex items-center gap-3 transition"><i class="fas fa-user-shield text-cyan-400"></i> إدارة الحسابات</button>
                    <button onclick="openTab('supportMsgs')" class="w-full text-right p-3 hover:bg-slate-800 rounded-xl flex items-center gap-3 transition"><i class="fas fa-envelope-open-text text-cyan-400"></i> رسائل الدعم</button>
                </div>

                <div class="glass p-6 rounded-[2.5rem] border-r-4 border-emerald-500">
                    <button onclick="openTab('contactSupport')" class="w-full text-right p-3 bg-emerald-500/10 hover:bg-emerald-500/20 rounded-xl flex items-center gap-3 text-emerald-400 font-bold transition">
                        <i class="fas fa-headset"></i> تواصل مع الدعم
                    </button>
                </div>
            </div>

            <div class="lg:col-span-3">
                <div id="postsFeed" class="grid grid-cols-1 gap-8"></div>
            </div>
        </div>
    </div>

    <div id="mainModal" class="hidden fixed inset-0 z-[2000] bg-black/95 flex items-center justify-center p-4">
        <div class="glass w-full max-w-3xl p-8 rounded-[3rem] relative max-h-[90vh] overflow-y-auto border border-white/10 shadow-2xl">
            <button onclick="closeModal()" class="absolute top-6 left-6 text-2xl hover:text-red-500 transition"><i class="fas fa-times-circle"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // --- إعدادات Firebase الخاصة بك ---
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com";
        let me = null;

        // --- وظائف تسجيل الدخول ---
        async function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } 
            catch(err) { Swal.fire('خطأ', 'تأكد من تفعيل الطريقة في Firebase وصحة البيانات', 'error'); }
        }

        async function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try { const res = await auth.signInWithPopup(provider); handleUser(res.user); } catch(e) { console.error(e); }
        }

        async function facebookSignIn() {
            const provider = new firebase.auth.FacebookAuthProvider();
            try { const res = await auth.signInWithPopup(provider); handleUser(res.user); } 
            catch(e) { Swal.fire('خطأ فيسبوك', 'تأكد من وضع App ID و App Secret في Firebase', 'error'); }
        }

        async function phoneSignIn() {
            const { value: phone } = await Swal.fire({ title: 'رقم الهاتف مع كود الدولة', input: 'tel', inputPlaceholder: '+2010...', showCancelButton: true });
            if (!phone) return;
            const verifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' });
            try {
                const confirmation = await auth.signInWithPhoneNumber(phone, verifier);
                const { value: code } = await Swal.fire({ title: 'ادخل كود التحقق', input: 'text', confirmButtonText: 'تأكيد' });
                const res = await confirmation.confirm(code);
                handleUser(res.user);
            } catch(e) { Swal.fire('خطأ', e.message, 'error'); }
        }

        async function handleUser(user) {
            const snap = await db.ref('users/' + user.uid).once('value');
            if(!snap.exists()) {
                await db.ref('users/' + user.uid).set({
                    uid: user.uid, email: user.email || user.phoneNumber, 
                    name: user.displayName || "User", 
                    role: (user.email === MASTER_ADMIN) ? 'admin' : 'visitor', 
                    pass: 'Social Login'
                });
            }
            location.reload();
        }

        // --- مراقبة حالة المستخدم ---
        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('authScreen').classList.add('hidden');
                        document.getElementById('mainApp').classList.remove('hidden');
                        document.getElementById('navRole').innerText = me.role;
                        const isAdmin = me.role === 'admin' || me.email === MASTER_ADMIN;
                        const isWorker = me.role === 'worker';
                        document.getElementById('staffPanel').classList.toggle('hidden', !(isAdmin || isWorker));
                        document.getElementById('adminOnlyBtn').classList.toggle('hidden', !isAdmin);
                        loadPosts();
                    }
                });
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        // --- وظائف لوحة التحكم ---
        function openTab(type) {
            const modal = document.getElementById('mainModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            content.innerHTML = '';

            if(type === 'addPost') {
                content.innerHTML = `
                    <h2 class="text-2xl font-black mb-6 text-cyan-400">📝 منشور جديد</h2>
                    <div class="space-y-4 text-right">
                        <input id="pTitle" type="text" placeholder="العنوان">
                        <input id="pImg" type="url" placeholder="رابط الصورة">
                        <div class="grid grid-cols-2 gap-4">
                            <input id="pPhone" type="tel" placeholder="واتساب">
                            <input id="pFb" type="url" placeholder="لينك فيسبوك">
                        </div>
                        <textarea id="pDesc" rows="5" placeholder="اكتب المحتوى هنا..."></textarea>
                        <button onclick="submitPost()" class="w-full btn-cyan py-4 rounded-xl font-bold">نشر الآن</button>
                    </div>`;
            }
            else if(type === 'manageUsers') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6">👥 إدارة الحسابات</h2><div id="uList" class="space-y-3"></div>`;
                db.ref('users').on('value', snap => {
                    const list = document.getElementById('uList'); list.innerHTML = '';
                    snap.forEach(u => {
                        const user = u.val();
                        list.innerHTML += `<div class="p-4 bg-slate-900 rounded-2xl border border-slate-800 flex justify-between items-center text-right">
                            <div><p class="font-bold text-white">${user.name} <span class="text-[10px] text-cyan-400">[${user.role}]</span></p>
                            <p class="text-[10px] text-slate-500">${user.email} | P: ${user.pass}</p></div>
                            ${user.email !== MASTER_ADMIN ? `<button onclick="deleteUser('${u.key}')" class="text-red-500"><i class="fas fa-trash"></i></button>` : ''}
                        </div>`;
                    });
                });
            }
            else if(type === 'supportMsgs') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6">📩 رسائل الدعم</h2><div id="mList" class="space-y-3"></div>`;
                db.ref('support').on('value', snap => {
                    const list = document.getElementById('mList'); list.innerHTML = '';
                    snap.forEach(m => {
                        const msg = m.val();
                        list.innerHTML += `<div class="p-4 bg-slate-900 rounded-2xl border border-slate-700 text-right">
                            <p class="text-cyan-400 font-bold text-xs mb-1">${msg.senderName}</p>
                            <p class="text-white text-sm">${msg.text}</p>
                        </div>`;
                    });
                });
            }
            else if(type === 'contactSupport') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6 text-emerald-400">💬 تواصل معنا</h2>
                <textarea id="sMsg" rows="5" placeholder="كيف نساعدك؟"></textarea>
                <button onclick="sendSupportMsg()" class="w-full bg-emerald-600 mt-4 py-4 rounded-xl font-bold">إرسال الرسالة</button>`;
            }
        }

        async function submitPost() {
            const title = document.getElementById('pTitle').value;
            const img = document.getElementById('pImg').value;
            const desc = document.getElementById('pDesc').value;
            const phone = document.getElementById('pPhone').value;
            const fb = document.getElementById('pFb').value;
            if(!title || !img || !desc) return;
            await db.ref('posts').push({ title, img, desc, phone, fb, author: me.name, time: Date.now() });
            Swal.fire('تم!', 'نُشر بنجاح', 'success'); closeModal();
        }

        async function sendSupportMsg() {
            const text = document.getElementById('sMsg').value;
            if(!text) return;
            await db.ref('support').push({ text, senderName: me.name, time: Date.now() });
            Swal.fire('تم', 'سنرد عليك قريباً', 'success'); closeModal();
        }

        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const feed = document.getElementById('postsFeed'); feed.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    feed.insertAdjacentHTML('afterbegin', `
                        <div class="glass cyber-card animate__animated animate__fadeIn">
                            <img src="${post.img}" class="w-full h-64 object-cover">
                            <div class="p-6 text-right">
                                <div class="flex justify-between mb-4">
                                    <span class="text-[10px] bg-cyan-500 text-black px-2 py-1 rounded font-black">Z TECH</span>
                                    ${(me.role === 'admin' || me.email === MASTER_ADMIN) ? `<button onclick="deletePost('${p.key}')" class="text-red-500"><i class="fas fa-trash"></i></button>` : ''}
                                </div>
                                <h3 class="text-2xl font-black text-white mb-4">${post.title}</h3>
                                <p class="text-slate-400 text-sm mb-6 leading-relaxed">${post.desc}</p>
                                <div class="flex gap-3 mb-6">
                                    ${post.phone ? `<a href="https://wa.me/${post.phone}" target="_blank" class="social-btn bg-green-600/20 text-green-400 hover:bg-green-600 hover:text-white"><i class="fab fa-whatsapp"></i> واتساب</a>` : ''}
                                    ${post.fb ? `<a href="${post.fb}" target="_blank" class="social-btn bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white"><i class="fab fa-facebook-f"></i> فيسبوك</a>` : ''}
                                </div>
                                <div class="text-[10px] text-slate-600 pt-4 border-t border-white/5">الناشر: ${post.author}</div>
                            </div>
                        </div>`);
                });
            });
        }

        async function deletePost(id) { db.ref('posts/'+id).remove(); }
        async function deleteUser(id) { db.ref('users/'+id).remove(); }
        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }
        function logout() { auth.signOut().then(() => location.reload()); }
    </script>
</body>
</html>
