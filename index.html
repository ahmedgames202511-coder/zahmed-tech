<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصه الرسمية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-cyan { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; }
        .chat-box { height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 15px; }
        .star-rating { color: #fbbf24; cursor: pointer; font-size: 1.5rem; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950 p-4">
        <div class="glass p-8 w-full max-w-md rounded-[2.5rem] text-center border border-cyan-500/20">
            <h1 class="text-4xl font-black mb-8">Z AHMED <span class="text-cyan-400">TECH</span></h1>
            <button onclick="googleSignIn()" class="w-full bg-white text-black py-4 rounded-2xl font-bold flex items-center justify-center gap-3">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20"> الدخول عبر جوجل
            </button>
            <p class="text-[10px] text-slate-500 mt-4">للموظفين: يرجى استخدام الإيميل المسجل لدى الإدارة</p>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="text-xl font-black uppercase">Z Ahmed <span class="text-cyan-400">Tech</span></div>
            <div class="flex items-center gap-4">
                <span id="navRole" class="text-[9px] font-bold bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full uppercase">USER</span>
                <button onclick="logout()" class="text-red-500"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </nav>

        <div class="container mx-auto p-4 lg:p-8 grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div id="sideMenu" class="space-y-4">
                <div id="adminMenu" class="hidden glass p-5 rounded-[1.5rem] border-r-4 border-cyan-500 space-y-2">
                    <p class="text-[10px] font-bold text-slate-500 mb-4 uppercase">لوحة التحكم</p>
                    <button onclick="openTab('manageWorkers')" class="w-full text-right p-3 hover:bg-white/5 rounded-lg flex gap-3"><i class="fas fa-user-tie text-cyan-400"></i> تسجيل موظف</button>
                    <button onclick="openTab('assignChats')" class="w-full text-right p-3 hover:bg-white/5 rounded-lg flex gap-3"><i class="fas fa-project-diagram text-cyan-400"></i> توزيع المحادثات</button>
                    <button onclick="openTab('viewRatings')" class="w-full text-right p-3 hover:bg-white/5 rounded-lg flex gap-3"><i class="fas fa-star text-yellow-400"></i> سجل التقييمات</button>
                </div>

                <button id="supportBtn" onclick="startSupport()" class="w-full btn-cyan p-4 rounded-2xl font-bold flex items-center justify-center gap-3">
                    <i class="fas fa-headset"></i> اطلب دعم فني
                </button>
            </div>

            <div class="lg:col-span-3">
                <div id="postsFeed" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </div>
        </div>
    </div>

    <div id="mainModal" class="hidden fixed inset-0 z-[2000] bg-black/90 flex items-center justify-center p-4">
        <div class="glass w-full max-w-2xl p-6 rounded-[2rem] relative animate__animated animate__zoomIn">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-xl"><i class="fas fa-times"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();
        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com";
        let me = null;

        // --- AUTH ---
        async function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const res = await auth.signInWithPopup(provider);
                const user = res.user;
                
                // التحقق هل هو موظف مسجل مسبقاً؟
                const workerSnap = await db.ref('approved_workers').orderByValue().equalTo(user.email).once('value');
                const role = user.email === MASTER_ADMIN ? 'admin' : (workerSnap.exists() ? 'worker' : 'visitor');
                
                await db.ref('users/' + user.uid).update({
                    uid: user.uid, email: user.email, name: user.displayName, role: role
                });
            } catch (e) { Swal.fire('خطأ', 'فشل تسجيل الدخول', 'error'); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('authScreen').classList.add('hidden');
                        document.getElementById('mainApp').classList.remove('hidden');
                        document.getElementById('navRole').innerText = me.role;
                        document.getElementById('adminMenu').classList.toggle('hidden', me.role !== 'admin');
                        document.getElementById('supportBtn').classList.toggle('hidden', me.role === 'admin');
                        loadPosts();
                        if(me.role === 'worker') checkAssignedChats();
                    }
                });
            } else { document.getElementById('authScreen').classList.remove('hidden'); }
        });

        // --- ميزات المدير ---
        function openTab(type) {
            const content = document.getElementById('modalContent');
            document.getElementById('mainModal').classList.remove('hidden');

            if(type === 'manageWorkers') {
                content.innerHTML = `
                    <h2 class="text-xl font-bold mb-4">تسجيل إيميل موظف جديد</h2>
                    <input id="workerEmail" placeholder="أدخل إيميل الموظف (جيميل)" class="w-full p-4 rounded-xl mb-4">
                    <button onclick="addWorkerEmail()" class="w-full btn-cyan py-3 rounded-xl font-bold">حفظ الموظف</button>`;
            } 
            else if(type === 'assignChats') {
                content.innerHTML = `<h2 class="text-xl font-bold mb-4">توزيع المحادثات على الموظفين</h2><div id="assignList" class="space-y-3"></div>`;
                renderAssignList();
            }
            else if(type === 'viewRatings') {
                content.innerHTML = `<h2 class="text-xl font-bold mb-4 text-yellow-400">سجل التقييمات</h2><div id="ratingsList" class="space-y-2"></div>`;
                db.ref('ratings').on('value', snap => {
                    const rList = document.getElementById('ratingsList'); rList.innerHTML = '';
                    snap.forEach(r => {
                        const data = r.val();
                        rList.innerHTML += `<div class="p-3 bg-white/5 rounded-xl border border-white/10 text-xs">
                            <span class="text-yellow-400">${'★'.repeat(data.stars)}</span> | 
                            <b>الموظف:</b> ${data.workerName} | <b>الزائر:</b> ${data.visitorName}
                        </div>`;
                    });
                });
            }
        }

        async function addWorkerEmail() {
            const email = document.getElementById('workerEmail').value;
            if(email) {
                await db.ref('approved_workers').push(email);
                Swal.fire('تم', 'تم اعتماد إيميل الموظف. يمكنه الآن الدخول بجوجل.', 'success');
                closeModal();
            }
        }

        function renderAssignList() {
            db.ref('chats').on('value', snap => {
                const list = document.getElementById('assignList'); if(!list) return;
                list.innerHTML = '';
                snap.forEach(chat => {
                    if(!chat.val().assignedTo) {
                        list.innerHTML += `<div class="p-4 bg-white/5 rounded-xl flex justify-between items-center">
                            <span>محادثة من: ${chat.val().visitorName}</span>
                            <button onclick="pickWorkerForChat('${chat.key}')" class="bg-cyan-500 text-black px-4 py-1 rounded-lg text-xs font-bold">تعيين موظف</button>
                        </div>`;
                    }
                });
            });
        }

        async function pickWorkerForChat(chatId) {
            const workers = await db.ref('users').orderByChild('role').equalTo('worker').once('value');
            let options = {};
            workers.forEach(w => { options[w.key] = w.val().name; });
            
            const { value: workerId } = await Swal.fire({
                title: 'اختر موظفاً',
                input: 'select',
                inputOptions: options,
                showCancelButton: true
            });

            if(workerId) {
                await db.ref('chats/' + chatId).update({ assignedTo: workerId, status: 'open' });
                Swal.fire('تم التعيين', 'الموظف سيستلم المحادثة الآن', 'success');
            }
        }

        // --- نظام الدردشة والتقييم ---
        function startSupport() {
            const chatId = me.uid;
            db.ref('chats/' + chatId).update({
                visitorName: me.name,
                status: 'waiting',
                assignedTo: null
            });
            openChatWindow(chatId);
        }

        function openChatWindow(chatId) {
            const modal = document.getElementById('mainModal'), content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            content.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold">محادثة الدعم المباشر</h2>
                    <button onclick="endChat('${chatId}')" class="bg-red-500/20 text-red-500 px-3 py-1 rounded-lg text-[10px] font-bold">إنهاء وإغلاق</button>
                </div>
                <div id="chatBox" class="chat-box glass rounded-2xl mb-4 border border-white/5"></div>
                <div class="flex gap-2">
                    <input id="chatMsg" placeholder="اكتب رسالتك..." class="flex-grow p-4 rounded-xl outline-none">
                    <button onclick="sendMsg('${chatId}')" class="btn-cyan px-6 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                </div>`;
            
            db.ref('messages/' + chatId).on('value', snap => {
                const box = document.getElementById('chatBox'); if(!box) return;
                box.innerHTML = '';
                snap.forEach(m => {
                    const msg = m.val();
                    const isMe = msg.sender === auth.currentUser.uid;
                    box.innerHTML += `<div class="${isMe ? 'mr-auto bg-cyan-600' : 'ml-auto bg-slate-800'} max-w-[80%] p-3 rounded-2xl text-xs shadow-sm">
                        <p class="text-[8px] opacity-50 mb-1">${msg.name}</p>${msg.text}
                    </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendMsg(chatId) {
            const txt = document.getElementById('chatMsg').value;
            if(!txt) return;
            db.ref('messages/' + chatId).push({ sender: auth.currentUser.uid, name: me.name, text: txt });
            document.getElementById('chatMsg').value = '';
        }

        async function endChat(chatId) {
            const chatSnap = await db.ref('chats/' + chatId).once('value');
            const chatData = chatSnap.val();

            if(me.role === 'visitor' && chatData.assignedTo) {
                // عرض نافذة التقييم للزائر
                const { value: stars } = await Swal.fire({
                    title: 'كيف كان مستوى الخدمة؟',
                    html: `
                        <div class="flex justify-center gap-2">
                            <i class="fas fa-star star-rating" onclick="setStar(1)"></i>
                            <i class="fas fa-star star-rating" onclick="setStar(2)"></i>
                            <i class="fas fa-star star-rating" onclick="setStar(3)"></i>
                            <i class="fas fa-star star-rating" onclick="setStar(4)"></i>
                            <i class="fas fa-star star-rating" onclick="setStar(5)"></i>
                        </div>`,
                    showCancelButton: true,
                    preConfirm: () => window.currentStars || 5
                });

                if(stars) {
                    const workerInfo = await db.ref('users/' + chatData.assignedTo).once('value');
                    await db.ref('ratings').push({
                        stars: stars,
                        workerId: chatData.assignedTo,
                        workerName: workerInfo.val().name,
                        visitorName: me.name,
                        time: Date.now()
                    });
                    Swal.fire('شكراً لك!', 'تم إرسال تقييمك للمدير والموظف', 'success');
                }
            }
            
            await db.ref('chats/' + chatId).remove();
            await db.ref('messages/' + chatId).remove();
            closeModal();
        }

        window.setStar = (n) => {
            window.currentStars = n;
            const stars = document.querySelectorAll('.star-rating');
            stars.forEach((s, i) => s.style.color = i < n ? '#fbbf24' : '#475569');
        };

        function checkAssignedChats() {
            db.ref('chats').orderByChild('assignedTo').equalTo(auth.currentUser.uid).on('value', snap => {
                if(snap.exists()) {
                    snap.forEach(chat => {
                        Swal.fire({
                            title: 'محادثة جديدة!',
                            text: `لديك طلب دعم من ${chat.val().visitorName}`,
                            icon: 'info',
                            toast: true,
                            position: 'top-end',
                            showConfirmButton: true
                        }).then(() => openChatWindow(chat.key));
                    });
                }
            });
        }

        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const feed = document.getElementById('postsFeed'); if(!feed) return;
                feed.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    feed.innerHTML += `<div class="glass rounded-3xl overflow-hidden border border-white/5">
                        <img src="${post.img}" class="w-full h-40 object-cover">
                        <div class="p-4"><h3 class="font-bold text-sm">${post.title}</h3></div>
                    </div>`;
                });
            });
        }

        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }
        function logout() { auth.signOut().then(() => location.reload()); }
    </script>
</body>
</html>
