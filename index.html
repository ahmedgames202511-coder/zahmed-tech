<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | Control Center</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .cyber-card { border-radius: 2rem; border: 1px solid rgba(6, 182, 212, 0.1); transition: 0.3s; }
        .cyber-card:hover { border-color: #06b6d4; box-shadow: 0 10px 30px rgba(6, 182, 212, 0.2); }
        .btn-cyan { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; }
        input, textarea { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; width: 100%; padding: 1rem; border-radius: 1rem; outline: none; }
        .long-text { white-space: pre-wrap; line-height: 1.8; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950 p-4">
        <div class="glass p-8 w-full max-w-md rounded-[2.5rem] text-center border border-cyan-500/20 shadow-2xl">
            <h1 class="text-3xl font-black mb-6 text-white uppercase tracking-tighter">Z AHMED <span class="text-cyan-400">TECH</span></h1>
            <div class="space-y-4">
                <input id="email" type="email" placeholder="البريد الإلكتروني">
                <input id="pass" type="password" placeholder="كلمة المرور">
                <button onclick="login()" class="w-full btn-cyan py-4 rounded-xl font-bold shadow-lg transform active:scale-95 transition">دخول للمنصة</button>
                <div class="text-slate-600 text-xs">أو تسجيل سريع</div>
                <button onclick="googleSignIn()" class="w-full bg-white text-black py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-200 transition">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="18"> Google Login
                </button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden animate__animated animate__fadeIn">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="text-xl font-black tracking-tighter text-white">Z AHMED <span class="text-cyan-400">TECH</span></div>
            <div class="flex items-center gap-4">
                <span id="navRole" class="text-[10px] bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full font-black uppercase tracking-widest"></span>
                <button onclick="logout()" class="text-red-500 hover:scale-110 transition"><i class="fas fa-power-off text-lg"></i></button>
            </div>
        </nav>

        <div class="container mx-auto p-4 lg:p-10 grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="space-y-4">
                <div id="staffPanel" class="hidden glass p-6 rounded-[2.5rem] border-r-4 border-cyan-500 space-y-2">
                    <p class="text-[10px] text-slate-500 font-black uppercase mb-4 tracking-widest">أدوات العمل</p>
                    <button onclick="openTab('addPost')" class="w-full text-right p-3 hover:bg-slate-800 rounded-xl flex items-center gap-3 transition"><i class="fas fa-pen-nib text-cyan-400"></i> نشر مقال جديد</button>
                    <button id="adminOnlyBtn" onclick="openTab('manageUsers')" class="hidden w-full text-right p-3 hover:bg-slate-800 rounded-xl flex items-center gap-3 transition"><i class="fas fa-user-shield text-cyan-400"></i> إدارة الحسابات</button>
                    <button onclick="openTab('supportMsgs')" class="w-full text-right p-3 hover:bg-slate-800 rounded-xl flex items-center gap-3 transition"><i class="fas fa-headset text-cyan-400"></i> رسائل الدعم</button>
                </div>

                <div id="visitorPanel" class="glass p-6 rounded-[2.5rem] border-r-4 border-emerald-500">
                    <button onclick="openTab('contactSupport')" class="w-full text-right p-3 bg-emerald-500/10 hover:bg-emerald-500/20 rounded-xl flex items-center gap-3 text-emerald-400 font-bold transition">
                        <i class="fas fa-comment-dots"></i> تواصل مع الدعم الفني
                    </button>
                </div>
            </div>

            <div class="lg:col-span-3">
                <div id="postsFeed" class="grid grid-cols-1 gap-10"></div>
            </div>
        </div>
    </div>

    <div id="mainModal" class="hidden fixed inset-0 z-[2000] bg-black/90 flex items-center justify-center p-4">
        <div class="glass w-full max-w-3xl p-8 rounded-[3rem] relative max-h-[90vh] overflow-y-auto border border-white/10">
            <button onclick="closeModal()" class="absolute top-6 left-6 text-2xl hover:text-red-500"><i class="fas fa-times-circle"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com";
        let me = null;

        async function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } 
            catch(err) { Swal.fire('خطأ في الدخول', 'تأكد من تفعيل Email/Password في Firebase ومن صحة البيانات', 'error'); }
        }

        async function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const res = await auth.signInWithPopup(provider);
                const user = res.user;
                const snap = await db.ref('users/' + user.uid).once('value');
                if(!snap.exists()) {
                    await db.ref('users/' + user.uid).set({ uid: user.uid, email: user.email, name: user.displayName, role: user.email === MASTER_ADMIN ? 'admin' : 'visitor', pass: 'Google' });
                }
            } catch(e) { console.error(e); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('authScreen').classList.add('hidden');
                        document.getElementById('mainApp').classList.remove('hidden');
                        document.getElementById('navRole').innerText = me.role;
                        
                        const isStaff = me.role === 'admin' || me.role === 'worker' || me.email === MASTER_ADMIN;
                        const isAdmin = me.role === 'admin' || me.email === MASTER_ADMIN;
                        
                        document.getElementById('staffPanel').classList.toggle('hidden', !isStaff);
                        document.getElementById('adminOnlyBtn').classList.toggle('hidden', !isAdmin);
                        loadPosts();
                    }
                });
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        function openTab(type) {
            const modal = document.getElementById('mainModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            content.innerHTML = '';

            if(type === 'addPost') {
                content.innerHTML = `
                    <h2 class="text-2xl font-black mb-6 text-cyan-400">📝 نشر منشور جديد</h2>
                    <div class="space-y-4 text-right">
                        <input id="postTitle" type="text" placeholder="عنوان المقال">
                        <input id="postImg" type="url" placeholder="رابط الصورة">
                        <textarea id="postDesc" rows="8" placeholder="اكتب محتوى المقال (يمكنك الكتابة هنا بالتفصيل وبشكل طويل)..."></textarea>
                        <button onclick="submitPost()" class="w-full btn-cyan py-4 rounded-xl font-bold">نشر المقال الآن</button>
                    </div>`;
            } 
            else if(type === 'contactSupport') {
                content.innerHTML = `
                    <h2 class="text-2xl font-black mb-4 text-emerald-400 italic">💬 تواصل مع الدعم الفني</h2>
                    <div class="space-y-4 text-right">
                        <textarea id="supportMsg" rows="5" placeholder="اكتب مشكلتك أو استفسارك هنا..."></textarea>
                        <button onclick="sendSupportMsg()" class="w-full bg-emerald-600 py-4 rounded-xl font-bold">إرسال الرسالة</button>
                    </div>`;
            }
            else if(type === 'manageUsers') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6">👥 إدارة المستخدمين (للمدير فقط)</h2><div id="uList" class="space-y-3"></div>`;
                db.ref('users').on('value', snap => {
                    const list = document.getElementById('uList');
                    list.innerHTML = '';
                    snap.forEach(u => {
                        const user = u.val();
                        list.innerHTML += `<div class="p-4 bg-slate-900 rounded-2xl border border-slate-800 flex justify-between items-center">
                            <div class="text-right">
                                <p class="font-bold text-white">${user.name} <span class="text-[10px] text-cyan-400 bg-cyan-900/30 px-2 py-0.5 rounded">${user.role}</span></p>
                                <p class="text-xs text-slate-500">${user.email} | <span class="text-red-400">P: ${user.pass}</span></p>
                            </div>
                            ${user.email !== MASTER_ADMIN ? `<button onclick="deleteUser('${u.key}')" class="text-red-500"><i class="fas fa-trash"></i></button>` : ''}
                        </div>`;
                    });
                });
            }
            else if(type === 'supportMsgs') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6 text-cyan-400">📩 الرسائل الواردة</h2><div id="mList" class="space-y-3"></div>`;
                db.ref('support').on('value', snap => {
                    const list = document.getElementById('mList'); list.innerHTML = '';
                    snap.forEach(m => {
                        const msg = m.val();
                        list.innerHTML += `<div class="p-4 bg-slate-900 rounded-2xl border border-slate-700">
                            <div class="flex justify-between items-center mb-2 text-xs">
                                <span class="text-cyan-400 font-bold">${msg.senderName}</span>
                                <span class="text-slate-500">${new Date(msg.time).toLocaleString('ar-EG')}</span>
                            </div>
                            <p class="text-slate-200 text-sm">${msg.text}</p>
                        </div>`;
                    });
                });
            }
        }

        async function submitPost() {
            const title = document.getElementById('postTitle').value;
            const img = document.getElementById('postImg').value;
            const desc = document.getElementById('postDesc').value;
            if(!title || !img || !desc) return Swal.fire('نقص بيانات', 'املأ كل الحقول', 'warning');
            await db.ref('posts').push({ title, img, desc, author: me.name, time: Date.now() });
            Swal.fire('تم النشر', 'المقال متاح الآن للجميع', 'success'); closeModal();
        }

        async function sendSupportMsg() {
            const text = document.getElementById('supportMsg').value;
            if(!text) return;
            await db.ref('support').push({ text, senderName: me.name, senderEmail: me.email, time: Date.now() });
            Swal.fire('تم الإرسال', 'سيقوم الدعم بالرد عليك قريباً', 'success'); closeModal();
        }

        function loadPosts() {
            db.ref('posts').orderByChild('time').on('value', snap => {
                const feed = document.getElementById('postsFeed'); feed.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    feed.insertAdjacentHTML('afterbegin', `
                        <div class="glass overflow-hidden cyber-card animate__animated animate__fadeInUp">
                            <div class="grid grid-cols-1 lg:grid-cols-3">
                                <img src="${post.img}" class="w-full h-full min-h-[250px] object-cover">
                                <div class="lg:col-span-2 p-8 text-right flex flex-col justify-between">
                                    <div>
                                        <div class="flex justify-between items-start mb-6">
                                            <span class="text-[10px] bg-cyan-500 text-black px-3 py-1 rounded font-black">TECH NEWS</span>
                                            ${(me.role === 'admin' || me.email === MASTER_ADMIN) ? `<button onclick="deletePost('${p.key}')" class="text-red-500"><i class="fas fa-trash-alt"></i></button>` : ''}
                                        </div>
                                        <h3 class="text-3xl font-black text-white mb-6 leading-tight">${post.title}</h3>
                                        <div class="long-text text-slate-400 text-lg mb-6">${post.desc}</div>
                                    </div>
                                    <div class="flex justify-between items-center border-t border-white/5 pt-6 text-[10px] text-slate-500">
                                        <span>نُشر بواسطة: ${post.author}</span>
                                        <span>${new Date(post.time).toLocaleDateString('ar-EG')}</span>
                                    </div>
                                </div>
                            </div>
                        </div>`);
                });
            });
        }

        async function deletePost(id) {
            const res = await Swal.fire({ title: 'حذف المنشور؟', icon: 'warning', showCancelButton: true });
            if(res.isConfirmed) db.ref('posts/'+id).remove();
        }

        async function deleteUser(id) {
            const res = await Swal.fire({ title: 'حذف المستخدم؟', icon: 'warning', showCancelButton: true });
            if(res.isConfirmed) db.ref('users/'+id).remove();
        }

        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }
        function logout() { auth.signOut().then(() => location.reload()); }
    </script>
</body>
</html>
