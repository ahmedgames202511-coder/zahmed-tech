<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصة المركزية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .cyber-card { border-radius: 2rem; border: 1px solid rgba(6, 182, 212, 0.1); transition: 0.3s; }
        .cyber-card:hover { border-color: #06b6d4; box-shadow: 0 10px 30px rgba(6, 182, 212, 0.2); }
        .btn-cyan { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; transition: 0.3s; }
        input, textarea { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; width: 100%; padding: 1rem; border-radius: 1rem; outline: none; }
        .long-text { white-space: pre-wrap; line-height: 1.8; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950 p-4">
        <div class="glass p-8 w-full max-w-md rounded-[2.5rem] text-center border border-cyan-500/20">
            <h1 class="text-3xl font-black mb-6">Z AHMED <span class="text-cyan-400">TECH</span></h1>
            <div class="space-y-4">
                <input id="email" type="email" placeholder="البريد الإلكتروني">
                <input id="pass" type="password" placeholder="كلمة المرور">
                <button onclick="login()" class="w-full btn-cyan py-4 rounded-xl font-bold shadow-lg">دخول</button>
                <button onclick="googleSignIn()" class="w-full bg-white text-black py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-100 transition">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20"> Google Login
                </button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="text-xl font-black">Z AHMED <span class="text-cyan-400">TECH</span></div>
            <div class="flex items-center gap-4">
                <span id="navRole" class="text-[10px] bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full font-bold uppercase"></span>
                <button onclick="logout()" class="text-red-500"><i class="fas fa-power-off"></i></button>
            </div>
        </nav>

        <div class="container mx-auto p-4 lg:p-10 grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="space-y-4">
                <div id="adminPanel" class="hidden glass p-6 rounded-[2rem] border-r-4 border-cyan-500 space-y-2">
                    <p class="text-xs text-slate-500 font-bold mb-4">إدارة المنصة</p>
                    <button onclick="openTab('addPost')" class="w-full text-right p-3 hover:bg-slate-800 rounded-xl flex items-center gap-2"><i class="fas fa-pen text-cyan-400"></i> نشر مقال</button>
                    <button onclick="openTab('manageUsers')" class="w-full text-right p-3 hover:bg-slate-800 rounded-xl flex items-center gap-2"><i class="fas fa-users text-cyan-400"></i> إدارة الحسابات</button>
                    <button onclick="openTab('supportMsgs')" class="w-full text-right p-3 hover:bg-slate-800 rounded-xl flex items-center gap-2"><i class="fas fa-envelope text-cyan-400"></i> رسائل الدعم</button>
                </div>

                <div id="visitorPanel" class="glass p-6 rounded-[2rem] border-r-4 border-green-500">
                    <p class="text-xs text-slate-500 font-bold mb-4">تواصل معنا</p>
                    <button onclick="openTab('contactSupport')" class="w-full text-right p-3 hover:bg-green-500/10 rounded-xl flex items-center gap-2 text-green-400">
                        <i class="fas fa-headset"></i> التواصل مع الدعم
                    </button>
                </div>
            </div>

            <div class="lg:col-span-3">
                <div id="postsFeed" class="grid grid-cols-1 gap-8"></div>
            </div>
        </div>
    </div>

    <div id="mainModal" class="hidden fixed inset-0 z-[2000] bg-black/95 flex items-center justify-center p-4">
        <div class="glass w-full max-w-3xl p-8 rounded-[2.5rem] relative max-h-[90vh] overflow-y-auto shadow-2xl border border-white/10">
            <button onclick="closeModal()" class="absolute top-6 left-6 text-2xl hover:text-red-500"><i class="fas fa-times-circle"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com";
        let me = null;

        async function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } catch(e) { Swal.fire('خطأ', 'البيانات غير صحيحة', 'error'); }
        }

        async function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const res = await auth.signInWithPopup(provider);
                const user = res.user;
                const snap = await db.ref('users/' + user.uid).once('value');
                if(!snap.exists()) {
                    await db.ref('users/' + user.uid).set({ uid: user.uid, email: user.email, name: user.displayName, role: user.email === MASTER_ADMIN ? 'admin' : 'visitor', pass: 'Google' });
                }
            } catch(e) { console.error(e); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('authScreen').classList.add('hidden');
                        document.getElementById('mainApp').classList.remove('hidden');
                        document.getElementById('navRole').innerText = me.role;
                        // التحكم في ظهور اللوحات (المدير فقط يرى إدارة الحسابات والرسائل)
                        const isAdmin = me.email === MASTER_ADMIN || me.role === 'admin';
                        document.getElementById('adminPanel').classList.toggle('hidden', !isAdmin);
                        loadPosts();
                    }
                });
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        function openTab(type) {
            const modal = document.getElementById('mainModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            content.innerHTML = '';

            if(type === 'addPost') {
                content.innerHTML = `
                    <h2 class="text-2xl font-black mb-6 text-cyan-400">📝 نشر منشور جديد</h2>
                    <div class="space-y-4 text-right">
                        <input id="postTitle" type="text" placeholder="عنوان المقال">
                        <input id="postImg" type="url" placeholder="رابط الصورة">
                        <textarea id="postDesc" rows="8" placeholder="اكتب محتوى المقال..."></textarea>
                        <button onclick="submitPost()" class="w-full btn-cyan py-4 rounded-xl font-bold">نشر الآن</button>
                    </div>`;
            } 
            else if(type === 'contactSupport') {
                content.innerHTML = `
                    <h2 class="text-2xl font-black mb-4 text-green-400">💬 تواصل مع الدعم الفني</h2>
                    <p class="text-slate-400 mb-6 text-sm">رسالتك ستصل مباشرة لإدارة المنصة وسنقوم بالرد عليك.</p>
                    <div class="space-y-4 text-right">
                        <textarea id="supportMsg" rows="5" placeholder="كيف يمكننا مساعدتك؟"></textarea>
                        <button onclick="sendSupportMsg()" class="w-full bg-green-600 py-4 rounded-xl font-bold">إرسال الرسالة</button>
                    </div>`;
            }
            else if(type === 'manageUsers') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6">👥 إدارة الحسابات (خاص بالمدير)</h2><div id="uList" class="space-y-3"></div>`;
                db.ref('users').on('value', snap => {
                    const list = document.getElementById('uList');
                    list.innerHTML = '';
                    snap.forEach(u => {
                        const user = u.val();
                        if(user.email === MASTER_ADMIN) return;
                        list.innerHTML += `<div class="p-4 bg-slate-900 rounded-2xl border border-slate-800 flex justify-between items-center">
                            <div class="text-right"><p class="font-bold">${user.name}</p><p class="text-xs text-slate-500">${user.email} | Pass: <span class="text-red-400">${user.pass}</span></p></div>
                            <button onclick="deleteUser('${u.key}')" class="text-red-500"><i class="fas fa-trash"></i></button>
                        </div>`;
                    });
                });
            }
            else if(type === 'supportMsgs') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6">📩 رسائل الزوار الواردة</h2><div id="mList" class="space-y-3"></div>`;
                db.ref('support').on('value', snap => {
                    const list = document.getElementById('mList');
                    list.innerHTML = '';
                    snap.forEach(m => {
                        const msg = m.val();
                        list.innerHTML += `<div class="p-4 bg-slate-900 rounded-2xl border border-slate-700">
                            <p class="text-cyan-400 font-bold text-sm mb-1">${msg.senderName} (${msg.senderEmail}):</p>
                            <p class="text-white">${msg.text}</p>
                            <p class="text-[10px] text-slate-500 mt-2">${new Date(msg.time).toLocaleString('ar-EG')}</p>
                        </div>`;
                    });
                });
            }
        }

        async function submitPost() {
            const title = document.getElementById('postTitle').value;
            const img = document.getElementById('postImg').value;
            const desc = document.getElementById('postDesc').value;
            if(!title || !img || !desc) return;
            await db.ref('posts').push({ title, img, desc, author: me.name, time: Date.now() });
            Swal.fire('تم النشر', '', 'success'); closeModal();
        }

        async function sendSupportMsg() {
            const text = document.getElementById('supportMsg').value;
            if(!text) return;
            await db.ref('support').push({ text, senderName: me.name, senderEmail: me.email, time: Date.now() });
            Swal.fire('تم الإرسال', 'سنرد عليك في أقرب وقت', 'success'); closeModal();
        }

        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const feed = document.getElementById('postsFeed');
                feed.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    feed.innerHTML += `
                        <div class="glass overflow-hidden cyber-card animate__animated animate__fadeIn">
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                                <img src="${post.img}" class="w-full h-64 object-cover">
                                <div class="lg:col-span-2 p-6 text-right flex flex-col justify-between">
                                    <div>
                                        <div class="flex justify-between mb-4">
                                            <span class="text-[10px] bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full">NEWS</span>
                                            ${(me.role === 'admin' || me.email === MASTER_ADMIN) ? `<button onclick="deletePost('${p.key}')" class="text-red-500"><i class="fas fa-trash"></i></button>` : ''}
                                        </div>
                                        <h3 class="text-2xl font-black text-cyan-400 mb-4">${post.title}</h3>
                                        <div class="long-text text-slate-300 text-sm mb-4">${post.desc}</div>
                                    </div>
                                    <p class="text-[10px] text-slate-500 border-t border-white/5 pt-4 italic">بواسطة: ${post.author}</p>
                                </div>
                            </div>
                        </div>`;
                });
            });
        }

        async function deletePost(id) { await db.ref('posts/'+id).remove(); }
        async function deleteUser(id) { await db.ref('users/'+id).remove(); }
        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }
        function logout() { auth.signOut().then(() => location.reload()); }
    </script>
</body>
</html>
