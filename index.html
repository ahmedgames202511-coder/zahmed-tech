        :root {
            --primary: #06b6d4;
            --accent: #3b82f6;
            --bg-dark: #020617;
            --card-bg: rgba(15, 23, 42, 0.95);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: #f1f5f9;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Glassmorphism Design */
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 50px -10px rgba(0, 0, 0, 0.5);
        }

        .btn-cyber {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white;
            font-weight: 800;
            border: none;
        }

        .btn-cyber:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.4);
        }

        /* Forms Styling */
        input, textarea, select {
            background: #0f172a !important;
            border: 1px solid #1e293b !important;
            color: white !important;
            border-radius: 16px !important;
            padding: 15px !important;
            width: 100%;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary) !important; box-shadow: 0 0 15px rgba(6, 182, 212, 0.1); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* Components */
        .post-card {
            border-radius: 30px;
            overflow: hidden;
            background: #0f172a;
            border: 1px solid #1e293b;
            transition: 0.4s;
        }
        .post-card:hover { transform: translateY(-10px); border-color: var(--primary); }

        .admin-badge {
            background: linear-gradient(90deg, #f59e0b, #ef4444);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 900;
        }

        #adminPanel { display: none; }
        body.is-admin #adminPanel { display: block; }
        .admin-only { display: none; }
        body.is-admin .admin-only { display: block; }

        .loader-svg { transition: stroke-dashoffset 1s linear; }
        
        /* Sidebar Socials */
        .social-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            border-radius: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            transition: 0.3s;
        }
    </style>

        const firebaseConfig = {

        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();
        const MASTER_ADMIN_EMAIL = "ahmedgames2025.11@gmail.com";

        let currentMe = null;
        let globalWait = 5;
        let tempBase64 = "";

        // ================= 4. نظام تسجيل الدخول المطور =================
        async function handleEmailAuth() {
            const e = document.getElementById('authEmail').value, p = document.getElementById('authPass').value;
            if(!e || !p) return Swal.fire('تنبيه', 'يرجى إكمال البيانات', 'warning');
            try { await auth.signInWithEmailAndPassword(e, p); } catch(err) { Swal.fire('خطأ', 'البيانات غير صحيحة', 'error'); }
        }

        async function handleGoogleAuth() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            try {
                await auth.signInWithPopup(provider);
            } catch (err) {
                if(err.code === 'auth/popup-blocked') {
                    Swal.fire('حظر النافذة', 'يرجى السماح بالـ Popups في متصفحك ليعمل تسجيل جوجل', 'warning');
                } else {
                    Swal.fire('خطأ', err.message, 'error');
                }
            }
        }

        function signOutUser() { auth.signOut().then(() => location.reload()); }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    currentMe = snap.val();
                    if(!currentMe) {
                        const role = (user.email === MASTER_ADMIN_EMAIL) ? 'admin' : 'visitor';
                        db.ref('users/' + user.uid).set({ 
                            uid: user.uid, 
                            email: user.email, 
                            name: user.displayName || 'Tech User', 
                            role: role,
                            joined: Date.now()
                        });
                        return;
                    }
                    
                    // التحكم في ظهور لوحة الأدمن
                    if(currentMe.role === 'admin') document.body.classList.add('is-admin');
                    else document.body.classList.remove('is-admin');
                    
                    document.getElementById('authLayout').classList.add('hidden');
                    document.getElementById('mainLayout').classList.remove('hidden');
                    document.getElementById('profileName').innerText = currentMe.name;
                    document.getElementById('profileRole').innerText = currentMe.role;
                    
                    // جلب الإعدادات العامة
                    db.ref('settings/waitTime').on('value', s => { 
                        globalWait = s.val() || 5; 
                        if(document.getElementById('globalWaitInput')) document.getElementById('globalWaitInput').value = globalWait;
                    });
                    
                    loadNewsFeed();
                });
            } else {
                document.getElementById('authLayout').classList.remove('hidden');
                document.getElementById('mainLayout').classList.add('hidden');
            }
        });

        // ================= 5. إدارة المحتوى (النشر والرفع) =================
        function loadNewsFeed() {
            db.ref('posts').on('value', snap => {
                const grid = document.getElementById('feedGrid');
                grid.innerHTML = '';
                let posts = []; snap.forEach(p => { posts.unshift({id: p.key, ...p.val()}) });
                posts.forEach(p => {
                    grid.innerHTML += `
                        <div class="post-card animate__animated animate__fadeInUp group cursor-pointer" onclick="openFullPost('${p.id}')">
                            <div class="relative h-72 overflow-hidden">
                                <img src="${p.img}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 to-transparent opacity-80"></div>
                                <div class="absolute top-4 right-4 bg-cyan-500 text-white text-[10px] font-black px-3 py-1 rounded-full uppercase">Update</div>
                            </div>
                            <div class="p-8 text-right">
                                <h3 class="text-2xl font-bold mb-4 group-hover:text-cyan-400 transition">${p.title}</h3>
                                <div class="flex justify-between items-center">
                                    <span class="text-[10px] text-slate-500 font-bold tracking-widest uppercase italic">${new Date(p.time).toLocaleDateString()}</span>
                                    <div class="admin-only flex gap-2">
                                        <button onclick="event.stopPropagation(); deleteArticle('${p.id}')" class="w-8 h-8 rounded-full bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition flex items-center justify-center">
                                            <i class="fas fa-trash-alt text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                });
            });
        }

        async function openFullPost(id) {
            const snap = await db.ref('posts/'+id).once('value');
            const post = snap.val();
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            window.scrollTo(0,0);

            // ميزة تخطي العداد للأدمن
            if(currentMe.role === 'admin') { 
                showFinalContent(post); 
                return; 
            }

            document.getElementById('waitingScreen').classList.remove('hidden');
            document.getElementById('fullContent').classList.add('hidden');
            
            let count = globalWait;
            document.getElementById('timerText').innerText = count;
            const ring = document.getElementById('timerRing');
            
            const timer = setInterval(() => {
                count--;
                document.getElementById('timerText').innerText = count;
                ring.style.strokeDashoffset = 502.4 - (502.4 * (globalWait - count) / globalWait);
                if(count <= 0) { 
                    clearInterval(timer); 
                    showFinalContent(post); 
                }
            }, 1000);
        }

        function showFinalContent(post) {
            document.getElementById('waitingScreen').classList.add('hidden');
            document.getElementById('fullContent').classList.r
