<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | Pro Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; transition: 0.4s; overflow-x: hidden; }
        .dark-mode { background: #020617; color: #f1f5f9; }
        .light-mode { background: #f8fafc; color: #0f172a; }
        .glass { backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; }
        .dark-mode .glass { background: rgba(15, 23, 42, 0.8); }
        .light-mode .glass { background: rgba(255, 255, 255, 0.9); border-color: #e2e8f0; }
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: block !important; }
        .chat-msg { margin-bottom: 10px; padding: 12px 16px; border-radius: 18px; max-width: 85%; position: relative; font-size: 0.95rem; }
        .msg-me { background: #2563eb; color: white; margin-left: auto; border-bottom-left-radius: 4px; }
        .msg-other { background: #334155; color: white; margin-right: auto; border-bottom-right-radius: 4px; }
        .tab-active { color: #3b82f6; border-bottom: 3px solid #3b82f6; }
        
        /* ستايل مخصص لمعاينة الصورة */
        #imgPreview { width: 100%; height: 150px; border: 2px dashed #334155; border-radius: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-top: 10px; cursor: pointer; }
        #imgPreview img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="dark-mode">

    <div id="authLayout" class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-950">
        <div class="glass p-10 w-full max-w-md text-center animate__animated animate__zoomIn">
            <h1 class="text-3xl font-black mb-2 text-white">Z Ahmed Tech</h1>
            <div class="space-y-4 mt-8">
                <input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-700 outline-none text-white">
                <input id="pass" type="password" placeholder="كلمة المرور" class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-700 outline-none text-white">
                <button onclick="loginEmail()" class="w-full bg-blue-600 py-4 rounded-2xl font-bold hover:bg-blue-700 transition">دخول</button>
                <button onclick="loginGoogle()" class="w-full bg-white text-black py-4 rounded-2xl font-bold flex items-center justify-center gap-3">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="22"> جوجل
                </button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden min-h-screen pb-20">
        <nav class="glass sticky top-4 mx-4 z-[1000] px-6 py-4 flex justify-between items-center shadow-2xl">
            <div class="flex items-center gap-6">
                <span class="text-xl font-black text-blue-500">Z Ahmed Tech</span>
                <div class="hidden md:flex gap-6 text-sm font-bold">
                    <span onclick="showPage('home')" class="nav-link cursor-pointer hover:text-blue-500 transition">الرئيسية</span>
                    <span onclick="showPage('chat')" class="nav-link cursor-pointer hover:text-blue-500 transition">المحادثات</span>
                    <span onclick="showPage('admin')" class="nav-link cursor-pointer hover:text-blue-500 transition admin-only">لوحة الأدمن</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleTheme()" class="p-2"><i class="fas fa-adjust"></i></button>
                <button onclick="logout()" class="text-red-500 p-2"><i class="fas fa-power-off"></i></button>
            </div>
        </nav>

        <div id="pageHome" class="container mx-auto px-6 py-10">
            <div class="flex justify-center gap-8 mb-10 border-b border-white/10">
                <button onclick="toggleHomeSection('posts')" id="btnPosts" class="pb-4 font-bold tab-active">قسم المنشورات</button>
                <button onclick="toggleHomeSection('contests')" id="btnContests" class="pb-4 font-bold opacity-50">قسم المسابقات</button>
            </div>
            <div id="postsSection">
                <h2 class="text-xl font-black mb-6 border-r-4 border-blue-500 pr-4">أحدث الملفات</h2>
                <div id="postsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>
            </div>
            <div id="contestsSection" class="hidden">
                <h2 class="text-xl font-black mb-6 border-r-4 border-yellow-500 pr-4">اشترك الآن في المسابقات</h2>
                <div id="contestsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>
            </div>
        </div>

        <div id="pageChat" class="hidden container mx-auto px-6 py-10">
            <div class="max-w-3xl mx-auto glass h-[75vh] flex flex-col overflow-hidden">
                <div class="admin-only p-4 border-b border-white/10 bg-white/5">
                    <select id="chatRecipient" onchange="loadChat()" class="w-full bg-slate-900 p-3 rounded-xl border border-slate-700 outline-none text-white">
                        <option value="global">المحادثة العامة</option>
                    </select>
                </div>
                <div id="chatContent" class="flex-grow overflow-y-auto p-6 space-y-4"></div>
                <div class="p-4 bg-white/5 flex gap-3">
                    <input id="chatInput" placeholder="اكتب رسالتك..." class="flex-grow p-4 rounded-2xl bg-slate-900 border border-slate-700 outline-none text-white">
                    <button onclick="sendMsg()" class="bg-blue-600 px-8 rounded-2xl hover:bg-blue-700 transition shadow-lg"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <div id="pageAdmin" class="hidden container mx-auto px-6 py-10">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="glass p-6 border-l-4 border-blue-500">
                    <p class="text-xs font-bold opacity-50">إجمالي المستخدمين</p>
                    <h3 id="userTotalCount" class="text-3xl font-black">0</h3>
                </div>
                <div class="glass p-6 md:col-span-2">
                    <button onclick="openPostModal()" class="w-full h-full bg-blue-600 rounded-2xl font-black text-white py-4 shadow-xl hover:bg-blue-700 transition">إضافة عمل جديد (منشور/مسابقة)</button>
                </div>
            </div>
        </div>

        <div id="pageDl" class="hidden fixed inset-0 z-[500] bg-slate-950 p-6 overflow-y-auto">
            <div class="max-w-xl mx-auto mt-10 glass p-8 animate__animated animate__zoomIn text-center">
                <img id="dlImg" class="w-48 h-48 mx-auto rounded-3xl shadow-2xl mb-6 object-cover border-4 border-blue-500/20">
                <h2 id="dlTitle" class="text-2xl font-black mb-4 text-white"></h2>
                <div id="dlDesc" class="bg-black/20 p-6 rounded-2xl mb-6 text-sm leading-relaxed text-slate-300"></div>
                <div id="normalPostSection" class="hidden">
                    <div id="dlTimer" class="mb-6">
                        <div class="text-6xl font-black text-blue-500" id="dlNum">10</div>
                    </div>
                    <div id="dlFinal"></div>
                </div>
                <button onclick="showPage('home')" class="mt-8 text-white/50 hover:text-white transition">← إلغاء والعودة</button>
            </div>
        </div>
    </div>

    <div id="postModal" class="hidden fixed inset-0 z-[2000] bg-black/95 flex items-center justify-center p-4">
        <div class="glass bg-slate-900 w-full max-w-lg p-8 space-y-4 overflow-y-auto max-h-[90vh]">
            <h2 class="text-xl font-bold text-white text-center">إضافة محتوى جديد في Z Ahmed Tech</h2>
            
            <select id="postType" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white outline-none">
                <option value="normal">منشور عادي (تحميل)</option>
                <option value="contest">مسابقة (اشتراك)</option>
            </select>

            <input id="postTitle" placeholder="العنوان" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white outline-none">
            
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <label class="block text-xs font-bold mb-2 opacity-70 text-white">اختر صورة الغلاف من جهازك:</label>
                <input type="file" id="imageFile" accept="image/*" class="hidden" onchange="previewImage(this)">
                <div id="imgPreview" onclick="document.getElementById('imageFile').click()">
                    <span class="text-slate-400 text-sm">اضغط هنا لرفع صورة</span>
                </div>
            </div>

            <textarea id="postDesc" placeholder="تفاصيل المحتوى..." class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 h-24 text-white outline-none"></textarea>
            <input id="postLink" placeholder="رابط التحميل المباشر" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white outline-none">
            
            <div class="flex gap-4 pt-4">
                <button onclick="savePost()" class="flex-grow bg-blue-600 py-4 rounded-xl font-bold text-white shadow-lg hover:bg-blue-700">نشر الآن</button>
                <button onclick="document.getElementById('postModal').classList.add('hidden')" class="px-8 bg-white/10 rounded-xl text-white">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        const ADMIN_EMAIL = "ahmedgames2025.11@gmail.com";
        let me = null, activePostId = null, uploadedImageBase64 = "";

        // معاينة الصورة فور اختيارها وتحويلها لـ Base64
        function previewImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result;
                    document.getElementById('imgPreview').innerHTML = `<img src="${uploadedImageBase64}" class="w-full h-full object-cover">`;
                }
                reader.readAsDataURL(file);
            }
        }

        // حفظ المنشور مع الصورة
        function savePost() {
            const title = document.getElementById('postTitle').value;
            const desc = document.getElementById('postDesc').value;
            const type = document.getElementById('postType').value;
            const link = document.getElementById('postLink').value;

            if(!title || !uploadedImageBase64) {
                return Swal.fire('تنبيه', 'يجب إدخال العنوان ورفع صورة!', 'warning');
            }

            const data = {
                type: type,
                title: title,
                img: uploadedImageBase64, // الصورة المخزنة كـ كود
                desc: desc,
                link: link,
                time: Date.now()
            };

            db.ref('posts').push(data).then(() => {
                document.getElementById('postModal').classList.add('hidden');
                // مسح البيانات للعملية القادمة
                document.getElementById('postTitle').value = "";
                document.getElementById('postDesc').value = "";
                document.getElementById('imgPreview').innerHTML = '<span class="text-slate-400 text-sm">اضغط هنا لرفع صورة</span>';
                uploadedImageBase64 = "";
                Swal.fire('تم بنجاح', 'تم إضافة المنشور في Z Ahmed Tech', 'success');
            });
        }

        // --- Auth & Original Functions --- (Keeping your core logic)
        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref(`users/${user.uid}`).on('value', snap => {
                    me = snap.val();
                    if(!me) {
                        me = { name: user.displayName || 'مستخدم جديد', email: user.email, uid: user.uid, role: (user.email === ADMIN_EMAIL ? 'admin' : 'visitor') };
                        db.ref(`users/${user.uid}`).set(me);
                    }
                    if(me.role === 'admin') document.body.classList.add('is-admin');
                    document.getElementById('authLayout').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    loadPosts();
                });
            }
        });

        function loginEmail() { 
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            auth.signInWithEmailAndPassword(e, p).catch(() => Swal.fire('خطأ', 'البيانات غير صحيحة', 'error'));
        }
        function loginGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function logout() { auth.signOut().then(() => location.reload()); }
        function showPage(p) {
            ['pageHome', 'pageAdmin', 'pageDl', 'pageChat'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('page' + p.charAt(0).toUpperCase() + p.slice(1)).classList.remove('hidden');
        }
        function toggleHomeSection(type) {
            document.getElementById('postsSection').classList.toggle('hidden', type !== 'posts');
            document.getElementById('contestsSection').classList.toggle('hidden', type === 'posts');
            document.getElementById('btnPosts').classList.toggle('tab-active', type === 'posts');
            document.getElementById('btnContests').classList.toggle('tab-active', type !== 'posts');
        }

        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const pGrid = document.getElementById('postsGrid'), cGrid = document.getElementById('contestsGrid');
                pGrid.innerHTML = ''; cGrid.innerHTML = '';
                snap.forEach(child => {
                    const p = child.val();
                    const card = `
                        <div class="glass p-3 text-center cursor-pointer hover:scale-105 transition-all" onclick="openDetail('${child.key}')">
                            <img src="${p.img}" class="w-full aspect-square object-cover rounded-xl mb-3 shadow-md">
                            <h3 class="text-xs font-bold truncate mb-2 text-white">${p.title}</h3>
                            ${me.role === 'admin' ? `<button onclick="event.stopPropagation(); deletePost('${child.key}')" class="text-red-500 text-[10px] underline">حذف</button>` : ''}
                        </div>`;
                    p.type === 'contest' ? cGrid.innerHTML += card : pGrid.innerHTML += card;
                });
            });
        }

        async function openDetail(id) {
            activePostId = id;
            const post = (await db.ref('posts/'+id).once('value')).val();
            showPage('dl');
            document.getElementById('dlImg').src = post.img;
            document.getElementById('dlTitle').innerText = post.title;
            document.getElementById('dlDesc').innerText = post.desc;
            if(post.type !== 'contest') {
                document.getElementById('normalPostSection').classList.remove('hidden');
                let timer = 10;
                const itv = setInterval(() => {
                    timer--;
                    document.getElementById('dlNum').innerText = timer;
                    if(timer <= 0) {
                        clearInterval(itv);
                        document.getElementById('dlFinal').innerHTML = `<a href="${post.link}" target="_blank" class="block bg-blue-600 py-4 rounded-2xl font-black text-white animate__animated animate__pulse animate__infinite">إضغط للتحميل المباشر</a>`;
                    }
                }, 1000);
            }
        }

        function deletePost(id) { Swal.fire({title: 'حذف؟', icon: 'warning', showCancelButton: true}).then(r => { if(r.isConfirmed) db.ref('posts/'+id).remove(); }); }
        function toggleTheme() { document.body.classList.toggle('dark-mode'); document.body.classList.toggle('light-mode'); }
        function openPostModal() { document.getElementById('postModal').classList.remove('hidden'); }
    </script>
</body>
</html>
