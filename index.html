<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصة المتكاملة</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .cyber-card { border-radius: 1.5rem; border: 1px solid rgba(6, 182, 212, 0.1); }
        .btn-primary { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; }
        input, textarea { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; }
        .chat-box { height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950 p-4">
        <div class="glass p-8 w-full max-w-md rounded-[2.5rem] text-center cyber-card animate__animated animate__fadeIn">
            <h1 class="text-3xl font-black mb-2">Z AHMED <span class="text-cyan-400">TECH</span></h1>
            <p class="text-xs text-slate-500 mb-6">المنصة الرسمية لإدارة المحتوى والدعم</p>
            <div class="space-y-4">
                <input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full p-4 rounded-xl outline-none">
                <input id="pass" type="password" placeholder="كلمة المرور" class="w-full p-4 rounded-xl outline-none">
                <button onclick="login()" class="w-full btn-primary py-4 rounded-xl font-bold">دخول للمنصة</button>
                <div class="flex gap-2">
                    <button onclick="googleSignIn()" class="flex-grow bg-white text-black py-2 rounded-lg font-bold text-xs">Google</button>
                    <button onclick="phoneSignIn()" class="flex-grow bg-emerald-600 text-white py-2 rounded-lg font-bold text-xs">Phone</button>
                </div>
            </div>
            <div id="recaptcha-container"></div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="text-xl font-black">Z AHMED <span class="text-cyan-400">TECH</span></div>
            <div class="flex items-center gap-4">
                <span id="navRole" class="text-[9px] font-bold bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full">USER</span>
                <button onclick="logout()" class="text-red-500"><i class="fas fa-power-off"></i></button>
            </div>
        </nav>

        <div class="container mx-auto p-4 lg:p-8 grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="space-y-4">
                <div id="adminMenu" class="hidden glass p-5 rounded-[1.5rem] border-r-4 border-cyan-500 space-y-2">
                    <p class="text-[10px] text-slate-500 font-bold mb-4">لوحة المدير</p>
                    <button onclick="openTab('addPost')" class="w-full text-right p-3 hover:bg-white/5 rounded-lg flex gap-3 items-center"><i class="fas fa-plus text-cyan-400"></i> نشر محتوى</button>
                    <button onclick="openTab('manageWorkers')" class="w-full text-right p-3 hover:bg-white/5 rounded-lg flex gap-3 items-center"><i class="fas fa-user-plus text-cyan-400"></i> إدارة العمال</button>
                    <button onclick="openTab('manageUsers')" class="w-full text-right p-3 hover:bg-white/5 rounded-lg flex gap-3 items-center"><i class="fas fa-users-cog text-cyan-400"></i> مراقبة الأعضاء</button>
                    <button onclick="openTab('monitorChats')" class="w-full text-right p-3 hover:bg-white/5 rounded-lg flex gap-3 items-center"><i class="fas fa-comments text-cyan-400"></i> مراقبة الدردشات</button>
                </div>

                <button id="supportBtn" onclick="openChat()" class="w-full btn-primary p-4 rounded-2xl font-bold flex items-center justify-center gap-3 shadow-lg shadow-cyan-500/10">
                    <i class="fas fa-headset"></i> التواصل مع الدعم
                </button>
            </div>

            <div class="lg:col-span-3">
                <h2 class="text-2xl font-black mb-6">الأخبار <span class="text-cyan-400">التقنية</span></h2>
                <div id="postsFeed" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </div>
        </div>
    </div>

    <div id="mainModal" class="hidden fixed inset-0 z-[2000] bg-black/90 flex items-center justify-center p-4">
        <div class="glass w-full max-w-3xl p-6 rounded-[2rem] relative animate__animated animate__fadeInUp">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-xl"><i class="fas fa-times"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();
        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com";
        let me = null;

        // AUTH FUNCTIONS
        async function login() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } catch { Swal.fire('خطأ', 'البيانات غير صحية', 'error'); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/'+user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('authScreen').classList.add('hidden');
                        document.getElementById('mainApp').classList.remove('hidden');
                        document.getElementById('navRole').innerText = me.role;
                        document.getElementById('adminMenu').classList.toggle('hidden', me.role !== 'admin');
                        document.getElementById('supportBtn').classList.toggle('hidden', me.role === 'admin');
                        loadPosts();
                    }
                });
            } else { document.getElementById('authScreen').classList.remove('hidden'); }
        });

        // TABS
        function openTab(type) {
            const modal = document.getElementById('mainModal'), content = document.getElementById('modalContent');
            modal.classList.remove('hidden'); content.innerHTML = '';

            if(type === 'monitorChats') {
                content.innerHTML = `<h2 class="text-xl font-bold mb-4 text-cyan-400">💬 مراقبة جميع الدردشات</h2><div id="chatsList" class="space-y-3 max-h-96 overflow-y-auto"></div>`;
                db.ref('chats').on('value', snap => {
                    const list = document.getElementById('chatsList'); list.innerHTML = '';
                    snap.forEach(chat => {
                        list.innerHTML += `<div onclick="openChat('${chat.key}')" class="p-4 bg-white/5 rounded-xl cursor-pointer hover:border-cyan-500 border border-transparent transition">محادثة مع المستخدم ID: ${chat.key}</div>`;
                    });
                });
            }
            else if(type === 'manageWorkers') {
                content.innerHTML = `<h2 class="text-xl font-bold mb-4">👔 إضافة موظف</h2>
                    <input id="wEmail" placeholder="Email" class="w-full p-3 rounded-lg mb-2"><input id="wPass" placeholder="Password" class="w-full p-3 rounded-lg mb-4">
                    <button onclick="createWorker()" class="w-full btn-primary py-3 rounded-lg">إنشاء حساب</button>`;
            }
            else if(type === 'manageUsers') {
                content.innerHTML = `<h2 class="text-xl font-bold mb-4">👥 مراقبة الأعضاء</h2><div id="uList" class="space-y-2 max-h-80 overflow-y-auto"></div>`;
                db.ref('users').on('value', snap => {
                    const ulist = document.getElementById('uList'); ulist.innerHTML = '';
                    snap.forEach(u => {
                        const user = u.val();
                        ulist.innerHTML += `<div class="flex justify-between p-3 bg-white/5 rounded-lg">
                            <div class="text-right text-xs"><p>${user.name} (${user.role})</p><p class="text-slate-500">${user.email}</p></div>
                            <button onclick="removeUser('${u.key}')" class="text-red-500"><i class="fas fa-trash"></i></button>
                        </div>`;
                    });
                });
            }
            else if(type === 'addPost') {
                content.innerHTML = `<h2 class="text-xl font-bold mb-4">📝 نشر خبر</h2>
                    <input id="pT" placeholder="العنوان" class="w-full p-3 mb-2"><input id="pI" placeholder="رابط الصورة" class="w-full p-3 mb-2">
                    <textarea id="pD" placeholder="الوصف" class="w-full p-3 mb-4"></textarea><button onclick="savePost()" class="w-full btn-primary py-3 rounded-lg">نشر</button>`;
            }
        }

        // CHAT SYSTEM
        function openChat(targetUID = null) {
            const uid = targetUID || auth.currentUser.uid;
            const modal = document.getElementById('mainModal'), content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            content.innerHTML = `
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fas fa-comments text-cyan-400"></i> الدردشة المباشرة</h2>
                <div id="chatBox" class="chat-box p-4 bg-slate-900/50 rounded-2xl mb-4 border border-white/5"></div>
                <div class="flex gap-2">
                    <input id="chatMsg" type="text" placeholder="اكتب رسالتك..." class="flex-grow p-4 rounded-xl outline-none">
                    <button onclick="sendMsg('${uid}')" class="btn-primary px-6 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                </div>`;
            
            db.ref('chats/'+uid).on('value', snap => {
                const box = document.getElementById('chatBox'); if(!box) return;
                box.innerHTML = '';
                snap.forEach(m => {
                    const msg = m.val();
                    const isMe = msg.sender === auth.currentUser.uid;
                    box.innerHTML += `<div class="${isMe ? 'mr-auto bg-cyan-600' : 'ml-auto bg-slate-800'} max-w-[80%] p-3 rounded-2xl text-xs">
                        <p class="font-bold mb-1 ${isMe ? 'hidden' : 'block'} text-[10px] text-cyan-400">${msg.name}</p>
                        ${msg.text}
                    </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function sendMsg(uid) {
            const txt = document.getElementById('chatMsg').value;
            if(!txt) return;
            db.ref('chats/'+uid).push({
                sender: auth.currentUser.uid,
                name: me.name,
                text: txt,
                time: Date.now()
            });
            document.getElementById('chatMsg').value = '';
        }

        // ACTIONS
        async function createWorker() {
            const e = document.getElementById('wEmail').value, p = document.getElementById('wPass').value;
            try {
                // لتبسيط العملية للأحمد: سنضيف المستخدم للداتابيز والمدير يدخل حسابه
                const newId = db.ref('users').push().key;
                await db.ref('users/'+newId).set({ uid: newId, email: e, name: 'موظف', role: 'worker', pass: p });
                Swal.fire('تم', 'تم تسجيل بيانات الموظف، يمكنه الدخول الآن', 'success'); closeModal();
            } catch { Swal.fire('خطأ', 'فشل في الإضافة', 'error'); }
        }

        async function savePost() {
            const t = document.getElementById('pT').value, i = document.getElementById('pI').value, d = document.getElementById('pD').value;
            await db.ref('posts').push({ title: t, img: i, desc: d, author: me.name, status: (me.role === 'admin' ? 'active' : 'pending') });
            closeModal();
        }

        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const feed = document.getElementById('postsFeed'); feed.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    if(post.status === 'active' || me.role === 'admin') {
                        feed.innerHTML += `<div class="glass rounded-2xl overflow-hidden cyber-card animate__animated animate__fadeIn">
                            <img src="${post.img}" class="w-full h-40 object-cover">
                            <div class="p-5 text-right">
                                <h3 class="font-bold mb-2">${post.title}</h3>
                                <p class="text-[10px] text-slate-400 mb-4 line-clamp-2">${post.desc}</p>
                                <div class="flex justify-between items-center border-t border-white/5 pt-3">
                                    <span class="text-[8px] text-slate-500 italic">BY: ${post.author}</span>
                                    ${me.role === 'admin' ? `<button onclick="deletePost('${p.key}')" class="text-red-500 text-xs"><i class="fas fa-trash"></i></button>` : ''}
                                </div>
                            </div>
                        </div>`;
                    }
                });
            });
        }

        function removeUser(id) { db.ref('users/'+id).remove(); }
        function deletePost(id) { db.ref('posts/'+id).remove(); }
        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }
        function logout() { auth.signOut().then(() => location.reload()); }
    </script>
</body>
</html>
