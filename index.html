<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | Ultimate Platform</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; transition: 0.3s; }
        
        /* Mode Colors */
        .light-mode { background: #f8fafc; color: #1e293b; }
        .dark-mode { background: #020617; color: #f1f5f9; }
        
        .light-mode .glass { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .dark-mode .glass { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.05); }

        .btn-main { background: #2563eb; color: white; border-radius: 12px; transition: 0.3s; }
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: flex !important; }
        
        .loader-bar { width: 100%; height: 6px; background: #cbd5e1; border-radius: 10px; overflow: hidden; margin: 15px 0; }
        .progress { width: 0%; height: 100%; background: #2563eb; transition: 1s linear; }
        
        [dir="ltr"] { text-align: left; }
        [dir="rtl"] { text-align: right; }
    </style>
</head>
<body class="dark-mode">

    <div id="authScreen" class="fixed inset-0 z-[5000] flex items-center justify-center bg-slate-950">
        <div class="glass p-10 w-full max-w-md rounded-[2.5rem] text-center">
            <h1 class="text-3xl font-black mb-8">Z Ahmed Tech</h1>
            <div class="space-y-4">
                <input id="email" type="email" placeholder="Email" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-white">
                <input id="pass" type="password" placeholder="Password" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 text-white">
                <button onclick="handleLogin()" class="w-full btn-main py-4 font-bold">Sign In</button>
                <button onclick="handleGoogle()" class="w-full bg-white text-black py-4 rounded-xl font-bold flex items-center justify-center gap-2">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="20"> Google
                </button>
            </div>
        </div>
    </div>

    <div id="app" class="hidden min-h-screen">
        <nav class="glass sticky top-0 z-[100] px-6 py-4 flex justify-between items-center">
            <div class="text-xl font-black text-blue-500">Z Ahmed Tech</div>
            <div class="flex items-center gap-3">
                <button onclick="toggleMode()" class="p-2 rounded-full hover:bg-slate-500/20"><i class="fas fa-adjust"></i></button>
                <button onclick="toggleLang()" class="p-2 text-xs font-bold uppercase" id="langBtn">EN</button>
                <button onclick="logout()" class="text-red-500 p-2"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </nav>

        <div class="container mx-auto px-4 py-8">
            <div class="flex flex-wrap gap-4 mb-8 justify-center">
                <a href="https://t.me/Z_Ahmed_Tech" target="_blank" class="bg-blue-500 text-white px-6 py-2 rounded-full font-bold shadow-lg"><i class="fab fa-telegram"></i> Telegram</a>
                <a href="https://www.youtube.com/@Z_Ahmed_Tech" target="_blank" class="bg-red-600 text-white px-6 py-2 rounded-full font-bold shadow-lg"><i class="fab fa-youtube"></i> YouTube</a>
                
                <div class="admin-only flex items-center gap-2 bg-slate-800 p-2 rounded-full border border-blue-500">
                    <button onclick="openAddModal()" class="bg-blue-600 text-white px-4 py-1 rounded-full text-xs font-bold"><i class="fas fa-plus"></i></button>
                    <input type="number" id="waitSet" onchange="updateWait(this.value)" class="w-12 bg-transparent text-white text-center text-xs outline-none" title="Set Wait Time">
                </div>
            </div>

            <div id="grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>
        </div>

        <div id="dlView" class="hidden fixed inset-0 z-[200] bg-inherit overflow-y-auto p-6">
            <div class="max-w-2xl mx-auto mt-20 glass p-8 rounded-[3rem] text-center">
                <img id="dlImg" class="w-32 h-32 mx-auto rounded-3xl mb-6 shadow-xl">
                <h2 id="dlTitle" class="text-2xl font-bold mb-4"></h2>
                <div id="timerContainer">
                    <p id="waitTxt" class="text-sm opacity-60 mb-2">Preparing link...</p>
                    <div class="loader-bar"><div id="bar" class="progress"></div></div>
                    <p id="timer" class="text-4xl font-black text-blue-500">00</p>
                </div>
                <div id="btnArea" class="hidden pt-6"></div>
                <button onclick="closeDl()" class="mt-8 text-blue-500 font-bold" id="backBtn">Back</button>
            </div>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-[500] bg-black/80 flex items-center justify-center p-4">
        <div class="bg-white text-black w-full max-w-lg p-8 rounded-3xl space-y-4">
            <h3 class="font-bold text-xl">New Post</h3>
            <input id="nT" placeholder="Title">
            <input id="nI" placeholder="Image URL">
            <textarea id="nD" placeholder="Description" class="w-full border p-3 rounded-xl"></textarea>
            <input id="nBL" placeholder="Download Link">
            <button onclick="savePost()" class="w-full btn-main py-4">Publish</button>
            <button onclick="document.getElementById('modal').classList.add('hidden')" class="w-full text-gray-500">Close</button>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(config);
        const auth = firebase.auth(), db = firebase.database();
        const ADMIN = "ahmedgames2025.11@gmail.com";
        let me = null, waitTime = 10, isDark = true, lang = 'AR';

        // --- Auth ---
        function handleLogin() {
            auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('pass').value);
        }
        function handleGoogle() {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        }
        function logout() { auth.signOut().then(() => location.reload()); }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(!me) {
                        const role = (user.email === ADMIN) ? 'admin' : 'visitor';
                        db.ref('users/' + user.uid).set({ email: user.email, role: role });
                    } else {
                        if(me.role === 'admin') document.body.classList.add('is-admin');
                        document.getElementById('authScreen').classList.add('hidden');
                        document.getElementById('app').classList.remove('hidden');
                        db.ref('settings/time').on('value', s => { 
                            waitTime = s.val() || 10;
                            document.getElementById('waitSet').value = waitTime;
                        });
                        load();
                    }
                });
            }
        });

        // --- Core ---
        function load() {
            db.ref('posts').on('value', snap => {
                const grid = document.getElementById('grid'); grid.innerHTML = '';
                snap.forEach(p => {
                    grid.innerHTML += `
                        <div class="glass p-3 rounded-2xl text-center cursor-pointer hover:scale-105 transition" onclick="openDl('${p.key}')">
                            <img src="${p.val().img}" class="w-full aspect-square rounded-xl object-cover mb-2 shadow-sm">
                            <h3 class="text-xs font-bold truncate">${p.val().title}</h3>
                            ${me.role === 'admin' ? `<button onclick="event.stopPropagation(); deletePost('${p.key}')" class="text-red-500 text-[10px] mt-2">Delete</button>` : ''}
                        </div>`;
                });
            });
        }

        async function openDl(id) {
            const snap = await db.ref('posts/'+id).once('value');
            const post = snap.val();
            document.getElementById('dlView').classList.remove('hidden');
            document.getElementById('dlImg').src = post.img;
            document.getElementById('dlTitle').innerText = post.title;
            
            let c = (me.role === 'admin') ? 0 : waitTime;
            document.getElementById('timer').innerText = c;
            document.getElementById('bar').style.width = '0%';
            document.getElementById('btnArea').classList.add('hidden');
            document.getElementById('timerContainer').classList.remove('hidden');

            if(c === 0) { showFinal(post.link); return; }

            const itv = setInterval(() => {
                c--;
                document.getElementById('timer').innerText = c;
                document.getElementById('bar').style.width = (100 - (c * (100/waitTime))) + '%';
                if(c <= 0) { clearInterval(itv); showFinal(post.link); }
            }, 1000);
        }

        function showFinal(link) {
            document.getElementById('timerContainer').classList.add('hidden');
            document.getElementById('btnArea').classList.remove('hidden');
            document.getElementById('btnArea').innerHTML = `<a href="${link}" target="_blank" class="w-full block btn-main py-4 text-lg font-bold">Download Now</a>`;
        }

        // --- Tools ---
        function toggleMode() {
            isDark = !isDark;
            document.body.className = isDark ? 'dark-mode' : 'light-mode';
        }

        function toggleLang() {
            lang = (lang === 'AR') ? 'EN' : 'AR';
            document.getElementById('langBtn').innerText = lang;
            const html = document.getElementById('mainHtml');
            if(lang === 'EN') {
                html.dir = 'ltr'; html.lang = 'en';
                document.getElementById('waitTxt').innerText = "Preparing link...";
                document.getElementById('backBtn').innerText = "Back";
            } else {
                html.dir = 'rtl'; html.lang = 'ar';
                document.getElementById('waitTxt').innerText = "جاري تجهيز الرابط...";
                document.getElementById('backBtn').innerText = "العودة";
            }
        }

        function openAddModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeDl() { document.getElementById('dlView').classList.add('hidden'); }
        function updateWait(v) { if(me.role === 'admin') db.ref('settings/time').set(parseInt(v)); }
        function savePost() {
            db.ref('posts').push({
                title: document.getElementById('nT').value,
                img: document.getElementById('nI').value,
                desc: document.getElementById('nD').value,
                link: document.getElementById('nBL').value
            });
            document.getElementById('modal').classList.add('hidden');
        }
        function deletePost(id) { if(confirm('Delete?')) db.ref('posts/'+id).remove(); }
    </script>
</body>
</html>
