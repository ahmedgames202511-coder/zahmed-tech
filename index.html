<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | الإصدار المستقر</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #020617; color: #f1f5f9; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-primary { background: linear-gradient(135deg, #06b6d4, #3b82f6); transition: 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3); }
        .admin-only { display: none; }
        body.is-admin .admin-only { display: block; }
        input, textarea { background: #0f172a !important; border: 1px solid #334155 !important; color: white !important; border-radius: 12px; padding: 12px; width: 100%; outline: none; }
    </style>
</head>
<body>

    <div id="authContainer" class="fixed inset-0 z-[1000] flex items-center justify-center bg-[#020617]">
        <div class="glass p-10 w-full max-w-md rounded-[2.5rem] text-center">
            <h1 class="text-4xl font-black mb-8 italic">Z AHMED <span class="text-cyan-400">TECH</span></h1>
            <div class="space-y-4">
                <input id="emailField" type="email" placeholder="البريد الإلكتروني">
                <input id="passField" type="password" placeholder="كلمة المرور">
                <button onclick="emailLogin()" class="w-full btn-primary py-4 rounded-xl font-bold">تسجيل الدخول</button>
                <div class="text-slate-600 text-xs py-2">أو</div>
                <button onclick="googleLogin()" class="w-full bg-white text-black py-4 rounded-xl font-black flex items-center justify-center gap-2">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="20"> Google
                </button>
            </div>
        </div>
    </div>

    <div id="appContainer" class="hidden min-h-screen">
        <nav class="glass sticky top-0 z-[100] px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-black italic">Z.A <span class="text-cyan-400">TECH</span></div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p id="uName" class="text-sm font-bold">...</p>
                    <p id="uRole" class="text-[10px] text-cyan-400 font-bold uppercase">VISITOR</p>
                </div>
                <button onclick="logout()" class="text-red-500 p-2"><i class="fas fa-power-off text-xl"></i></button>
            </div>
        </nav>

        <div class="container mx-auto px-4 py-10 lg:px-20">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
                <div class="lg:col-span-3">
                    <div class="admin-only glass p-6 rounded-3xl space-y-3 mb-6">
                        <p class="text-[10px] font-bold text-slate-500 mb-4">لوحة التحكم</p>
                        <button onclick="showModal('add')" class="w-full text-right p-3 rounded-xl hover:bg-white/5 transition flex justify-between">
                            <span>نشر محتوى</span> <i class="fas fa-plus text-cyan-400"></i>
                        </button>
                        <button onclick="showModal('users')" class="w-full text-right p-3 rounded-xl hover:bg-white/5 transition flex justify-between">
                            <span>الرتب</span> <i class="fas fa-user-shield text-cyan-400"></i>
                        </button>
                    </div>
                </div>
                <div class="lg:col-span-9">
                    <div id="postsList" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-[500] bg-black/90 flex items-center justify-center p-4">
        <div class="glass w-full max-w-2xl p-8 rounded-[2rem] relative">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-slate-500"><i class="fas fa-times-circle text-2xl"></i></button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        const ADMIN_EMAIL = "ahmedgames2025.11@gmail.com";
        let userProfile = null, imgData = "";

        // --- Auth Functions ---
        function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(e => Swal.fire('خطأ', e.message, 'error'));
        }

        function emailLogin() {
            const e = document.getElementById('emailField').value, p = document.getElementById('passField').value;
            auth.signInWithEmailAndPassword(e, p).catch(e => Swal.fire('خطأ', 'الحساب غير موجود أو البيانات خطأ', 'error'));
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    userProfile = snap.val();
                    if(!userProfile) {
                        const role = (user.email === ADMIN_EMAIL) ? 'admin' : 'visitor';
                        db.ref('users/' + user.uid).set({ uid: user.uid, email: user.email, name: user.displayName || 'User', role: role });
                    } else {
                        if(userProfile.role === 'admin') document.body.classList.add('is-admin');
                        document.getElementById('authContainer').classList.add('hidden');
                        document.getElementById('appContainer').classList.remove('hidden');
                        document.getElementById('uName').innerText = userProfile.name;
                        document.getElementById('uRole').innerText = userProfile.role;
                        loadPosts();
                    }
                });
            }
        });

        // --- Post Functions ---
        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const list = document.getElementById('postsList');
                list.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    list.innerHTML += `
                        <div class="glass overflow-hidden rounded-3xl group cursor-pointer" onclick="viewPost('${p.key}')">
                            <img src="${post.img}" class="w-full h-48 object-cover group-hover:scale-105 transition duration-500">
                            <div class="p-6 text-right">
                                <h3 class="font-bold text-xl">${post.title}</h3>
                                ${userProfile.role === 'admin' ? `<button onclick="event.stopPropagation(); deletePost('${p.key}')" class="text-red-500 mt-4"><i class="fas fa-trash"></i></button>` : ''}
                            </div>
                        </div>`;
                });
            });
        }

        async function viewPost(id) {
            const snap = await db.ref('posts/' + id).once('value');
            const post = snap.val();
            Swal.fire({
                title: post.title,
                text: post.desc,
                imageUrl: post.img,
                showCancelButton: true,
                confirmButtonText: 'انتقال للرابط',
                cancelButtonText: 'إغلاق'
            }).then(r => { if(r.isConfirmed && post.link) window.open(post.link, '_blank'); });
        }

        // --- Admin Tools ---
        function showModal(type) {
            const body = document.getElementById('modalBody');
            document.getElementById('modal').classList.remove('hidden');
            if(type === 'add') {
                body.innerHTML = `
                    <h2 class="text-2xl font-bold mb-4">نشر موضوع</h2>
                    <input id="nT" placeholder="العنوان" class="mb-2">
                    <input type="file" accept="image/*" onchange="readImg(event)" class="mb-2 text-xs">
                    <textarea id="nD" placeholder="الوصف" class="mb-2"></textarea>
                    <input id="nL" placeholder="الرابط" class="mb-4">
                    <button onclick="savePost()" class="w-full btn-primary py-3 rounded-xl font-bold">حفظ ونشر</button>`;
            }
        }

        function readImg(e) {
            const reader = new FileReader();
            reader.onload = (ev) => imgData = ev.target.result;
            reader.readAsDataURL(e.target.files[0]);
        }

        function savePost() {
            const title = document.getElementById('nT').value;
            if(!title || !imgData) return Swal.fire('خطأ', 'أدخل العنوان والصورة', 'warning');
            db.ref('posts').push({ title, img: imgData, desc: document.getElementById('nD').value, link: document.getElementById('nL').value, time: Date.now() });
            closeModal();
            imgData = "";
        }

        function deletePost(id) { if(confirm('حذف؟')) db.ref('posts/' + id).remove(); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    </script>
</body>
</html>
