<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصة الرسمية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-cyan { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; transition: 0.3s; }
        input { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; border-radius: 12px; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950 p-4">
        <div class="glass p-10 w-full max-w-md rounded-[2.5rem] text-center shadow-2xl">
            <h1 class="text-4xl font-black mb-8 text-white">Z Ahmed <span class="text-cyan-400">Tech</span></h1>
            <div class="space-y-4">
                <input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full p-4 outline-none">
                <input id="pass" type="password" placeholder="كلمة المرور" class="w-full p-4 outline-none">
                <button id="loginBtn" onclick="login()" class="w-full btn-cyan py-4 rounded-xl font-bold">دخول للمنصة</button>
                <button onclick="googleSignIn()" class="w-full bg-white text-black py-3 rounded-xl font-bold flex items-center justify-center gap-2">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="18"> دخول بجوجل
                </button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-black">Z Ahmed <span class="text-cyan-400">Tech</span></div>
            <button onclick="logout()" class="text-red-500 font-bold">خروج</button>
        </nav>
        <div class="container mx-auto p-10 text-center">
            <h2 class="text-2xl">مرحباً بك في لوحة التحكم</h2>
            <div id="adminPanel" class="hidden mt-10 p-5 glass rounded-2xl">
                <p class="text-cyan-400 font-bold">أنت الآن بوضع الأدمن</p>
                </div>
        </div>
    </div>

    <script>
        // التكوين - تأكد أن الرابط هو https وليس http
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };

        // تفعيل الفايربيس مع فحص الأخطاء
        try {
            firebase.initializeApp(firebaseConfig);
            console.log("Firebase Initialized!");
        } catch (e) {
            alert("خطأ في تهيئة Firebase: " + e.message);
        }

        const db = firebase.database();
        const auth = firebase.auth();
        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com";

        async function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            const btn = document.getElementById('loginBtn');

            if(!e || !p) {
                Swal.fire('تنبيه', 'أدخل البيانات', 'warning');
                return;
            }

            btn.innerText = "جاري التحقق...";
            btn.disabled = true;

            try {
                const res = await auth.signInWithEmailAndPassword(e, p);
                console.log("Logged in:", res.user.email);
                // سيتم التحويل تلقائياً بواسطة onAuthStateChanged
            } catch (err) {
                btn.innerText = "دخول للمنصة";
                btn.disabled = false;
                Swal.fire('فشل الدخول', 'تأكد من تفعيل البريد في Firebase Authentication', 'error');
                console.error(err);
            }
        }

        async function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await auth.signInWithPopup(provider);
            } catch (e) {
                Swal.fire('خطأ', 'تأكد من تفعيل Google في Firebase', 'error');
            }
        }

        auth.onAuthStateChanged(async (user) => {
            if(user) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                
                // تحديث بيانات المستخدم في القاعدة
                const role = (user.email === MASTER_ADMIN) ? 'admin' : 'visitor';
                await db.ref('users/' + user.uid).update({
                    email: user.email,
                    role: role,
                    name: user.displayName || "User"
                });

                if(role === 'admin') {
                    document.getElementById('adminPanel').classList.remove('hidden');
                }
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        function logout() { auth.signOut(); }
    </script>
</body>
</html>
