<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصة الرسمية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        :root { --main: #06b6d4; --accent: #3b82f6; --bg: #020617; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #f1f5f9; scroll-behavior: smooth; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-cyber { background: linear-gradient(135deg, var(--main), var(--accent)); transition: 0.3s; color: white; font-weight: 800; }
        .btn-cyber:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(6, 182, 212, 0.4); }
        input, textarea { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; border-radius: 12px; padding: 12px; width: 100%; outline: none; }
        .admin-only { display: none; }
        body.is-admin .admin-only { display: block; }
        .post-card { border-radius: 25px; overflow: hidden; background: #0f172a; border: 1px solid #1e293b; transition: 0.4s; }
        .post-card:hover { transform: scale(1.02); border-color: var(--main); }
    </style>
</head>
<body>

    <div id="authOverlay" class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-950">
        <div class="glass p-10 w-full max-w-md rounded-[3rem] text-center animate__animated animate__fadeIn">
            <h1 class="text-4xl font-black italic mb-8">Z AHMED <span class="text-cyan-400">TECH</span></h1>
            <div class="space-y-4">
                <input id="logEmail" type="email" placeholder="البريد الإلكتروني">
                <input id="logPass" type="password" placeholder="كلمة المرور">
                <button onclick="loginEmail()" class="w-full btn-cyber py-4 rounded-xl">دخول</button>
                <div class="py-2 text-slate-700 text-xs uppercase tracking-widest">أو</div>
                <button onclick="loginGoogle()" class="w-full bg-white text-black py-4 rounded-xl font-black flex items-center justify-center gap-2 hover:bg-slate-200 transition">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="18"> Google
                </button>
            </div>
        </div>
    </div>

    <div id="appInterface" class="hidden min-h-screen">
        <nav class="glass sticky top-0 z-[100] px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="text-2xl font-black italic">Z.A <span class="text-cyan-400">TECH</span></div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p id="userName" class="text-sm font-bold">...</p>
                    <p id="userRole" class="text-[9px] text-cyan-400 font-black">VISITOR</p>
                </div>
                <button onclick="logout()" class="w-10 h-10 rounded-full bg-red-500/10 text-red-500 hover:bg-red-500 transition flex items-center justify-center">
                    <i class="fas fa-power-off"></i>
                </button>
            </div>
        </nav>

        <div class="container mx-auto px-6 py-10 lg:px-20">
            <div id="homeView" class="grid grid-cols-1 lg:grid-cols-12 gap-10">
                
                <div class="lg:col-span-3 space-y-6">
                    <div class="admin-only glass p-6 rounded-3xl animate__animated animate__fadeInLeft">
                        <p class="text-[10px] font-black text-slate-500 mb-4 uppercase">لوحة التحكم</p>
                        <button onclick="openModal('add')" class="w-full text-right p-3 rounded-xl hover:bg-white/5 flex justify-between items-center">
                            <span>نشر محتوى</span> <i class="fas fa-plus-circle text-cyan-400"></i>
                        </button>
                        <button onclick="openModal('users')" class="w-full text-right p-3 rounded-xl hover:bg-white/5 flex justify-between items-center mt-2">
                            <span>إدارة الرتب</span> <i class="fas fa-users-cog text-cyan-400"></i>
                        </button>
                        <div class="mt-4 pt-4 border-t border-white/5">
                            <label class="text-[10px] text-slate-500">وقت العداد (ثواني)</label>
                            <input type="number" id="waitInput" onchange="setWait(this.value)" class="mt-1 !py-1 text-center font-bold">
                        </div>
                    </div>

                    <div class="glass p-6 rounded-3xl">
                        <p class="text-[10px] font-black text-slate-500 mb-4 uppercase">قنواتنا</p>
                        <a href="https://t.me/Z_Ahmed_Tech" target="_blank" class="flex items-center gap-3 p-3 rounded-xl bg-[#229ED9]/10 text-[#229ED9] mb-2 font-bold">
                            <i class="fab fa-telegram"></i> Telegram
                        </a>
                        <a href="https://www.youtube.com/@Z_Ahmed_Tech" target="_blank" class="flex items-center gap-3 p-3 rounded-xl bg-red-600/10 text-red-600 font-bold">
                            <i class="fab fa-youtube"></i> YouTube
                        </a>
                    </div>
                </div>

                <div class="lg:col-span-9">
                    <h2 class="text-3xl font-black mb-8 italic">اكتشف <span class="text-cyan-400">الجديد</span></h2>
                    <div id="postsFeed" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
                </div>
            </div>

            <div id="detailView" class="hidden max-w-4xl mx-auto animate__animated animate__fadeIn">
                <div id="waitScreen" class="py-20 text-center space-y-6">
                    <div class="inline-block relative">
                        <svg class="w-32 h-32 transform -rotate-90">
                            <circle cx="64" cy="64" r="60" stroke="#1e293b" stroke-width="8" fill="transparent" />
                            <circle id="ring" cx="64" cy="64" r="60" stroke="#06b6d4" stroke-width="8" fill="transparent" stroke-dasharray="377" stroke-dashoffset="377" style="transition: 1s linear;" />
                        </svg>
                        <span id="timerNum" class="absolute inset-0 flex items-center justify-center text-4xl font-black"></span>
                    </div>
                    <p class="text-slate-400 italic">Z Ahmed Tech - جاري التجهيز...</p>
                </div>

                <div id="finalPost" class="hidden space-y-8 text-right pb-20">
                    <button onclick="goHome()" class="text-cyan-400 font-bold flex items-center gap-2">
                        <i class="fas fa-arrow-right"></i> الرجوع
                    </button>
                    <img id="fImg" class="w-full h-96 object-cover rounded-[2.5rem] shadow-2xl">
                    <h1 id="fTitle" class="text-5xl font-black"></h1>
                    <div id="fDesc" class="text-xl text-slate-300 leading-relaxed whitespace-pre-wrap"></div>
                    <div id="fBtnArea" class="flex justify-center pt-10"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-[1000] bg-black/95 flex items-center justify-center p-4">
        <div class="glass w-full max-w-2xl p-8 rounded-[2.5rem] relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-6 left-6 text-2xl text-slate-500"><i class="fas fa-times-circle"></i></button>
            <div id="modalBody" class="text-right"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        const OWNER = "ahmedgames2025.11@gmail.com";
        let me = null, waitTime = 5, baseImg = "";

        // --- Auth Fix ---
        function loginEmail() {
            const e = document.getElementById('logEmail').value, p = document.getElementById('logPass').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => Swal.fire('خطأ', 'بيانات الدخول خطأ', 'error'));
        }

        function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => {
                if(err.code === 'auth/popup-blocked') Swal.fire('تنبيه', 'يرجى السماح بالنوافذ المنبثقة', 'warning');
                else Swal.fire('فشل', err.message, 'error');
            });
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(!me) {
                        const role = (user.email === OWNER) ? 'admin' : 'visitor';
                        db.ref('users/' + user.uid).set({ uid: user.uid, email: user.email, name: user.displayName || 'User', role: role });
                    } else {
                        if(me.role === 'admin') document.body.classList.add('is-admin');
                        document.getElementById('authOverlay').classList.add('hidden');
                        document.getElementById('appInterface').classList.remove('hidden');
                        document.getElementById('userName').innerText = me.name;
                        document.getElementById('userRole').innerText = me.role;
                        db.ref('settings/waitTime').on('value', s => { 
                            waitTime = s.val() || 5; 
                            if(document.getElementById('waitInput')) document.getElementById('waitInput').value = waitTime;
                        });
                        loadPosts();
                    }
                });
            }
        });

        // --- Core Functions ---
        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const feed = document.getElementById('postsFeed'); feed.innerHTML = '';
                let posts = []; snap.forEach(p => { posts.unshift({id: p.key, ...p.val()}) });
                posts.forEach(p => {
                    feed.innerHTML += `
                        <div class="post-card group animate__animated animate__fadeInUp" onclick="openPost('${p.id}')">
                            <img src="${p.img}" class="w-full h-52 object-cover">
                            <div class="p-6 text-right">
                                <h3 class="text-xl font-bold group-hover:text-cyan-400 transition">${p.title}</h3>
                                <div class="flex justify-between items-center mt-4">
                                    <span class="text-[10px] text-slate-500">${new Date(p.time).toLocaleDateString()}</span>
                                    <div class="admin-only">
                                        <button onclick="event.stopPropagation(); deletePost('${p.id}')" class="text-red-500"><i class="fas fa-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                });
            });
        }

        async function openPost(id) {
            const snap = await db.ref('posts/'+id).once('value'), post = snap.val();
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            window.scrollTo(0,0);
            if(me.role === 'admin') { renderFinal(post); return; }
            document.getElementById('waitScreen').classList.remove('hidden');
            document.getElementById('finalPost').classList.add('hidden');
            let c = waitTime; document.getElementById('timerNum').innerText = c;
            const timer = setInterval(() => {
                c--; document.getElementById('timerNum').innerText = c;
                document.getElementById('ring').style.strokeDashoffset = 377 - (377 * (waitTime - c) / waitTime);
                if(c <= 0) { clearInterval(timer); renderFinal(post); }
            }, 1000);
        }

        function renderFinal(post) {
            document.getElementById('waitScreen').classList.add('hidden');
            document.getElementById('finalPost').classList.remove('hidden');
            document.getElementById('fImg').src = post.img;
            document.getElementById('fTitle').innerText = post.title;
            document.getElementById('fDesc').innerText = post.desc;
            document.getElementById('fBtnArea').innerHTML = post.btnLink ? `<a href="${post.btnLink}" target="_blank" class="btn-cyber px-16 py-4 rounded-full text-xl shadow-2xl">${post.btnName || 'انتقال'}</a>` : '';
        }

        // --- Admin Tools ---
        function openModal(type) {
            const body = document.getElementById('modalBody');
            document.getElementById('modal').classList.remove('hidden');
            if(type === 'add') {
                body.innerHTML = `
                    <h2 class="text-2xl font-bold mb-6">نشر موضوع جديد</h2>
                    <input id="nT" placeholder="العنوان" class="mb-4">
                    <div class="p-4 border-2 border-dashed border-slate-800 rounded-xl mb-4 text-center">
                        <input type="file" accept="image/*" onchange="upImg(event)" class="text-xs mb-2">
                        <img id="pImg" class="hidden w-full h-40 object-cover rounded-lg mt-2">
                    </div>
                    <input id="nI" placeholder="أو رابط صورة" class="mb-4">
                    <textarea id="nD" placeholder="الوصف" rows="5" class="mb-4"></textarea>
                    <div class="grid grid-cols-2 gap-4">
                        <input id="nBN" placeholder="اسم الزر">
                        <input id="nBL" placeholder="رابط الزر">
                    </div>
                    <button onclick="savePost()" class="w-full btn-cyber py-4 rounded-xl mt-6">نشر الآن</button>`;
            } else if(type === 'users') {
                body.innerHTML = `<h2 class="text-2xl font-bold mb-6 text-center">إدارة الرتب</h2><div id="uList" class="space-y-3"></div>`;
                db.ref('users').once('value', s => {
                    const l = document.getElementById('uList');
                    s.forEach(u => {
                        l.innerHTML += `<div class="glass p-4 rounded-xl flex justify-between items-center">
                            <select onchange="upRole('${u.key}', this.value)" class="!w-auto !py-1 !text-xs">
                                <option value="visitor" ${u.val().role==='visitor'?'selected':''}>Visitor</option>
                                <option value="admin" ${u.val().role==='admin'?'selected':''}>Admin</option>
                            </select>
                            <div class="text-right"><p class="font-bold text-sm">${u.val().name}</p></div>
                        </div>`;
                    });
                });
            }
        }

        function upImg(e) {
            const r = new FileReader();
            r.onload = (ev) => { baseImg = ev.target.result; document.getElementById('pImg').src = baseImg; document.getElementById('pImg').classList.remove('hidden'); };
            r.readAsDataURL(e.target.files[0]);
        }

        function savePost() {
            const title = document.getElementById('nT').value, img = baseImg || document.getElementById('nI').value;
            if(!title || !img) return Swal.fire('تنبيه', 'أكمل العنوان والصورة', 'warning');
            db.ref('posts').push({ title, img, desc: document.getElementById('nD').value, btnName: document.getElementById('nBN').value, btnLink: document.getElementById('nBL').value, time: Date.now() });
            closeModal(); baseImg = "";
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function goHome() { document.getElementById('homeView').classList.remove('hidden'); document.getElementById('detailView').classList.add('hidden'); }
        function deletePost(id) { if(confirm('حذف؟')) db.ref('posts/'+id).remove(); }
        function upRole(uid, role) { db.ref('users/'+uid).update({role}); }
        function setWait(v) { db.ref('settings/waitTime').set(parseInt(v)); }
    </script>
</body>
                </html>
