<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | Pro Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; transition: 0.4s; overflow-x: hidden; }
        .dark-mode { background: #020617; color: #f1f5f9; }
        .light-mode { background: #f8fafc; color: #0f172a; }
        .glass { backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; }
        .dark-mode .glass { background: rgba(15, 23, 42, 0.8); }
        .light-mode .glass { background: rgba(255, 255, 255, 0.9); border-color: #e2e8f0; }
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: block !important; }
        .desc-box { background: rgba(0,0,0,0.2); border-radius: 15px; padding: 15px; margin: 15px 0; font-size: 0.9rem; }
        .chat-msg { margin-bottom: 10px; padding: 10px; border-radius: 15px; max-width: 80%; }
        .msg-me { background: #2563eb; color: white; margin-right: auto; border-bottom-left-radius: 0; }
        .msg-other { background: #334155; color: white; margin-left: auto; border-bottom-right-radius: 0; }
    </style>
</head>
<body class="dark-mode">

    <div id="authLayout" class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-950">
        <div class="glass p-10 w-full max-w-md text-center animate__animated animate__zoomIn">
            <h1 class="text-3xl font-black mb-2 text-white">Z Ahmed Tech</h1>
            <div class="space-y-4 mt-8">
                <input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-700 outline-none text-white">
                <input id="pass" type="password" placeholder="كلمة المرور" class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-700 outline-none text-white">
                <button onclick="loginEmail()" class="w-full bg-blue-600 py-4 rounded-2xl font-bold hover:bg-blue-700 transition">دخول</button>
                <button onclick="loginGoogle()" class="w-full bg-white text-black py-4 rounded-2xl font-bold flex items-center justify-center gap-3">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="22"> جوجل
                </button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden min-h-screen pb-20">
        <nav class="glass sticky top-4 mx-4 z-[1000] px-6 py-4 flex justify-between items-center shadow-2xl">
            <div class="flex items-center gap-6">
                <span class="text-xl font-black text-blue-500">Z Ahmed Tech</span>
                <div class="hidden md:flex gap-6 text-sm font-bold">
                    <span onclick="showPage('home')" class="cursor-pointer hover:text-blue-500 transition">الرئيسية</span>
                    <span onclick="showPage('chat')" class="cursor-pointer hover:text-blue-500 transition">المحادثات</span>
                    <span onclick="showPage('admin')" class="cursor-pointer hover:text-blue-500 transition admin-only">لوحة الأدمن</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleTheme()" class="p-2"><i class="fas fa-adjust"></i></button>
                <button onclick="logout()" class="text-red-500 p-2"><i class="fas fa-power-off"></i></button>
            </div>
        </nav>

        <div id="pageHome" class="container mx-auto px-6 py-10">
            <h2 class="text-xl font-black mb-4 border-r-4 border-yellow-500 pr-4">المسابقات الحالية</h2>
            <div id="contestsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6 mb-12"></div>

            <hr class="opacity-10 mb-10">

            <h2 class="text-xl font-black mb-4 border-r-4 border-blue-500 pr-4">المنشورات العادية</h2>
            <div id="postsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>
        </div>

        <div id="pageChat" class="hidden container mx-auto px-6 py-10">
            <div class="max-w-2xl mx-auto glass h-[70vh] flex flex-col p-4">
                <div id="chatContent" class="flex-grow overflow-y-auto mb-4 p-2"></div>
                <div class="flex gap-2">
                    <input id="chatInput" placeholder="اكتب رسالتك..." class="flex-grow p-4 rounded-2xl bg-slate-900 border border-slate-700">
                    <button onclick="sendMsg()" class="bg-blue-600 px-6 rounded-2xl"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <div id="pageAdmin" class="hidden container mx-auto px-6 py-10">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="glass p-6 border-l-4 border-blue-500">
                    <p class="text-xs font-bold opacity-50 uppercase">المتصلون</p>
                    <h3 id="onlineCount" class="text-3xl font-black">0</h3>
                </div>
                <div class="glass p-6 md:col-span-2">
                    <button onclick="openPostModal()" class="w-full bg-blue-600 rounded-2xl font-black text-white py-4 shadow-xl">إضافة منشور (عادي/مسابقة)</button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="glass p-6">
                    <h4 class="font-bold mb-4">طلبات المشاركة في المسابقات</h4>
                    <div id="contestRequests" class="space-y-3 max-h-[400px] overflow-y-auto"></div>
                </div>
                <div class="glass p-6">
                    <h4 class="font-bold mb-4">إدارة المستخدمين</h4>
                    <div id="usersList" class="space-y-3 max-h-[400px] overflow-y-auto"></div>
                </div>
            </div>
        </div>

        <div id="pageDl" class="hidden fixed inset-0 z-[500] bg-inherit p-6 overflow-y-auto text-center">
            <div class="max-w-xl mx-auto mt-10 glass p-8 animate__animated animate__zoomIn">
                <img id="dlImg" class="w-40 h-40 mx-auto rounded-3xl shadow-2xl mb-4">
                <h2 id="dlTitle" class="text-2xl font-black mb-2"></h2>
                <div id="dlDesc" class="desc-box"></div>
                
                <div id="normalPostSection" class="hidden">
                    <div id="dlTimer"><div class="text-5xl font-black text-blue-500 mb-6" id="dlNum">00</div></div>
                    <div id="dlFinal"></div>
                </div>

                <div id="contestSection" class="hidden space-y-4">
                    <p class="text-yellow-500 font-bold">هذه مسابقة! أدخل بياناتك للاشتراك:</p>
                    <input id="userNameContest" placeholder="الاسم الكامل" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700">
                    <input id="userPhoneContest" placeholder="رقم الهاتف" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700">
                    <button onclick="submitContest()" class="w-full bg-yellow-600 py-4 rounded-xl font-bold">تأكيد الاشتراك</button>
                </div>

                <button onclick="showPage('home')" class="mt-8 text-blue-500 block mx-auto">← العودة للرئيسية</button>
            </div>
        </div>
    </div>

    <div id="postModal" class="hidden fixed inset-0 z-[2000] bg-black/90 flex items-center justify-center p-4">
        <div class="glass bg-slate-900 w-full max-w-lg p-8 space-y-4">
            <h2 class="text-xl font-bold mb-4">إضافة عمل جديد</h2>
            <select id="postType" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700">
                <option value="normal">منشور عادي (تحميل)</option>
                <option value="contest">مسابقة (اشتراك)</option>
            </select>
            <input id="postTitle" placeholder="العنوان" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700">
            <input id="postImg" placeholder="رابط الصورة" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700">
            <textarea id="postDesc" placeholder="الوصف..." class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 h-24"></textarea>
            <input id="postLink" placeholder="الرابط (للمنشور العادي فقط)" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700">
            
            <div class="flex gap-4">
                <button onclick="savePost()" class="flex-grow bg-blue-600 py-4 rounded-xl font-bold">نشر</button>
                <button onclick="document.getElementById('postModal').classList.add('hidden')" class="px-6 bg-slate-700 rounded-xl">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        const ADMIN_EMAIL = "ahmedgames2025.11@gmail.com";
        let me = null, activePostId = null;

        // --- Auth Functions ---
        function loginEmail() { auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('pass').value).catch(e => alert('خطأ')); }
        function loginGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function logout() { auth.signOut().then(() => location.reload()); }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref(`users/${user.uid}`).on('value', snap => {
                    me = snap.val();
                    if(!me) {
                        me = { name: user.displayName || 'User', email: user.email, uid: user.uid, role: (user.email === ADMIN_EMAIL ? 'admin' : 'visitor') };
                        db.ref(`users/${user.uid}`).set(me);
                    }
                    if(me.role === 'admin') document.body.classList.add('is-admin');
                    document.getElementById('authLayout').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    initApp();
                });
            }
        });

        function initApp() {
            loadPosts();
            loadChat();
            if(me.role === 'admin') {
                db.ref('online').on('value', s => document.getElementById('onlineCount').innerText = s.numChildren());
                loadAdminData();
            }
        }

        // --- Posts Management ---
        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const pGrid = document.getElementById('postsGrid');
                const cGrid = document.getElementById('contestsGrid');
                pGrid.innerHTML = ''; cGrid.innerHTML = '';
                
                snap.forEach(child => {
                    const post = child.val();
                    const html = `
                        <div class="glass p-3 text-center cursor-pointer hover:border-blue-500 transition" onclick="openDetail('${child.key}')">
                            <img src="${post.img}" class="w-full aspect-square object-cover rounded-2xl mb-2">
                            <h3 class="text-[10px] font-bold truncate">${post.title}</h3>
                            ${me.role === 'admin' ? `<button onclick="event.stopPropagation(); deletePost('${child.key}')" class="text-red-500 text-[10px]">حذف</button>` : ''}
                        </div>`;
                    
                    if(post.type === 'contest') cGrid.innerHTML += html;
                    else pGrid.innerHTML += html;
                });
            });
        }

        async function openDetail(id) {
            activePostId = id;
            const post = (await db.ref('posts/'+id).once('value')).val();
            showPage('dl');
            document.getElementById('dlImg').src = post.img;
            document.getElementById('dlTitle').innerText = post.title;
            document.getElementById('dlDesc').innerText = post.desc;

            if(post.type === 'contest') {
                document.getElementById('contestSection').classList.remove('hidden');
                document.getElementById('normalPostSection').classList.add('hidden');
            } else {
                document.getElementById('contestSection').classList.add('hidden');
                document.getElementById('normalPostSection').classList.remove('hidden');
                startDownloadTimer(post);
            }
        }

        function startDownloadTimer(post) {
            let count = 10;
            const num = document.getElementById('dlNum');
            const final = document.getElementById('dlFinal');
            num.parentElement.classList.remove('hidden');
            final.classList.add('hidden');

            const itv = setInterval(() => {
                num.innerText = count--;
                if(count < 0) {
                    clearInterval(itv);
                    num.parentElement.classList.add('hidden');
                    final.classList.remove('hidden');
                    final.innerHTML = `<a href="${post.link}" target="_blank" class="block bg-blue-600 py-4 rounded-2xl font-black">تحميل الآن</a>`;
                }
            }, 1000);
        }

        // --- Contest System ---
        function submitContest() {
            const name = document.getElementById('userNameContest').value;
            const phone = document.getElementById('userPhoneContest').value;
            if(!name || !phone) return alert('أكمل البيانات');

            db.ref(`contest_entries/${activePostId}/${me.uid}`).set({
                name: name,
                phone: phone,
                email: me.email,
                uid: me.uid,
                status: 'pending'
            }).then(() => {
                Swal.fire('تم!', 'تم تسجيل اشتراكك بنجاح', 'success');
                showPage('home');
            });
        }

        function loadAdminData() {
            // Load Contest Requests
            db.ref('contest_entries').on('value', snap => {
                const list = document.getElementById('contestRequests');
                list.innerHTML = '';
                snap.forEach(postEntries => {
                    postEntries.forEach(entrySnap => {
                        const entry = entrySnap.val();
                        list.innerHTML += `
                            <div class="p-3 bg-white/5 rounded-xl text-xs flex justify-between items-center">
                                <div>
                                    <p class="font-bold">${entry.name} (${entry.phone})</p>
                                    <p class="opacity-50">مسابقة: ${postEntries.key}</p>
                                </div>
                                <button onclick="pickWinner('${postEntries.key}', '${entry.uid}')" class="bg-green-600 px-3 py-1 rounded-lg">اختيار فائز</button>
                            </div>`;
                    });
                });
            });
        }

        function pickWinner(postId, userUid) {
            Swal.fire('مبروك!', 'تم اختيار الفائز، سيتم إرسال رسالة شات له الآن', 'success');
            const msg = "تهانينا! لقد فزت في المسابقة معنا على Z Ahmed Tech. تواصل معنا لاستلام الجائزة.";
            db.ref(`chats/${userUid}`).push({ sender: 'admin', text: msg, time: Date.now() });
        }

        // --- Chat System ---
        function loadChat() {
            const chatId = (me.role === 'admin') ? 'global_admin' : me.uid; // للتبسيط
            db.ref(`chats/${me.uid}`).on('value', snap => {
                const chatBox = document.getElementById('chatContent');
                chatBox.innerHTML = '';
                snap.forEach(c => {
                    const m = c.val();
                    chatBox.innerHTML += `<div class="chat-msg ${m.sender === 'admin' ? 'msg-other' : 'msg-me'}">${m.text}</div>`;
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function sendMsg() {
            const txt = document.getElementById('chatInput').value;
            if(!txt) return;
            db.ref(`chats/${me.uid}`).push({ sender: me.uid, text: txt, time: Date.now() });
            document.getElementById('chatInput').value = '';
        }

        // --- Helpers ---
        function showPage(p) {
            ['pageHome', 'pageAdmin', 'pageDl', 'pageChat'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('page' + p.charAt(0).toUpperCase() + p.slice(1)).classList.remove('hidden');
        }
        function toggleTheme() { document.body.classList.toggle('dark-mode'); document.body.classList.toggle('light-mode'); }
        function openPostModal() { document.getElementById('postModal').classList.remove('hidden'); }
        function savePost() {
            const data = {
                type: document.getElementById('postType').value,
                title: document.getElementById('postTitle').value,
                img: document.getElementById('postImg').value || 'https://via.placeholder.com/150',
                desc: document.getElementById('postDesc').value,
                link: document.getElementById('postLink').value
            };
            db.ref('posts').push(data).then(() => {
                document.getElementById('postModal').classList.add('hidden');
                Swal.fire('تم', 'تم النشر بنجاح', 'success');
            });
        }
        function deletePost(id) { if(confirm('حذف؟')) db.ref('posts/'+id).remove(); }
    </script>
</body>
</html>
