<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصة الاحترافية 2026</title>
    
    <meta name="description" content="منصة Z Ahmed Tech - عالم التقنية والبرمجة بين يديك.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap');
        
        :root {
            --cyan: #06b6d4;
            --blue: #3b82f6;
            --bg: #020617;
            --panel: rgba(15, 23, 42, 0.95);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: #f1f5f9;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .glass {
            background: var(--panel);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .btn-cyan {
            background: linear-gradient(90deg, var(--cyan), var(--blue));
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
            font-weight: 800;
        }

        .btn-cyan:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }

        .post-card {
            background: #0f172a;
            border-radius: 24px;
            border: 1px solid #1e293b;
            overflow: hidden;
            transition: 0.4s;
        }

        .post-card:hover {
            border-color: var(--cyan);
            transform: scale(1.02);
        }

        input, textarea, select {
            background: #0f172a !important;
            border: 1px solid #334155 !important;
            color: white !important;
            border-radius: 14px !important;
            padding: 14px !important;
            width: 100%;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--cyan) !important; box-shadow: 0 0 10px rgba(6, 182, 212, 0.1); }

        .loader-ring { transition: stroke-dashoffset 1s linear; }
        
        /* Admin Badge */
        .admin-glow {
            text-shadow: 0 0 10px var(--cyan);
        }

        #adminSidebar { display: none; }
        body.is-admin #adminSidebar { display: block; }
        body.is-admin .admin-only { display: block; }
        .admin-only { display: none; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[2000] flex items-center justify-center bg-slate-950 p-4">
        <div class="glass p-10 w-full max-w-md rounded-[3rem] text-center animate__animated animate__zoomIn">
            <div class="mb-10">
                <h1 class="text-5xl font-black italic tracking-tighter">Z AHMED <span class="text-cyan-400">TECH</span></h1>
                <p class="text-slate-500 text-[10px] uppercase tracking-[0.4em] mt-2">The Future Is Here</p>
            </div>
            
            <div class="space-y-4">
                <input id="email" type="email" placeholder="البريد الإلكتروني">
                <input id="pass" type="password" placeholder="كلمة المرور">
                <button onclick="loginWithEmail()" id="btnMail" class="w-full btn-cyan py-4 rounded-2xl shadow-lg">دخول بالبريد</button>
                
                <div class="relative py-4">
                    <hr class="border-slate-800">
                    <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-950 px-4 text-xs text-slate-600">أو سجل عبر</span>
                </div>

                <button onclick="loginWithGoogle()" id="btnGoogle" class="w-full bg-white text-black py-4 rounded-2xl font-black flex items-center justify-center gap-3 hover:bg-slate-200 transition">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="22">
                    Google Account
                </button>
            </div>
            <p class="mt-8 text-[10px] text-slate-700">Protected by Z Ahmed Security © 2026</p>
        </div>
    </div>

    <div id="mainApp" class="hidden min-h-screen">
        <nav class="glass sticky top-0 z-[500] px-8 py-5 flex justify-between items-center border-b border-white/5">
            <div class="text-3xl font-black italic cursor-pointer" onclick="goHome()">Z.A <span class="text-cyan-400">T</span></div>
            <div class="flex items-center gap-6">
                <div class="text-right">
                    <p id="navName" class="font-bold text-sm">...</p>
                    <p id="navRole" class="text-[9px] font-black text-cyan-500 tracking-widest uppercase">Visitor</p>
                </div>
                <button onclick="logout()" class="w-11 h-11 rounded-2xl bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all flex items-center justify-center">
                    <i class="fas fa-power-off text-lg"></i>
                </button>
            </div>
        </nav>

        <div class="container mx-auto px-4 py-10 lg:px-16">
            <div id="homeView" class="grid grid-cols-1 lg:grid-cols-12 gap-10">
                
                <div class="lg:col-span-3 space-y-6">
                    <div id="adminSidebar" class="glass p-8 rounded-[2.5rem] animate__animated animate__fadeInLeft">
                        <h3 class="text-xs font-black text-slate-500 uppercase mb-6 tracking-tighter">الإدارة العليا</h3>
                        <div class="space-y-3">
                            <button onclick="openModal('addPost')" class="w-full text-right p-4 rounded-2xl hover:bg-cyan-400/10 flex justify-between items-center group">
                                <span class="text-sm font-bold">نشر خبر جديد</span>
                                <i class="fas fa-camera-retro text-cyan-400"></i>
                            </button>
                            <button onclick="openModal('users')" class="w-full text-right p-4 rounded-2xl hover:bg-cyan-400/10 flex justify-between items-center group">
                                <span class="text-sm font-bold">إدارة الرتب</span>
                                <i class="fas fa-user-crown text-cyan-400"></i>
                            </button>
                            <div class="mt-4 pt-4 border-t border-white/5">
                                <p class="text-[10px] text-slate-600 mb-2">وقت العداد (ثانية)</p>
                                <input type="number" id="waitVal" onchange="updateWaitTime(this.value)" class="text-center font-bold !py-2">
                            </div>
                        </div>
                    </div>

                    <div class="glass p-8 rounded-[2.5rem]">
                        <h3 class="text-xs font-black text-slate-500 uppercase mb-4">الدعم</h3>
                        <button onclick="openSupport()" class="w-full btn-cyan py-4 rounded-2xl flex items-center justify-center gap-2 shadow-xl">
                            <i class="fas fa-comments"></i> شات مباشر
                        </button>
                    </div>
                </div>

                <div class="lg:col-span-9">
                    <div class="mb-10 text-right">
                        <h2 class="text-4xl font-black italic">أحدث <span class="text-cyan-400">الإصدارات</span></h2>
                        <div class="h-1 w-20 bg-cyan-400 mt-2 mr-0"></div>
                    </div>
                    <div id="postsFeed" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
                </div>
            </div>

            <div id="detailView" class="hidden max-w-4xl mx-auto animate__animated animate__fadeIn">
                <div id="timerContainer" class="py-24 text-center space-y-8">
                    <div class="relative inline-flex items-center justify-center">
                        <svg class="w-36 h-36 transform -rotate-90">
                            <circle cx="72" cy="72" r="64" stroke="#1e293b" stroke-width="10" fill="transparent" />
                            <circle id="ring" cx="72" cy="72" r="64" stroke="#06b6d4" stroke-width="10" fill="transparent" 
                                stroke-dasharray="402" stroke-dashoffset="402" class="loader-ring" />
                        </svg>
                        <span id="seconds" class="absolute text-5xl font-black italic"></span>
                    </div>
                    <div class="space-y-2">
                        <h3 class="text-2xl font-bold">جاري فحص الملفات...</h3>
                        <p class="text-slate-500">منصة Z Ahmed Tech تضمن لك أماناً بنسبة 100%</p>
                    </div>
                </div>

                <div id="fullPost" class="hidden space-y-8 text-right pb-32">
                    <button onclick="goHome()" class="text-cyan-400 font-bold flex items-center gap-2 hover:gap-4 transition-all">
                        <i class="fas fa-arrow-right"></i> الرجوع للرئيسية
                    </button>
                    <img id="fImg" class="w-full h-[500px] object-cover rounded-[3rem] shadow-2xl border-4 border-white/5">
                    <h1 id="fTitle" class="text-5xl font-black leading-tight"></h1>
                    <div class="flex items-center gap-4 py-4 border-y border-white/5 text-xs text-slate-500 font-bold uppercase tracking-widest">
                        <span id="fDate"></span> • <span>Z Ahmed Tech Certified</span>
                    </div>
                    <div id="fDesc" class="text-xl text-slate-300 leading-relaxed whitespace-pre-wrap"></div>
                    <div id="fAction" class="flex justify-center pt-10"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="modalOverlay" class="hidden fixed inset-0 z-[1000] bg-black/95 flex items-center justify-center p-4 backdrop-blur-md">
        <div class="glass w-full max-w-2xl p-10 rounded-[3rem] relative overflow-y-auto max-h-[90vh]">
            <button onclick="closeModal()" class="absolute top-8 left-8 text-2xl text-slate-600 hover:text-white transition"><i class="fas fa-times-circle"></i></button>
            <div id="modalBody" class="text-right"></div>
        </div>
    </div>

    <script>
        // 1. Firebase Init
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();
        const ADMIN_EMAIL = "ahmedgames2025.11@gmail.com";

        let userState = null;
        let waitTime = 5;
        let base64Image = "";

        // 2. Auth Core (إصلاح جوجل والبريد)
        async function loginWithEmail() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            if(!e || !p) return Swal.fire('تنبيه', 'يرجى ملء الحقول', 'warning');
            try { await auth.signInWithEmailAndPassword(e, p); } catch(err) { Swal.fire('خطأ', 'بيانات الدخول غير صحيحة', 'error'); }
        }

        async function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            try {
                const result = await auth.signInWithPopup(provider);
                console.log("Logged in:", result.user.email);
            } catch (error) {
                console.error(error);
                if(error.code === 'auth/popup-blocked') Swal.fire('تنبيه', 'يرجى السماح بالنوافذ المنبثقة في متصفحك', 'warning');
                else Swal.fire('فشل الاتصال', 'تأكد من إعدادات Firebase لـ Google', 'error');
            }
        }

        function logout() { auth.signOut().then(() => location.reload()); }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    userState = snap.val();
                    if(!userState) {
                        const role = (user.email === ADMIN_EMAIL) ? 'admin' : 'visitor';
                        db.ref('users/' + user.uid).set({ uid: user.uid, email: user.email, name: user.displayName || 'Tech User', role: role });
                        return;
                    }
                    if(userState.role === 'admin') document.body.classList.add('is-admin');
                    else document.body.classList.remove('is-admin');
                    
                    document.getElementById('authScreen').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    document.getElementById('navName').innerText = userState.name;
                    document.getElementById('navRole').innerText = userState.role;
                    
                    db.ref('settings/waitTime').on('value', s => { 
                        waitTime = s.val() || 5; 
                        if(document.getElementById('waitVal')) document.getElementById('waitVal').value = waitTime;
                    });
                    loadContent();
                });
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        // 3. Content Management (رفع الصور والنشر)
        function loadContent() {
            db.ref('posts').on('value', snap => {
                const feed = document.getElementById('postsFeed');
                feed.innerHTML = '';
                let data = []; snap.forEach(p => { data.unshift({id: p.key, ...p.val()}) });
                data.forEach(p => {
                    feed.innerHTML += `
                        <div class="post-card animate__animated animate__fadeInUp cursor-pointer group" onclick="viewPost('${p.id}')">
                            <div class="relative h-60 overflow-hidden">
                                <img src="${p.img}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 to-transparent opacity-60"></div>
                            </div>
                            <div class="p-6 text-right">
                                <h3 class="text-xl font-bold mb-4 group-hover:text-cyan-400 transition">${p.title}</h3>
                                <div class="flex justify-between items-center">
                                    <span class="text-[10px] text-slate-500 font-bold tracking-widest uppercase">${new Date(p.time).toLocaleDateString()}</span>
                                    <div class="admin-only">
                                        <button onclick="event.stopPropagation(); deletePost('${p.id}')" class="text-red-500 hover:scale-125 transition"><i class="fas fa-trash-alt"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                });
            });
        }

        async function viewPost(id) {
            const snap = await db.ref('posts/'+id).once('value');
            const post = snap.val();
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            window.scrollTo(0,0);

            if(userState.role === 'admin') { renderPost(post); return; }

            document.getElementById('timerContainer').classList.remove('hidden');
            document.getElementById('fullPost').classList.add('hidden');
            
            let count = waitTime;
            document.getElementById('seconds').innerText = count;
            const ring = document.getElementById('ring');
            
            const timer = setInterval(() => {
                count--;
                document.getElementById('seconds').innerText = count;
                ring.style.strokeDashoffset = 402 - (402 * (waitTime - count) / waitTime);
                if(count <= 0) { clearInterval(timer); renderPost(post); }
            }, 1000);
        }

        function renderPost(post) {
            document.getElementById('timerContainer').classList.add('hidden');
            document.getElementById('fullPost').classList.remove('hidden');
            document.getElementById('fImg').src = post.img;
            document.getElementById('fTitle').innerText = post.title;
            document.getElementById('fDesc').innerText = post.desc;
            document.getElementById('fDate').innerText = new Date(post.time).toLocaleString();
            document.getElementById('fAction').innerHTML = post.link ? `<a href="${post.link}" target="_blank" class="btn-cyan px-16 py-5 rounded-[2rem] text-xl shadow-2xl">انقر هنا للتحميل / الانتقال</a>` : '';
        }

        // 4. Admin Panels & Modal
        function openModal(mode) {
            const body = document.getElementById('modalBody');
            document.getElementById('modalOverlay').classList.remove('hidden');
            if(mode === 'addPost') {
                body.innerHTML = `
                    <h2 class="text-3xl font-black mb-8 text-cyan-400 italic">نشر محتوى جديد</h2>
                    <div class="space-y-4">
                        <input id="nT" placeholder="عنوان الموضوع">
                        <div class="p-8 border-2 border-dashed border-slate-800 rounded-3xl bg-slate-900/50 text-center">
                            <i class="fas fa-cloud-upload text-4xl mb-4 text-slate-600"></i>
                            <p class="text-xs text-slate-500 mb-4">اختر صورة من جهازك (سيتم رفعها فوراً)</p>
                            <input type="file" accept="image/*" onchange="handleImageUpload(event)" class="text-xs">
                            <img id="prev" class="hidden w-full h-44 object-cover rounded-2xl mt-4 border border-cyan-500/30">
                        </div>
                        <input id="nI" placeholder="أو ضع رابط صورة خارجي">
                        <textarea id="nD" placeholder="اكتب تفاصيل الموضوع هنا..." rows="6"></textarea>
                        <input id="nL" placeholder="رابط الزر (رابط الملف أو الموقع)">
                        <button onclick="savePost()" class="w-full btn-cyan py-5 rounded-2xl text-lg mt-4">نشر المحتوى الآن</button>
                    </div>`;
            } else if(mode === 'users') {
                body.innerHTML = `<h2 class="text-3xl font-black mb-8">إدارة الرتب</h2><div id="uList" class="space-y-4"></div>`;
                db.ref('users').once('value', s => {
                    const l = document.getElementById('uList');
                    s.forEach(u => {
                        l.innerHTML += `<div class="glass p-5 rounded-2xl flex justify-between items-center border border-white/5">
                            <select onchange="updateRole('${u.key}', this
