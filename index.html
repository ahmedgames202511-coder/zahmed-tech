<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصة المركزية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .cyber-card { border-radius: 2rem; border: 1px solid rgba(6, 182, 212, 0.1); transition: 0.3s; height: 100%; display: flex; flex-direction: column; }
        .cyber-card:hover { border-color: #06b6d4; box-shadow: 0 10px 30px rgba(6, 182, 212, 0.2); }
        .btn-cyan { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; transition: 0.3s; }
        input, textarea, select { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; width: 100%; padding: 1rem; border-radius: 1rem; outline: none; }
        input:focus, textarea:focus { border-color: #06b6d4 !important; }
        /* لتنسيق النصوص الطويلة */
        .long-text { white-space: pre-wrap; line-height: 1.8; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950 p-4">
        <div class="glass p-8 w-full max-w-md rounded-[2.5rem] text-center border border-cyan-500/20">
            <h1 class="text-3xl font-black mb-6">Z AHMED <span class="text-cyan-400">TECH</span></h1>
            <div class="space-y-4">
                <input id="email" type="email" placeholder="البريد الإلكتروني">
                <input id="pass" type="password" placeholder="كلمة المرور">
                <button onclick="login()" class="w-full btn-cyan py-4 rounded-xl font-bold">دخول</button>
                <div class="flex items-center gap-2 py-2"><hr class="flex-grow border-slate-800 text-xs text-slate-500"> أو <hr class="flex-grow border-slate-800"></div>
                <button onclick="googleSignIn()" class="w-full bg-white text-black py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-200 transition">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20"> بواسطة Google
                </button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="text-xl font-black tracking-tighter">Z AHMED <span class="text-cyan-400">TECH</span></div>
            <div class="flex items-center gap-4">
                <span id="navRole" class="text-[10px] bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full font-bold">USER</span>
                <button onclick="logout()" class="text-red-500"><i class="fas fa-power-off"></i></button>
            </div>
        </nav>

        <div class="container mx-auto p-4 lg:p-10 grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div id="sideMenu" class="space-y-4">
                <div id="adminPanel" class="hidden glass p-6 rounded-[2rem] border-r-4 border-cyan-500">
                    <h3 class="font-bold text-sm mb-4 text-slate-400">لوحة التحكم</h3>
                    <button onclick="openTab('addPost')" class="w-full text-right p-3 hover:bg-cyan-500/10 rounded-xl transition flex items-center gap-2">
                        <i class="fas fa-plus-circle text-cyan-400"></i> نشر مقال طويل
                    </button>
                    <button onclick="openTab('manageUsers')" class="w-full text-right p-3 hover:bg-cyan-500/10 rounded-xl transition flex items-center gap-2">
                        <i class="fas fa-users-cog text-cyan-400"></i> إدارة الحسابات
                    </button>
                </div>
            </div>

            <div class="lg:col-span-3">
                <h2 class="text-2xl font-black mb-8 border-r-4 border-cyan-500 pr-4">آخر المنشورات التقنية</h2>
                <div id="postsFeed" class="grid grid-cols-1 gap-8">
                    </div>
            </div>
        </div>
    </div>

    <div id="mainModal" class="hidden fixed inset-0 z-[2000] bg-black/95 flex items-center justify-center p-4">
        <div class="glass w-full max-w-3xl p-8 rounded-[2.5rem] relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-6 left-6 text-2xl hover:text-red-500"><i class="fas fa-times-circle"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // --- إعدادات Firebase ---
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com";
        let me = null;

        // --- وظائف الدخول ---
        async function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } catch(e) { Swal.fire('خطأ', 'بيانات الدخول غير صحيحة', 'error'); }
        }

        async function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const res = await auth.signInWithPopup(provider);
                const user = res.user;
                const snap = await db.ref('users/' + user.uid).once('value');
                if(!snap.exists()) {
                    await db.ref('users/' + user.uid).set({
                        uid: user.uid, email: user.email, name: user.displayName, 
                        role: user.email === MASTER_ADMIN ? 'admin' : 'visitor', pass: 'Google Login'
                    });
                }
            } catch(e) { Swal.fire('خطأ', 'فشل الدخول بجوجل', 'error'); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('authScreen').classList.add('hidden');
                        document.getElementById('mainApp').classList.remove('hidden');
                        document.getElementById('navRole').innerText = me.role.toUpperCase();
                        document.getElementById('adminPanel').classList.toggle('hidden', me.email !== MASTER_ADMIN && me.role !== 'admin');
                        loadPosts();
                    }
                });
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        // --- إدارة التبويبات ---
        function openTab(type) {
            const modal = document.getElementById('mainModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            content.innerHTML = '';

            if(type === 'addPost') {
                content.innerHTML = `
                    <h2 class="text-2xl font-black mb-6 text-cyan-400">📝 نشر مقال تقني جديد</h2>
                    <div class="space-y-4 text-right">
                        <div>
                            <label class="text-xs text-slate-500 mr-2">عنوان المقال</label>
                            <input id="postTitle" type="text" placeholder="ادخل عنواناً جذاباً...">
                        </div>
                        <div>
                            <label class="text-xs text-slate-500 mr-2">رابط صورة الغلاف</label>
                            <input id="postImg" type="url" placeholder="https://example.com/image.jpg">
                        </div>
                        <div>
                            <label class="text-xs text-slate-500 mr-2">رابط خارجي (اختياري)</label>
                            <input id="postLink" type="url" placeholder="https://zahmed-tech.com/more">
                        </div>
                        <div>
                            <label class="text-xs text-slate-500 mr-2">وصف المقال (يدعم النصوص الطويلة جداً)</label>
                            <textarea id="postDesc" rows="10" placeholder="اكتب محتوى المقال هنا... استخدم سطر جديد للفصل بين الفقرات."></textarea>
                        </div>
                        <button onclick="submitPost()" class="w-full btn-cyan py-4 rounded-xl font-black text-lg shadow-lg shadow-cyan-500/20">نشر الآن على المنصة</button>
                    </div>
                `;
            } else if(type === 'manageUsers') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6">👥 إدارة المستخدمين</h2><div id="uList" class="space-y-2"></div>`;
                db.ref('users').on('value', snap => {
                    const list = document.getElementById('uList');
                    list.innerHTML = '';
                    snap.forEach(u => {
                        const user = u.val();
                        if(user.email === MASTER_ADMIN) return;
                        list.innerHTML += `
                            <div class="flex justify-between items-center p-4 bg-slate-900 rounded-2xl border border-slate-800">
                                <div class="text-right">
                                    <p class="font-bold">${user.name} (${user.role})</p>
                                    <p class="text-xs text-red-400">الباسورد: ${user.pass}</p>
                                </div>
                                <button onclick="deleteUser('${u.key}')" class="text-red-500 hover:scale-110 transition"><i class="fas fa-trash-alt"></i></button>
                            </div>`;
                    });
                });
            }
        }

        // --- وظائف النشر والحذف ---
        async function submitPost() {
            const title = document.getElementById('postTitle').value;
            const img = document.getElementById('postImg').value;
            const desc = document.getElementById('postDesc').value;
            const link = document.getElementById('postLink').value;

            if(!title || !img || !desc) return Swal.fire('تنبيه', 'برجاء إكمال البيانات (العنوان، الصورة، والوصف)', 'warning');

            await db.ref('posts').push({
                title, img, desc, link,
                author: me.name,
                time: Date.now()
            });

            Swal.fire('نجاح', 'تم نشر المقال بنجاح', 'success');
            closeModal();
        }

        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const feed = document.getElementById('postsFeed');
                feed.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    feed.innerHTML += `
                        <div class="glass overflow-hidden cyber-card animate__animated animate__fadeInUp">
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <img src="${post.img}" class="w-full h-64 lg:h-full object-cover">
                                <div class="lg:col-span-2 p-8 text-right flex flex-col justify-between">
                                    <div>
                                        <div class="flex justify-between items-center mb-4">
                                            <span class="text-[10px] bg-cyan-500 text-black px-3 py-1 rounded-full font-black">LATEST POST</span>
                                            ${(me.role === 'admin' || me.email === MASTER_ADMIN) ? `<button onclick="deletePost('${p.key}')" class="text-red-500"><i class="fas fa-trash"></i></button>` : ''}
                                        </div>
                                        <h3 class="text-3xl font-black text-cyan-400 mb-6">${post.title}</h3>
                                        <div class="long-text text-slate-300 mb-6 text-lg">${post.desc}</div>
                                    </div>
                                    <div class="flex justify-between items-center border-t border-slate-800 pt-6 mt-4">
                                        <a href="${post.link || '#'}" target="_blank" class="text-cyan-500 font-bold flex items-center gap-2 hover:underline">
                                            <i class="fas fa-external-link-alt text-sm"></i> تفاصيل المصدر
                                        </a>
                                        <span class="text-xs text-slate-500 italic">بواسطة: ${post.author}</span>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                });
            });
        }

        async function deletePost(id) {
            const res = await Swal.fire({ title: 'حذف المنشور؟', icon: 'warning', showCancelButton: true, confirmButtonText: 'نعم، احذف' });
            if(res.isConfirmed) db.ref('posts/'+id).remove();
        }

        async function deleteUser(id) {
            const res = await Swal.fire({ title: 'طرد العضو؟', icon: 'warning', showCancelButton: true });
            if(res.isConfirmed) db.ref('users/'+id).remove();
        }

        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }
        function logout() { auth.signOut().then(() => location.reload()); }
    </script>
</body>
</html>
