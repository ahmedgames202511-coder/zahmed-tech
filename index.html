<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصة الرسمية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; scroll-behavior: smooth; overflow-x: hidden; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .cyber-card { border-radius: 1.5rem; border: 1px solid rgba(6, 182, 212, 0.1); transition: 0.3s; cursor: pointer; overflow: hidden; }
        .cyber-card:hover { border-color: #06b6d4; transform: translateY(-5px); background: rgba(6, 182, 212, 0.05); }
        .btn-cyan { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; transition: 0.3s; }
        .btn-cyan:hover { box-shadow: 0 0 20px rgba(6, 182, 212, 0.4); transform: scale(1.02); }
        input, textarea { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; border-radius: 12px !important; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }
        .post-img { width: 100%; height: 180px; object-cover: cover; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950 p-4">
        <div class="glass p-8 w-full max-w-md rounded-[2.5rem] text-center animate__animated animate__fadeIn">
            <h1 class="text-4xl font-black mb-2 tracking-tighter uppercase">Z Ahmed <span class="text-cyan-400">Tech</span></h1>
            <p class="text-slate-500 text-xs mb-8 italic">مرحباً بك في عالم التقنية</p>
            <div class="space-y-4">
                <button onclick="googleSignIn()" class="w-full bg-white text-black py-4 rounded-xl font-bold flex items-center justify-center gap-3 hover:bg-slate-200 transition">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20"> دخول سريع بجوجل
                </button>
                <div class="text-xs text-slate-600">أو الإدارة</div>
                <input id="email" type="email" placeholder="البريد" class="w-full p-4 outline-none">
                <input id="pass" type="password" placeholder="كلمة المرور" class="w-full p-4 outline-none">
                <button onclick="login()" class="w-full btn-cyan py-4 rounded-xl font-bold">دخول الإدارة</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="text-2xl font-black uppercase tracking-widest">Z <span class="text-cyan-400">Tech</span></div>
            <div class="flex items-center gap-4">
                <span id="navRole" class="text-[9px] font-bold bg-cyan-500/10 text-cyan-400 px-3 py-1 rounded-full border border-cyan-500/20">VISITOR</span>
                <button onclick="logout()" class="text-red-500 hover:scale-110 transition"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </nav>

        <div class="container mx-auto p-6 lg:p-12 grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="space-y-4">
                <div id="sideMenu" class="hidden glass p-6 rounded-3xl border border-white/5">
                    <p class="text-[10px] font-bold text-slate-500 mb-4 uppercase">لوحة التحكم</p>
                    <div class="space-y-2">
                        <button onclick="openTab('addPost')" class="w-full text-right p-3 hover:bg-white/5 rounded-xl transition text-sm flex items-center justify-between"><span>منشور جديد</span><i class="fas fa-plus-circle text-cyan-400"></i></button>
                        
                        <div id="onlyAdmin" class="hidden pt-2 border-t border-white/5 mt-2 space-y-2">
                            <button onclick="openTab('manageWorkers')" class="w-full text-right p-3 hover:bg-white/5 rounded-xl transition text-sm flex items-center justify-between"><span>إضافة موظف</span><i class="fas fa-user-shield text-cyan-400"></i></button>
                            
                            <div class="p-4 bg-slate-900/50 rounded-2xl border border-cyan-500/20 mt-4">
                                <p class="text-[9px] text-cyan-400 font-bold mb-1 tracking-tighter"><i class="fas fa-microchip mr-1"></i> AI ASSISTANT</p>
                                <p id="aiReport" class="text-[10px] text-slate-400 leading-tight">جاري التحليل...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3">
                <h2 class="text-2xl font-black mb-6">أحدث <span class="text-cyan-400">التحديثات</span></h2>
                <div id="postsFeed" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
            </div>
        </div>
    </div>

    <div id="mainModal" class="hidden fixed inset-0 z-[2000] bg-black/95 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass w-full max-w-2xl p-6 rounded-[2rem] relative animate__animated animate__fadeInUp overflow-y-auto max-h-[90vh]">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-xl text-slate-500 hover:text-cyan-400"><i class="fas fa-times"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();
        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com";
        let me = null;

        // --- Auth ---
        async function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const res = await auth.signInWithPopup(provider);
                const user = res.user;
                const approvedSnap = await db.ref('approved_workers').orderByValue().equalTo(user.email).once('value');
                const role = user.email === MASTER_ADMIN ? 'admin' : (approvedSnap.exists() ? 'worker' : 'visitor');
                await db.ref('users/' + user.uid).update({ uid: user.uid, email: user.email, name: user.displayName, role: role });
            } catch (err) { Swal.fire('خطأ', 'فشل تسجيل الدخول بجوجل', 'error'); }
        }

        async function login() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } catch { Swal.fire('خطأ', 'البيانات غير صحيحة', 'error'); }
        }

        function logout() { auth.signOut().then(() => location.reload()); }
        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('authScreen').classList.add('hidden');
                        document.getElementById('mainApp').classList.remove('hidden');
                        document.getElementById('navRole').innerText = me.role;
                        document.getElementById('sideMenu').classList.remove('hidden');
                        document.getElementById('onlyAdmin').classList.toggle('hidden', me.role !== 'admin');
                        loadPosts();
                        if(me.role === 'admin') runAI();
                    }
                });
            } else { document.getElementById('authScreen').classList.remove('hidden'); }
        });

        // --- ميزة رفع الصور ---
        function handleFile(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => { document.getElementById('pI').value = e.target.result; };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- عرض المنشورات (كروت بدون وصف) ---
        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const feed = document.getElementById('postsFeed'); feed.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    feed.innerHTML += `
                        <div class="cyber-card glass animate__animated animate__fadeIn" onclick="viewPost('${p.key}')">
                            <img src="${post.img || 'https://via.placeholder.com/400x200'}" class="post-img">
                            <div class="p-4 text-right">
                                <h3 class="font-bold text-sm mb-1">${post.title}</h3>
                                <p class="text-[10px] text-cyan-400 uppercase tracking-tighter">إضغط لعرض التفاصيل <i class="fas fa-arrow-left ml-1"></i></p>
                                ${me.role === 'admin' ? `
                                    <div class="mt-3 flex gap-3 border-t border-white/5 pt-3" onclick="event.stopPropagation()">
                                        <button onclick="deletePost('${p.key}')" class="text-red-500 text-[10px]"><i class="fas fa-trash"></i> حذف</button>
                                        <button onclick="editPost('${p.key}')" class="text-cyan-400 text-[10px]"><i class="fas fa-edit"></i> تعديل</button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>`;
                });
            });
        }

        // --- صفحة عرض الخبر المخصصة (إظهار الوصف) ---
        async function viewPost(id) {
            const snap = await db.ref('posts/' + id).once('value');
            const post = snap.val();
            const content = document.getElementById('modalContent');
            document.getElementById('mainModal').classList.remove('hidden');
            
            content.innerHTML = `
                <div class="text-right">
                    <img src="${post.img}" class="w-full h-64 object-cover rounded-2xl mb-4 shadow-lg border border-white/10">
                    <h2 class="text-2xl font-black mb-2 text-white">${post.title}</h2>
                    <p class="text-[10px] text-slate-500 mb-4 italic">بواسطة: ${post.author || 'Z Ahmed Tech'} | ${new Date(post.time).toLocaleDateString('ar-EG')}</p>
                    <div class="p-5 bg-white/5 rounded-2xl border border-white/5 leading-relaxed text-slate-300 text-sm whitespace-pre-wrap">
                        ${post.desc}
                    </div>
                </div>`;
        }

        // --- لوحة التحكم (إضافة خبر) ---
        function openTab(type, data = null, id = null) {
            const content = document.getElementById('modalContent');
            document.getElementById('mainModal').classList.remove('hidden');
            
            if(type === 'addPost' || type === 'editPost') {
                content.innerHTML = `
                    <div class="text-right space-y-4">
                        <h2 class="text-xl font-bold text-cyan-400">نشر خبر جديد</h2>
                        <input id="pT" placeholder="عنوان الخبر" class="w-full p-4 outline-none" value="${data?.title || ''}">
                        <div class="flex gap-2">
                            <input id="pI" placeholder="رابط صورة" class="flex-grow p-4 outline-none text-xs" value="${data?.img || ''}">
                            <input type="file" onchange="handleFile(this)" class="w-1/3 p-2 bg-slate-800 rounded-xl text-[10px]">
                        </div>
                        <textarea id="pD" placeholder="اكتب وصف الخبر هنا (سيظهر عند الضغط فقط)..." class="w-full p-4 outline-none" rows="6">${data?.desc || ''}</textarea>
                        <button onclick="savePost('${id}')" class="w-full btn-cyan py-4 rounded-xl font-bold shadow-lg">حفظ ونشر</button>
                    </div>`;
            }
        }

        async function savePost(id = null) {
            const post = { title: document.getElementById('pT').value, img: document.getElementById('pI').value, desc: document.getElementById('pD').value, author: me.name, time: Date.now() };
            if(!post.title || !post.desc) return Swal.fire('تنبيه', 'أدخل العنوان والوصف', 'warning');
            
            if(id && id !== 'null') await db.ref('posts/'+id).update(post);
            else await db.ref('posts').push(post);
            
            closeModal();
            Swal.fire('نجاح', 'تم تحديث المنصة', 'success');
        }

        async function runAI() {
            const u = await db.ref('users').once('value');
            const p = await db.ref('posts').once('value');
            document.getElementById('aiReport').innerHTML = `أهلاً أحمد، تم رصد <b>${u.numChildren()}</b> مستخدم و <b>${p.numChildren()}</b> منشور فعال. الحالة: ممتاز.`;
        }

        function deletePost(id) { 
            Swal.fire({title:'متأكد؟', icon:'warning', showCancelButton:true, confirmButtonText:'حذف'}).then(r => { if(r.isConfirmed) db.ref('posts/'+id).remove(); });
        }
    </script>
</body>
                        </html>
