<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Ahmed Tech | المنصة الرسمية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; scroll-behavior: smooth; overflow-x: hidden; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .cyber-card { border-radius: 2rem; border: 1px solid rgba(6, 182, 212, 0.15); transition: 0.3s; cursor: pointer; }
        .cyber-card:hover { border-color: #06b6d4; box-shadow: 0 10px 30px rgba(6, 182, 212, 0.1); transform: translateY(-5px); }
        .btn-cyan { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; transition: 0.3s; }
        .btn-cyan:hover { box-shadow: 0 0 20px rgba(6, 182, 212, 0.4); transform: scale(1.02); }
        input, textarea { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; }
        .chat-box { height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 10px; }
        .preview-box { border: 2px dashed #1e293b; padding: 20px; border-radius: 20px; min-height: 150px; }
        .ai-glow { box-shadow: 0 0 15px rgba(6, 182, 212, 0.2); border: 1px solid rgba(6, 182, 212, 0.3); }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950 p-4">
        <div class="glass p-8 w-full max-w-md rounded-[2.5rem] text-center cyber-card animate__animated animate__zoomIn">
            <h1 class="text-4xl font-black mb-2 tracking-tighter uppercase">Z Ahmed <span class="text-cyan-400">Tech</span></h1>
            <p class="text-slate-500 text-xs mb-8">تسجيل الدخول للمنصة</p>
            <div class="space-y-4">
                <button onclick="googleSignIn()" class="w-full bg-white text-black py-4 rounded-xl font-bold flex items-center justify-center gap-3">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20"> الدخول عبر جوجل
                </button>
                <div class="py-2 text-xs text-slate-600">أو الإدارة فقط</div>
                <input id="email" type="email" placeholder="البريد" class="w-full p-4 rounded-xl outline-none">
                <input id="pass" type="password" placeholder="كلمة المرور" class="w-full p-4 rounded-xl outline-none">
                <button onclick="login()" class="w-full btn-cyan py-4 rounded-xl font-bold">دخول الإدارة</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-white/5">
            <div class="text-2xl font-black uppercase">Z Ahmed <span class="text-cyan-400">Tech</span></div>
            <div class="flex items-center gap-4">
                <span id="navRole" class="text-[10px] font-bold bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full uppercase">USER</span>
                <button onclick="logout()" class="text-red-500 hover:scale-110 transition"><i class="fas fa-power-off text-xl"></i></button>
            </div>
        </nav>

        <div class="container mx-auto p-4 lg:p-10 grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="space-y-6">
                <div id="sideMenu" class="hidden glass p-6 rounded-[2rem] border-r-4 border-cyan-500">
                    <h3 class="font-black text-xs text-slate-500 mb-6 uppercase text-right">لوحة القيادة</h3>
                    <div class="space-y-2 text-right">
                        <button onclick="openTab('addPost')" class="w-full p-3 hover:bg-white/5 rounded-xl transition flex items-center gap-3"><i class="fas fa-edit text-cyan-400"></i> منشور جديد</button>
                        
                        <div id="onlyAdmin" class="hidden space-y-2 pt-2 border-t border-white/5 mt-2">
                            <button onclick="openTab('manageWorkers')" class="w-full p-3 hover:bg-white/5 rounded-xl transition flex items-center gap-3"><i class="fas fa-user-plus text-cyan-400"></i> إضافة موظف</button>
                            <button onclick="openTab('viewRatings')" class="w-full p-3 hover:bg-white/5 rounded-xl transition flex items-center gap-3"><i class="fas fa-star text-yellow-400"></i> سجل التقييمات</button>
                            <button onclick="openTab('monitorChats')" class="w-full p-3 hover:bg-white/5 rounded-xl transition flex items-center gap-3"><i class="fas fa-eye text-emerald-400"></i> مراقبة البث المباشر</button>
                            
                            <div id="aiBox" class="mt-4 p-4 rounded-2xl bg-slate-900/50 ai-glow">
                                <div class="flex items-center gap-2 mb-2">
                                    <i class="fas fa-robot text-cyan-400 animate-bounce"></i>
                                    <span class="text-[10px] font-bold text-cyan-400 uppercase">Z-AI Assistant</span>
                                </div>
                                <p id="aiReport" class="text-[10px] text-slate-400 leading-relaxed italic">جاري تحليل بيانات المنصة...</p>
                            </div>
                        </div>
                        
                        <button onclick="openTab('contactUsers')" class="w-full p-3 hover:bg-white/5 rounded-xl transition flex items-center gap-3"><i class="fas fa-users text-cyan-400"></i> مراسلة الزوار</button>
                    </div>
                </div>

                <button id="supportBtn" onclick="startSupportRequest()" class="w-full btn-cyan p-5 rounded-3xl font-black flex items-center justify-center gap-4 shadow-xl">
                    <i class="fas fa-headset text-2xl"></i> اطلب مساعدة
                </button>
            </div>

            <div class="lg:col-span-3 space-y-8">
                <div class="flex justify-between items-end">
                    <div>
                        <h2 class="text-3xl font-black">آخر <span class="text-cyan-400">التحديثات</span></h2>
                        <p class="text-slate-500 text-sm mt-1">اضغط على الخبر لقراءته بالكامل</p>
                    </div>
                </div>
                <div id="postsFeed" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
            </div>
        </div>
    </div>

    <div id="mainModal" class="hidden fixed inset-0 z-[2000] bg-black/95 flex items-center justify-center p-4">
        <div class="glass w-full max-w-3xl p-8 rounded-[3rem] relative animate__animated animate__zoomIn overflow-y-auto max-h-[90vh]">
            <button onclick="closeModal()" class="absolute top-6 left-6 text-2xl hover:text-cyan-400 transition z-50"><i class="fas fa-times-circle"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAqSQLHq0QFpe1CV8bAYc53mbUO7I03Q5I",
            authDomain: "z-ahmed-tech.firebaseapp.com",
            databaseURL: "https://z-ahmed-tech-default-rtdb.firebaseio.com",
            projectId: "z-ahmed-tech",
            storageBucket: "z-ahmed-tech.firebasestorage.app",
            messagingSenderId: "422229166590",
            appId: "1:422229166590:web:67e75f72cd8ea1dd5058af"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();
        const MASTER_ADMIN = "ahmedgames2025.11@gmail.com";
        let me = null;

        // --- AUTH ---
        async function googleSignIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const res = await auth.signInWithPopup(provider);
                const user = res.user;
                const approvedSnap = await db.ref('approved_workers').orderByValue().equalTo(user.email).once('value');
                const role = user.email === MASTER_ADMIN ? 'admin' : (approvedSnap.exists() ? 'worker' : 'visitor');
                await db.ref('users/' + user.uid).update({ uid: user.uid, email: user.email, name: user.displayName, role: role });
            } catch (err) { Swal.fire('Error', err.message, 'error'); }
        }

        async function login() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } catch { Swal.fire('خطأ', 'بيانات غير صحيحة', 'error'); }
        }

        function logout() { auth.signOut().then(() => location.reload()); }
        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/' + user.uid).on('value', snap => {
                    me = snap.val();
                    if(me) {
                        document.getElementById('authScreen').classList.add('hidden');
                        document.getElementById('mainApp').classList.remove('hidden');
                        document.getElementById('navRole').innerText = me.role;
                        document.getElementById('sideMenu').classList.remove('hidden');
                        document.getElementById('sideMenu').classList.toggle('hidden', me.role === 'visitor');
                        document.getElementById('onlyAdmin').classList.toggle('hidden', me.role !== 'admin');
                        document.getElementById('supportBtn').classList.toggle('hidden', me.role !== 'visitor');
                        loadPosts();
                        if(me.role === 'admin') runAiAssistant();
                    }
                });
            } else { document.getElementById('authScreen').classList.remove('hidden'); }
        });

        // --- ميزة رفع الصور ---
        function handleFileUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('pI').value = e.target.result;
                    updatePreview();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- إدارة التبويبات (مودال الإضافة) ---
        function openTab(type, postData = null, postId = null) {
            const content = document.getElementById('modalContent');
            document.getElementById('mainModal').classList.remove('hidden');
            content.innerHTML = '';

            if(type === 'addPost' || type === 'editPost') {
                content.innerHTML = `
                    <h2 class="text-2xl font-black mb-6 text-cyan-400 text-right">${type === 'editPost' ? 'تعديل المنشور' : 'نشر جديد'}</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-4 text-right">
                            <input id="pT" placeholder="عنوان الخبر" class="w-full p-4 rounded-xl outline-none" value="${postData?.title || ''}">
                            <div class="space-y-1">
                                <label class="text-[10px] text-slate-500">رابط الصورة (URL)</label>
                                <input id="pI" oninput="updatePreview()" placeholder="https://..." class="w-full p-4 rounded-xl outline-none" value="${postData?.img || ''}">
                                <div class="text-center text-[10px] py-1">أو</div>
                                <input type="file" accept="image/*" onchange="handleFileUpload(this)" class="w-full text-xs text-slate-400">
                            </div>
                            <textarea id="pD" oninput="updatePreview()" placeholder="اكتب تفاصيل الخبر هنا..." class="w-full p-4 rounded-xl outline-none" rows="6">${postData?.desc || ''}</textarea>
                            <button onclick="savePost('${postId}')" class="w-full btn-cyan py-4 rounded-xl font-bold">حفظ ونشر</button>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-slate-500 mb-2">معاينة التنسيق:</p>
                            <div id="previewArea" class="preview-box glass"></div>
                        </div>
                    </div>`;
                updatePreview();
            }
            else if(type === 'viewRatings') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6 text-yellow-400 text-right">⭐ تقييمات الزوار</h2><div id="ratingsList" class="space-y-3"></div>`;
                db.ref('ratings').on('value', snap => {
                    const list = document.getElementById('ratingsList'); if(!list) return;
                    list.innerHTML = '';
                    snap.forEach(r => {
                        list.innerHTML += `<div class="p-4 bg-white/5 rounded-2xl flex justify-between items-center border border-white/5 text-right">
                            <div class="text-yellow-400">${'★'.repeat(r.val().stars)}</div>
                            <div><p class="font-bold">${r.val().visitorName}</p><p class="text-[10px] text-slate-500">${new Date(r.val().time).toLocaleString('ar-EG')}</p></div>
                        </div>`;
                    });
                });
            }
            else if(type === 'monitorChats') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6 text-emerald-400 text-right">👁️ مراقبة المحادثات</h2><div id="monitorList" class="space-y-3"></div>`;
                db.ref('chats').on('value', snap => {
                    const list = document.getElementById('monitorList'); if(!list) return;
                    list.innerHTML = '';
                    snap.forEach(c => {
                        list.innerHTML += `<div onclick="viewChatLive('${c.key}')" class="p-4 bg-white/5 rounded-2xl flex justify-between cursor-pointer hover:bg-emerald-500/10">
                            <i class="fas fa-eye text-emerald-400"></i><span>${c.val().visitorName}</span>
                        </div>`;
                    });
                });
            }
            else if(type === 'contactUsers') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6 text-cyan-400 text-right">الزوار</h2><div id="usersList" class="space-y-3 text-right"></div>`;
                db.ref('users').orderByChild('role').equalTo('visitor').on('value', snap => {
                    const list = document.getElementById('usersList'); if(!list) return;
                    list.innerHTML = '';
                    snap.forEach(u => {
                        list.innerHTML += `<div onclick="openChatUI('${u.key}')" class="p-4 bg-white/5 rounded-2xl flex justify-between items-center cursor-pointer hover:bg-cyan-500/10">
                            <i class="fas fa-paper-plane text-cyan-400"></i><span>${u.val().name}</span>
                        </div>`;
                    });
                });
            }
            else if(type === 'manageWorkers') {
                content.innerHTML = `<h2 class="text-2xl font-black mb-6 text-cyan-400 text-right">اعتماد موظف</h2><input id="wE" placeholder="البريد الإلكتروني" class="w-full p-4 rounded-xl outline-none mb-4"><button onclick="addWorker()" class="w-full btn-cyan py-4 rounded-xl font-bold">إضافة للقائمة البيضاء</button>`;
            }
        }

        // --- المساعد الذكي ---
        async function runAiAssistant() {
            const aiText = document.getElementById('aiReport');
            const [u, p, r] = await Promise.all([
                db.ref('users').once('value'),
                db.ref('posts').once('value'),
                db.ref('ratings').once('value')
            ]);
            setTimeout(() => {
                aiText.innerHTML = `مرحباً أحمد! يوجد حالياً <b>${u.numChildren()}</b> مستخدماً، <b>${p.numChildren()}</b> منشوراً، و <b>${r.numChildren()}</b> تقييمات. المنصة مستقرة تقنياً.`;
            }, 1000);
        }

        // --- عرض الخبر (الصفحة المنفصلة) ---
        async function viewFullPost(id) {
            const snap = await db.ref('posts/'+id).once('value');
            const post = snap.val();
            const content = document.getElementById('modalContent');
            document.getElementById('mainModal').classList.remove('hidden');
            content.innerHTML = `
                <div class="text-right">
                    <img src="${post.img}" class="w-full h-72 object-cover rounded-[2.5rem] mb-6 shadow-2xl border border-white/10">
                    <h1 class="text-3xl font-black mb-2">${post.title}</h1>
                    <p class="text-xs text-slate-500 mb-6 flex items-center justify-end gap-2">
                        <span>${new Date(post.time).toLocaleDateString('ar-EG')}</span> <i class="far fa-calendar"></i> 
                        <span>بواسطة: ${post.author}</span> <i class="far fa-user"></i>
                    </p>
                    <div class="bg-white/5 p-8 rounded-3xl border border-white/5 leading-relaxed text-slate-300 text-lg whitespace-pre-line">
                        ${post.desc}
                    </div>
                </div>`;
        }

        // --- الأساسيات ---
        function updatePreview() {
            const t = document.getElementById('pT')?.value || "العنوان هنا";
            const i = document.getElementById('pI')?.value || "https://via.placeholder.com/400x200";
            const area = document.getElementById('previewArea');
            if(area) area.innerHTML = `<div class="rounded-2xl overflow-hidden border border-white/5 bg-slate-900"><img src="${i}" class="w-full h-32 object-cover"><div class="p-3 text-right"><h4 class="font-bold text-white text-xs">${t}</h4><p class="text-[9px] text-slate-400">انقر لمشاهدة التفاصيل...</p></div></div>`;
        }

        async function savePost(id = null) {
            const post = { title: document.getElementById('pT').value, img: document.getElementById('pI').value, desc: document.getElementById('pD').value, author: me.name, time: Date.now() };
            if(!post.title || !post.desc) return Swal.fire('تنبيه', 'أكمل البيانات', 'warning');
            if(id && id !== 'null') await db.ref('posts/'+id).update(post);
            else await db.ref('posts').push(post);
            closeModal();
            Swal.fire('نجاح', 'تم النشر بنجاح', 'success');
        }

        function loadPosts() {
            db.ref('posts').on('value', snap => {
                const feed = document.getElementById('postsFeed'); feed.innerHTML = '';
                snap.forEach(p => {
                    const post = p.val();
                    feed.innerHTML += `
                        <div class="glass rounded-[2rem] overflow-hidden cyber-card" onclick="viewFullPost('${p.key}')">
                            <img src="${post.img}" class="w-full h-48 object-cover">
                            <div class="p-6 text-right">
                                <h3 class="text-xl font-black mb-2">${post.title}</h3>
                                <p class="text-cyan-400 text-xs italic"
